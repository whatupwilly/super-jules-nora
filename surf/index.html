const cv = document.getElementById("game"), g = cv.getContext("2d");

function resize() { DPR = Math.min(window.devicePixelRatio || 1, 2.5); W = window.innerWidth; H = window.innerHeight; cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR); cv.style.width = W + "px"; cv.style.height = H + "px"; }
window.addEventListener("resize", resize); window.addEventListener("orientationchange", () => setTimeout(resize, 200)); resize();

/* ------------------------------ helpers ------------------------------ */
const rnd = (a, b) => a + Math.random() * (b - a), ri = (a, b) => Math.floor(rnd(a, b + 1)), pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v)), lerp = (a, b, t) => a + (b - a) * t, $ = id => document.getElementById(id);
const smooth = t => t * t * (3 - 2 * t);
function hash(x, y) { let n = (x * 374761393 + y * 668265263) | 0; n = (n ^ (n >> 13)) * 1274126177; return ((n ^ (n >> 16)) & 1023) / 1023; }
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
function rgb(col) { const n = parseInt(col.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
function hex(r, gg, b) { return "#" + [r, gg, b].map(v => clamp(Math.round(v), 0, 255).toString(16).padStart(2, "0")).join(""); }
function mix(a, b, t) { const A = rgb(a), B = rgb(b); return hex(lerp(A[0], B[0], t), lerp(A[1], B[1], t), lerp(A[2], B[2], t)); }
function shade(col, k) { const [r, gg, b] = rgb(col); return hex(r * k, gg * k, b * k); }
function tint(col, k) { const [r, gg, b] = rgb(col); return hex(r + (255 - r) * k, gg + (255 - gg) * k, b + (255 - b) * k); }

function rr(c, x, y, w, h, r, col) { c.fillStyle = col; c.beginPath(); c.roundRect(x, y, w, h, Math.min(r, w / 2, h / 2)); c.fill(); }
function ell(c, x, y, rx, ry, col) { c.fillStyle = col; c.beginPath(); c.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); c.fill(); }

/* ------------------------------ sound: a real ocean, made of noise ------------------------------ */
let AC = null, ocean = null;
function audio() {
  if (AC) { if (AC.state === "suspended") AC.resume(); return; }
  try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; }
  // waves: pink-ish noise through a low-pass whose cutoff and volume swell slowly, like sets rolling in
  const len = AC.sampleRate * 4, buf = AC.createBuffer(1, len, AC.sampleRate), d = buf.getChannelData(0);
  let b0 = 0, b1 = 0, b2 = 0; for (let i = 0; i < len; i++) { const w = Math.random() * 2 - 1; b0 = .997 * b0 + w * .03; b1 = .985 * b1 + w * .02; b2 = .95 * b2 + w * .01; d[i] = (b0 + b1 + b2 + w * .005) * 3; }
  const src = AC.createBufferSource(); src.buffer = buf; src.loop = true;
  const lp = AC.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 700; lp.Q.value = .6;
  const gain = AC.createGain(); gain.gain.value = 0;
  src.connect(lp); lp.connect(gain); gain.connect(AC.destination); src.start();
  ocean = { gain, lp, level: 0 };
}
function setOcean(level) { if (ocean) ocean.level = level; }
function tone(freq, dur, type, vol, slide, delay) { if (!AC) return; const o = AC.createOscillator(), gn = AC.createGain(), t0 = AC.currentTime + (delay || 0); o.type = type || "sine"; o.frequency.setValueAtTime(freq, t0); if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, freq + slide), t0 + dur); gn.gain.setValueAtTime(vol || .1, t0); gn.gain.exponentialRampToValueAtTime(.0001, t0 + dur); o.connect(gn); gn.connect(AC.destination); o.start(t0); o.stop(t0 + dur + .05); }
function noise(dur, vol, hp, delay) { if (!AC) return; const n = Math.floor(AC.sampleRate * dur), buf = AC.createBuffer(1, n, AC.sampleRate), d = buf.getChannelData(0); for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n); const s = AC.createBufferSource(); s.buffer = buf; const f = AC.createBiquadFilter(); f.type = hp ? "highpass" : "lowpass"; f.frequency.value = hp || 900; const gn = AC.createGain(); const t0 = AC.currentTime + (delay || 0); gn.gain.setValueAtTime(vol, t0); gn.gain.exponentialRampToValueAtTime(.0001, t0 + dur); s.connect(f); f.connect(gn); gn.connect(AC.destination); s.start(t0); }

    <div class="lbl">Main color</div>${SUIT_COLS.map(c => `<span class="sw ${su.col === c ? "on" : ""}" data-act="wear" data-k="col" data-v="${c}" style="background:${c}"></span>`).join("")}
    <div class="lbl">Second color</div>${SUIT_COLS.map(c => `<span class="sw ${su.col2 === c ? "on" : ""}" data-act="wear" data-k="col2" data-v="${c}" style="background:${c}"></span>`).join("")}
    <div class="lbl">Board</div><div class="chips">${BOARDS.filter(b => S.ownedBoards.includes(b.id)).map(b => `<button class="${S.board === b.id ? "on" : ""}" data-act="ride" data-v="${b.id}">${b.icon} ${b.name}</button>`).join("")}</div>
    <div class="row" style="margin-top:12px"><button class="btn" data-act="hub">✓ Done</button><button class="btn alt" data-act="shop">🛍 Shop</button></div></div></div>`);
}
ACTS.closet = () => showCloset(); ACTS.wear = d => { mySuit()[d.k] = d.v; save(); showCloset(); }; ACTS.ride = d => { S.board = d.v; save(); showCloset(); };
/* --- contests --- */
const TIERS = [
  { id: "beginner", name: "Beginner Bash", icon: "🐣", fee: 0, waves: 2, time: 35, prizes: [60, 40, 20], par: 500, rivals: ["Icy", "Appy", "Squishy", "Cutie"] },
  { id: "intermediate", name: "Sunset Shred", icon: "🌅", fee: 20, waves: 2, time: 40, prizes: [150, 90, 40], par: 1100, rivals: ["Misty", "Bamboo", "Nora", "Chun Mi"] },
  { id: "advanced", name: "Big Wave Open", icon: "🌊", fee: 50, waves: 3, time: 40, prizes: [300, 180, 80], par: 2000, rivals: ["Sparkle", "Northern Light", "Rosalina", "Jules"] },
  { id: "pro", name: "World Pro Finals", icon: "🏆", fee: 100, waves: 3, time: 45, prizes: [600, 350, 150], par: 3400, rivals: ["Sparkle", "Chun Mi", "Northern Light", "Misty"] },
];
let C = null;
function showContests() {
  S.state = "contests";
  modal(`<h2>🏆 Contest sign-up board</h2><p>Judges score every wave. Win first place to take the trophy and unlock the next contest.</p>
    ${TIERS.map((t, i) => { const locked = i > S.tier; return `<div class="place ${locked ? "" : "me"}" style="align-items:center"><div><div>${t.icon} ${t.name} ${locked ? "🔒" : ""}</div><div style="font-size:11px;color:#5b7a93;font-weight:600">${t.waves} waves · entry ${t.fee ? "$" + t.fee : "free"} · prizes $${t.prizes.join(" / $")} · won ${S.trophies[t.id]}×</div></div><button class="btn ${locked ? "alt" : "sun"}" data-act="enter" data-i="${i}" ${locked ? "disabled" : ""} style="padding:8px 12px">Enter</button></div>`; }).join("")}
    <div class="row"><button class="btn alt" data-act="hub">‹ Beach</button></div>`);
}
ACTS.contests = () => showContests();
ACTS.enter = d => { const t = TIERS[+d.i]; if (t.fee && !pay(t.fee)) return; C = { t, wave: 0, scores: [], judges: [] }; modal(`<div style="text-align:center"><div style="font-size:44px">${t.icon}</div><h2>${t.name}</h2><p>${t.waves} waves, ${t.time} seconds each. Do as many tricks as you can — barrels, airs and combos score big. A wipeout ends the wave!</p><p>Your rivals: ${t.rivals.map(r => `<b>${r}</b>`).join(", ")}</p><div class="row" style="justify-content:center"><button class="btn big sun" data-act="nextWave">🏄 Paddle out!</button></div></div>`); SFX.horn(); };
ACTS.nextWave = () => { C.wave++; startRun("contest", { time: C.t.time, wave: C.wave, waves: C.t.waves, tierName: C.t.name }); };
function judgeScores(score, par) { const base = clamp(score / par * 8.5, .5, 10); return [0, 1, 2].map(i => clamp(base + (hash(score + i, i) - .5) * .9, .5, 10).toFixed(1)); }
function contestWaveDone() {
  C.scores.push(R.score); const js = judgeScores(R.score, C.t.par); C.judges.push(js);
  $("hud").hidden = true; $("pauseBtn").hidden = true; setOcean(.4);
  if (C.wave < C.t.waves) { modal(`<div style="text-align:center"><h2>Wave ${C.wave} of ${C.t.waves}</h2><div class="judge"><b>${js[0]}</b><span>Judge Coral</span></div><div class="judge"><b>${js[1]}</b><span>Judge Finn</span></div><div class="judge"><b>${js[2]}</b><span>Judge Sandy</span></div><p>Wave score: <b>${R.score}</b>${R.wipeouts ? " (wipeout!)" : ""}</p><p>${R.score >= C.t.par * .7 ? "The crowd is going wild! 🎉" : "Try an air or a barrel on the next one!"}</p><div class="row" style="justify-content:center"><button class="btn big sun" data-act="nextWave">🌊 Next wave</button></div></div>`); SFX.cheer(); return; }
  // final: total of your waves against the rivals
  const total = C.scores.reduce((a, b) => a + b, 0), t = C.t;
  const rivals = t.rivals.map((n, i) => ({ name: n, score: Math.round(t.par * t.waves * .55 * (.7 + hash(S.runs + i, i) * .75)) }));
  const all = rivals.concat([{ name: surferName() + " (you)", score: total, me: true }]).sort((a, b) => b.score - a.score);
  const place = all.findIndex(x => x.me), prize = t.prizes[place] || 0;
  S.money += prize; if (place === 0) { S.trophies[t.id]++; const ti = TIERS.indexOf(t); if (ti >= S.tier && ti < TIERS.length - 1) S.tier = ti + 1; } save();
  modal(`<div style="text-align:center"><div style="font-size:48px">${place === 0 ? "🏆" : place === 1 ? "🥈" : place === 2 ? "🥉" : "🌊"}</div><h2>${place === 0 ? "YOU WON " + t.name + "!" : place < 3 ? "Podium! " + ["", "2nd", "3rd"][place] + " place" : "Nice surfing — " + (place + 1) + "th place"}</h2>
    ${all.map(x => `<div class="place ${x.me ? "me" : ""}"><span>${x.me ? "⭐ " : ""}${x.name}</span><span>${x.score}</span></div>`).join("")}
    <p>${prize ? `Prize: <b>$${prize}</b>` : "No prize this time — keep practicing!"}${place === 0 && TIERS.indexOf(t) < TIERS.length - 1 ? `<br>🔓 You unlocked <b>${TIERS[TIERS.indexOf(t) + 1].name}</b>!` : ""}</p>
    <div class="row" style="justify-content:center"><button class="btn big" data-act="contests">🏆 Contests</button><button class="btn alt" data-act="hub">🏖 Beach</button></div></div>`);
  if (place === 0) SFX.yay(); SFX.cheer(); C = null;
}
function showResults(why) {
  $("hud").hidden = true; $("pauseBtn").hidden = true;
  const top = R.tricks.slice().sort((a, b) => b.p - a.p).slice(0, 5);
  modal(`<div style="text-align:center"><div style="font-size:44px">🌊</div><h2>${why || "Wave's over!"}</h2><p>Score <b>${R.score}</b>${R.score >= S.best && R.score > 0 ? " — new best! ⭐" : ""} · earned <b>$${Math.round(R.money)}</b> · ${R.tricks.length} tricks · ${R.wipeouts} wipeout${R.wipeouts === 1 ? "" : "s"}</p>
    ${top.length ? `<div style="text-align:left;display:inline-block">${top.map(t => `<div class="place"><span>${t.name}</span><span>+${t.p}</span></div>`).join("")}</div>` : "<p>Ride up to the lip and swipe ↑ for an air!</p>"}
    <div class="row" style="justify-content:center"><button class="btn big" data-act="free">🏄 Surf again</button><button class="btn alt" data-act="hub">🏖 Beach</button></div></div>`);
  SFX.cheer();
}
function showPause() { modal(`<div style="text-align:center"><h2>⏸ Paused</h2><p>${R.mode === "contest" ? "Quitting forfeits this contest." : "Quitting keeps the money you've earned so far."}</p><div class="row" style="justify-content:center"><button class="btn big" data-act="resume">▶ Keep surfing</button><button class="btn alt" data-act="quitRun">🏖 Back to the beach</button></div></div>`); }
ACTS.resume = () => closeModal();
ACTS.quitRun = () => { if (!R) return; R.done = true; S.money += Math.round(R.money); save(); C = null; R = null; showHub(); };
$("pauseBtn").addEventListener("click", () => { audio(); if (S.state === "run" && R && !R.done) showPause(); });

/* ------------------------------ input: swipes, drags, holds, keys ------------------------------ */
cv.addEventListener("pointerdown", e => { audio(); if (S.state !== "run" || !R) return; input.down = true; input.x0 = e.clientX; input.y0 = e.clientY; input.t0 = performance.now(); input.moved = false; input.holdT = 0; input.steer = 0; cv.setPointerCapture(e.pointerId); });
cv.addEventListener("pointermove", e => {
  if (!input.down || !R) return; const dx = e.clientX - input.x0, dy = e.clientY - input.y0, dt = performance.now() - input.t0;
  if (!input.moved && Math.hypot(dx, dy) > 10) input.moved = true;
  if (R.air) { if (dt < 320 && Math.hypot(dx, dy) > 44) { doSwipe(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "right" : "left") : (dy > 0 ? "down" : "up")); input.x0 = e.clientX; input.y0 = e.clientY; input.t0 = performance.now(); } return; }
  if (dy < -60 && dt < 320 && Math.abs(dx) < 50) { doSwipe("up"); input.x0 = e.clientX; input.y0 = e.clientY; input.t0 = performance.now(); return; }
  input.steer = clamp(dx / 70, -1, 1);
});
const endPtr = () => { input.down = false; input.steer = 0; input.hold = false; };
cv.addEventListener("pointerup", endPtr); cv.addEventListener("pointercancel", endPtr);
const keys = {};
window.addEventListener("keydown", e => {
  audio(); const k = e.key.toLowerCase(); keys[k] = true;
  if (S.state !== "run" || !R) return;
  if (k === "escape") { if (MODAL.hidden) showPause(); else closeModal(); }
  if (k === " " || k === "arrowup") { e.preventDefault(); if (R.air) doSwipe("up"); else launchAir(); }
  if (k === "arrowdown") { e.preventDefault(); if (R.air) doSwipe("down"); }
  if (k === "z" || k === "q") doSwipe("left"); if (k === "x" || k === "e") doSwipe("right");
});
window.addEventListener("keyup", e => { keys[e.key.toLowerCase()] = false; });
function pollInput(dt) {
  if (S.state !== "run" || !R) return;
  if (keys["arrowleft"] || keys["a"]) input.steer = -1; else if (keys["arrowright"] || keys["d"]) input.steer = 1; else if (!input.down) input.steer = 0;
  const keyHold = keys["shift"] || keys["g"] || keys["h"] || (keys["arrowdown"] && !R.air);
  if (input.down && !input.moved) { input.holdT += dt; } else if (input.down) input.holdT = Math.abs(input.steer) < .15 ? input.holdT + dt : 0;
  input.hold = keyHold || (input.down && input.holdT > .45);
}

/* ------------------------------ main loop ------------------------------ */
let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now; animT += dt;
  if (ocean) { const want = ocean.level * .22; ocean.gain.gain.value += (want - ocean.gain.gain.value) * .05; ocean.lp.frequency.value = 500 + Math.sin(animT * .7) * 250 + (R && R.air ? 400 : 0); }
  pollInput(dt);
  if (S.state === "run" && R && MODAL.hidden) updateRun(dt);
  g.setTransform(DPR, 0, 0, DPR, 0, 0);
  if (S.state === "run" && R) { drawRun(); drawHud(); } else drawBeach();
  requestAnimationFrame(frame);
}
/* ------------------------------ games menu ------------------------------ */
(function () { const b = $("gamesBtn"), m = $("gamesMenu"); b.addEventListener("click", e => { e.stopPropagation(); m.hidden = !m.hidden; }); document.addEventListener("pointerdown", e => { if (!m.hidden && !m.contains(e.target) && e.target !== b) m.hidden = true; }); })();
showTitle();
requestAnimationFrame(frame);
</script>
</body>
