   the yellow square and they stack up. Your two helpers build the house from
   the pile and fight the zombies (and wolf zombies!) that come at night.
   It can rain, lightning can strike, and when you touch the bed you can sleep
   until morning. Finish the whole house to win — then keep playing.
   Your world saves itself while you play (in this browser), so you can come
   back tomorrow, tap CONTINUE and pick up right where you left off.
   Finish the whole village and the fence gate swings open onto RAINBOW LAND:
   striped ground, candy trees, a giant rainbow, and a Rainbow Restaurant to
   build — but more (and faster, candy-coloured) zombies come every night.
   Once the restaurant opens, customers walk in by day, eat a cake at a table
   and leave a coin 🪙 for you to collect. */

/* ------------------------------ audio ------------------------------ */
let AC = null;
function audio() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (AC && AC.state === "suspended") AC.resume();
}
function tone(freq, dur, type, vol, slide, delay) {
  if (!AC) return;
  const o = AC.createOscillator(), gn = AC.createGain(), t = AC.currentTime + (delay || 0);
  o.type = type || "square"; o.frequency.setValueAtTime(freq, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), t + dur);
  gn.gain.setValueAtTime(vol || .12, t);
  gn.gain.exponentialRampToValueAtTime(.001, t + dur);
  o.connect(gn).connect(AC.destination); o.start(t); o.stop(t + dur + .02);
}
function noise(dur, vol, delay) {
  if (!AC) return;
  const n = Math.floor(AC.sampleRate * dur), buf = AC.createBuffer(1, n, AC.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n) * (1 - i / n);
  const s = AC.createBufferSource(), gn = AC.createGain(), t = AC.currentTime + (delay || 0);
  s.buffer = buf; gn.gain.setValueAtTime(vol || .3, t);
  gn.gain.exponentialRampToValueAtTime(.001, t + dur);
  s.connect(gn).connect(AC.destination); s.start(t);
}
const SFX = {

  fall:    () => { tone(90, .35, "sawtooth", .16, -50); noise(.25, .18, .05); },
  pick:    () => tone(700, .09, "square", .08, 300),
  drop:    () => { tone(420, .07, "square", .09, -120); tone(320, .1, "square", .08, -100, .07); },
  hammer:  () => { tone(520, .05, "square", .1, -200); noise(.04, .1); },

  win:     () => { [523, 659, 784, 1046, 784, 1046, 1318].forEach((f, i) => tone(f, .22, "square", .11, 0, i * .13)); },
  faint:   () => { [330, 294, 262, 196].forEach((f, i) => tone(f, .3, "square", .1, 0, i * .22)); },
  click:   () => tone(880, .05, "square", .07),
  coin:    () => { tone(988, .08, "square", .09); tone(1319, .16, "square", .09, 0, .08); },
  whimper: () => { tone(900, .18, "sine", .07, -300); tone(700, .2, "sine", .06, -250, .22); },

/* ------------------------------ input ------------------------------ */
const keys = {};
window.addEventListener("keydown", e => {

});

// touch: a joystick appears wherever you first touch on the left 60% of the
// screen; the big 🪓 button lives bottom-right. Any other tap is a screen tap.
const joy = { id: null, ox: 0, oy: 0, x: 0, y: 0, dx: 0, dy: 0 };
let actId = null, actHeld = false;

function actBtn() { return { x: W - 64 - 10, y: H - 64 - 14, r: 46 }; }
cv.addEventListener("pointerdown", e => {
  e.preventDefault(); audio();
  const x = e.clientX, y = e.clientY, b = actBtn();
  if (S.state !== "play") { taps.push({ x, y }); return; }
  if (Math.hypot(x - b.x, y - b.y) < b.r + 12) { actId = e.pointerId; actHeld = true; pressAction(); return; }
  if (menuTap(x, y)) return;
  if (joy.id === null) { joy.id = e.pointerId; joy.ox = joy.x = x; joy.oy = joy.y = y; joy.dx = joy.dy = 0; }
});
cv.addEventListener("pointermove", e => {
  if (e.pointerId === joy.id) {
    joy.x = e.clientX; joy.y = e.clientY;
    let dx = joy.x - joy.ox, dy = joy.y - joy.oy, m = Math.hypot(dx, dy), R = 46;
    if (m > R) { dx *= R / m; dy *= R / m; m = R; }
    joy.dx = dx / R; joy.dy = dy / R;
  }
});
function endPtr(e) {
  if (e.pointerId === joy.id) { joy.id = null; joy.dx = joy.dy = 0; }
  if (e.pointerId === actId) { actId = null; actHeld = false; }
}
cv.addEventListener("pointerup", endPtr); cv.addEventListener("pointercancel", endPtr);
cv.addEventListener("contextmenu", e => e.preventDefault());

/* ------------------------------ helpers ------------------------------ */
const rnd = (a, b) => a + Math.random() * (b - a);
const ri = (a, b) => Math.floor(rnd(a, b + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function shade(col, k) {   // k>1 lighter, k<1 darker; accepts #hex or rgb(...)
  let r, gg, b;
  if (col[0] === "#") { const n = parseInt(col.slice(1), 16); r = (n >> 16) & 255; gg = (n >> 8) & 255; b = n & 255; }
  else { const m = col.match(/\d+/g); r = +m[0]; gg = +m[1]; b = +m[2]; }
  r = clamp(Math.round(r * k), 0, 255); gg = clamp(Math.round(gg * k), 0, 255); b = clamp(Math.round(b * k), 0, 255);
  return `rgb(${r},${gg},${b})`;
}

/* ------------------------------ world ------------------------------ */
const MW = 56, MH = 34;         // tiles across (x) and down (y): the home side, a fence, then rainbow land
const FENCE_X = 33;             // the fence runs down this column; everything past it is rainbow land
const T = { GRASS: 0, WATER: 1, PATH: 2, PLANK: 3 };
let tiles = [], solid = [], trees = [], logs = [], zombies = [], parts = [], fx = [], drops = [], coins = [], customers = [];
const HOUSE = { x: 14, y: 13, w: 5, h: 5 };                    // house footprint
const SQUARE = { x: HOUSE.x + 6, y: HOUSE.y + 1, w: 2, h: 2 };  // the wood square
const STAGES = [
  { key: "floor",  name: "the floor",       cost: 4 },
  { key: "back",   name: "the back walls",  cost: 6 },
  { key: "front",  name: "the front walls", cost: 6 },
  { key: "door",   name: "the door",        cost: 2 },
  { key: "roof",   name: "the roof",        cost: 8 },
  { key: "bed",    name: "the bed",         cost: 3 },
  { key: "lantern",name: "the lantern",     cost: 2 },
];
const DOOR = { x: HOUSE.x + 2, y: HOUSE.y + HOUSE.h - 1 };
// bunk beds go in the other corners of the room; the second row stacks on top
const BUNK_POS = [{ x: HOUSE.x + 3, y: HOUSE.y + 1 }, { x: HOUSE.x + 1, y: HOUSE.y + 3 }, { x: HOUSE.x + 3, y: HOUSE.y + 3 }];
const MAX_BUNKS = BUNK_POS.length * 2;   // three downstairs, three upstairs
const FOLLOW = [[-1.1, .9], [1.1, .9], [-1.7, -.1], [1.7, -.1], [-.6, 1.7], [.6, 1.7], [0, -1.5], [-2, 1.4], [2, 1.4], [-1.2, -1.2], [1.2, -1.2], [0, 2.3]];
// the barn for rescued pets, to the left of the house
const BARN = { x: HOUSE.x - 7, y: HOUSE.y + 1, w: 4, h: 4 };
const BARNDOOR = { x: BARN.x + 2, y: BARN.y + BARN.h - 1 };
const PET_BEDS = [{ x: BARN.x + 1, y: BARN.y + 1 }, { x: BARN.x + 2, y: BARN.y + 1 }, { x: BARN.x + 1, y: BARN.y + 2 }, { x: BARN.x + 2, y: BARN.y + 2 }];
const STAIRS = { x: HOUSE.x + 2, y: HOUSE.y + 1 };
// what the helpers build after the house is done, in order
const EXTRAS = [
  { key: "bunk",      name: "a bunk bed for a new helper", short: "a bunk bed", cost: 5, site: "house" },
  { key: "bunk",      name: "a bunk bed for a new helper", short: "a bunk bed", cost: 6, site: "house" },
  { key: "barnfloor", name: "the barn floor",  short: "the barn floor", cost: 5, site: "barn" },
  { key: "barnwalls", name: "the barn walls",  short: "the barn walls", cost: 8, site: "barn" },
  { key: "barnroof",  name: "the barn roof",   short: "the barn roof",  cost: 6, site: "barn" },
  { key: "petbed",    name: "a pet bed — a lost pet will need it", short: "a pet bed", cost: 3, site: "barn" },
  { key: "bunk",      name: "a bunk bed for a new helper", short: "a bunk bed", cost: 7, site: "house" },
  { key: "upwalls",   name: "the upstairs walls", short: "the upstairs", cost: 10, site: "house" },
  { key: "upfloor",   name: "the upstairs floor and stairs", short: "the stairs", cost: 6, site: "house" },
  { key: "petbed",    name: "a pet bed — a lost pet will need it", short: "a pet bed", cost: 3, site: "barn" },
  { key: "bunk",      name: "an upstairs bunk bed", short: "an upstairs bunk", cost: 8, site: "house" },
  { key: "petbed",    name: "a pet bed — a lost pet will need it", short: "a pet bed", cost: 3, site: "barn" },
  { key: "bunk",      name: "an upstairs bunk bed", short: "an upstairs bunk", cost: 9, site: "house" },
  { key: "bunk",      name: "an upstairs bunk bed", short: "an upstairs bunk", cost: 10, site: "house" },
  { key: "petbed",    name: "a pet bed — a lost pet will need it", short: "a pet bed", cost: 3, site: "barn" },
];
const PET_KINDS = [
  { kind: "pug",    name: "Peach",   label: "Peach the pug",       body: "#d9b382", belly: "#f0e4cc", muzzle: "#3a2a1a", ears: "flop", tail: true },
  { kind: "kitten", name: "Biscuit", label: "Biscuit the kitten",  body: "#9aa3ad", belly: "#ffffff", ears: "tri", tail: true },
  { kind: "chick",  name: "Nugget",  label: "Nugget the chick",    body: "#ffd23f", belly: "#ffe680", muzzle: "#ff8c1a", ears: "none", tail: false },
  { kind: "lamb",   name: "Clover",  label: "Clover the lamb",     body: "#f7f3ea", belly: "#f2c6d0", muzzle: "#f2c6d0", ears: "flop", tail: false },
];
let pets = [];
// 🌈 rainbow land, past the fence: a restaurant to build once the village is done
const GATE = { x: FENCE_X, y: HOUSE.y + 4 };                                   // the one gap in the fence
const RESTO = { x: 42, y: 12, w: 6, h: 5 };                                    // the Rainbow Restaurant footprint
const RDOOR = { x: RESTO.x + 2, y: RESTO.y + RESTO.h - 1 };
const SQUARE2 = { x: RESTO.x + RESTO.w + 2, y: RESTO.y + 1, w: 2, h: 2 };      // a second wood square (same magic pile)
const SIGN = { x: RESTO.x + RESTO.w + .3, y: RESTO.y + RESTO.h - .5 };
const RB = ["#ff5c8a", "#ff9f1c", "#ffd60a", "#8ac926", "#3a86ff", "#7b5cff", "#c77dff"];        // bright rainbow
const RB_PASTEL = ["#ffb3c6", "#ffd1a1", "#fff2a8", "#c9f0b0", "#b3dcff", "#c7c0ff", "#ecc4ff"];  // the striped ground
const RAINBOW = [   // what the helpers build in rainbow land, in order
  { key: "rfloor",  name: "the restaurant floor",         short: "the restaurant floor", cost: 8,  site: "resto" },
  { key: "rwalls",  name: "the rainbow walls",            short: "the rainbow walls",    cost: 12, site: "resto" },
  { key: "rdoor",   name: "the restaurant door",          short: "the restaurant door",  cost: 4,  site: "resto" },

  { key: "counter", name: "the kitchen counter",          short: "the counter",          cost: 6,  site: "resto" },
  { key: "tables",  name: "tables and chairs",            short: "the tables",           cost: 8,  site: "resto" },
  { key: "sign",    name: "the big RAINBOW sign",         short: "the big sign",         cost: 6,  site: "resto" },
  { key: "cakes",   name: "rainbow cakes for the window", short: "rainbow cakes",        cost: 5,  site: "resto" },
];
function inResto(x, y) { return x >= RESTO.x && x < RESTO.x + RESTO.w && y >= RESTO.y && y < RESTO.y + RESTO.h; }
function onRestoRing(x, y) { return inResto(x, y) && (x === RESTO.x || y === RESTO.y || x === RESTO.x + RESTO.w - 1 || y === RESTO.y + RESTO.h - 1); }
function inSquare2(x, y) { return x >= SQUARE2.x && x < SQUARE2.x + SQUARE2.w && y >= SQUARE2.y && y < SQUARE2.y + SQUARE2.h; }
function inAnySquare(x, y) { return inSquare(x, y) || inSquare2(x, y); }
function nearestSquare(e) {   // where a helper takes a log: the home square, or the rainbow one once the gate is open
  const a = { x: SQUARE.x + 1, y: SQUARE.y + 1 }, b = { x: SQUARE2.x + 1, y: SQUARE2.y + 1 };
  return S.gate && Math.hypot(b.x - e.x, b.y - e.y) < Math.hypot(a.x - e.x, a.y - e.y) ? b : a;
}
function hasR(key) { return RAINBOW.slice(0, S.rb).some(s => s.key === key); }
function restoOpen() { return S.rb >= RAINBOW.length; }
// 🍰 customers: once the restaurant is open they come by day, sit on a chair, eat a cake and leave a coin
const SEATS = [];   // the four chair spots, matching the chairs drawn in drawRestoInside
for (const tx of [RESTO.x + 1.2, RESTO.x + 3.6]) { SEATS.push({ x: tx - .2, y: RESTO.y + 2.95 }); SEATS.push({ x: tx + .9, y: RESTO.y + 2.95 }); }
const COIN_MILESTONES = [10, 25, 50, 100, 200];
function restoLively() { return inResto(Math.floor(P.x), Math.floor(P.y)) || customers.some(c => c.state === "sit"); }   // show the inside
function freeSeat() { for (let i = 0; i < SEATS.length; i++) if (!customers.some(c => c.seat === i)) return i; return -1; }
function custSpot() {   // most customers arrive from the rainbow side; some walk through the village and the gate
  if (Math.random() < .25) return edgeSpot();
  const side = ri(0, 2);
  if (side === 0) return { x: MW - 1.5, y: rnd(2, MH - 2) };
  return { x: rnd(FENCE_X + 2, MW - 2), y: side === 1 ? 1.5 : MH - 1.5 };
}
function spawnCustomer(seat) {
  const c = makeChar([]); c.customer = true; c.state = "come"; c.seat = seat; c.life = 0; c.hp = 99;
  let e = custSpot(); for (let i = 0; i < 20 && blocked(e.x, e.y); i++) e = custSpot();
  c.x = e.x; c.y = e.y; c.ex = e.x; c.ey = e.y;
  customers.push(c);
}
function updateCustomers(dt) {
  const open = restoOpen() && S.phase === "day";
  if (open) {
    S.custT -= dt;
    if (S.custT <= 0) { S.custT = rnd(9, 16); const seat = freeSeat(); if (seat >= 0) spawnCustomer(seat); }
  }
  for (let i = customers.length - 1; i >= 0; i--) {
    const c = customers[i]; c.life += dt;
    if (c.state !== "leave" && !open) { c.state = "leave"; c.seat = -1; c.life = 0; c.path = null; }   // closing time
    if (c.state === "come") {
      const s = SEATS[c.seat];
      if (goTo(c, s.x, s.y, 2.6, dt) || Math.hypot(s.x - c.x, s.y - c.y) < .3) { c.state = "sit"; c.x = s.x; c.y = s.y; c.eat = c.eatT = rnd(6, 10); c.walk = 0; c.dir = 1; c.path = null; }
      else if (c.life > 60) { c.state = "leave"; c.seat = -1; c.life = 0; }   // couldn't get in — wander home
    } else if (c.state === "sit") {
      c.eat -= dt; c.walk = 0; c.bob = Math.abs(Math.sin(S.t * 6)) * .04;   // munching
      if (c.eat <= 0) {
        coins.push({ x: c.x, y: c.y, t: rnd(0, 6) }); SFX.coin(); boom(c.x, c.y, "#ff6b9d", 6, 3);
        if (Math.hypot(c.x - P.x, c.y - P.y) < 14) say(c.name + " loved the cake and left a coin! 🪙", 2.5);
        c.state = "leave"; c.seat = -1; c.life = 0; c.path = null;
      }
    } else if (goTo(c, c.ex, c.ey, 2.8, dt) || Math.hypot(c.ex - c.x, c.ey - c.y) < 1.2 || c.life > 45) customers.splice(i, 1);
  }
}
function inBarn(x, y) { return x >= BARN.x && x < BARN.x + BARN.w && y >= BARN.y && y < BARN.y + BARN.h; }
function onBarnRing(x, y) { return inBarn(x, y) && (x === BARN.x || y === BARN.y || x === BARN.x + BARN.w - 1 || y === BARN.y + BARN.h - 1); }
function hasX(key) { return EXTRAS.slice(0, S.extra).some(s => s.key === key); }
const BED  = { x: HOUSE.x + 1, y: HOUSE.y + 1 };
const S = { state: "title", built: 0, pile: 0, day: 1, clock: 0, phase: "day", t: 0, rain: 0, rainT: 0,
  flash: 0, thunderT: 0, msg: "", msgT: 0, prompt: null, fade: 0, fadeMode: "", won: false, wonT: 0,
  spawnT: 0, builder: null, buildProg: 0, nightsSurvived: 0, bunks: 0, extra: 0, petBeds: 0, buildSpot: null,
  saveT: 8, savedT: 0, confirm: false,     // autosave countdown, "💾 saved" flash, "start over?" question on the title
  gate: 0, gateT: 0, rb: 0, winKind: "house",     // fence gate open?, seconds since it opened, restaurant stages built, which win screen
  coins: 0, custT: 6 };                            // coins collected, seconds until the next customer
const DAY_LEN = 75, DUSK_LEN = 8, NIGHT_LEN = 55, DAWN_LEN = 7;

function inHouse(x, y) { return x >= HOUSE.x && x < HOUSE.x + HOUSE.w && y >= HOUSE.y && y < HOUSE.y + HOUSE.h; }
function onRing(x, y) { return inHouse(x, y) && (x === HOUSE.x || y === HOUSE.y || x === HOUSE.x + HOUSE.w - 1 || y === HOUSE.y + HOUSE.h - 1); }
function isBack(x, y) { return onRing(x, y) && (x === HOUSE.x || y === HOUSE.y); }
function inSquare(x, y) { return x >= SQUARE.x && x < SQUARE.x + SQUARE.w && y >= SQUARE.y && y < SQUARE.y + SQUARE.h; }
function has(key) { return S.built > STAGES.findIndex(s => s.key === key); }
function nextStage() {
  if (S.built < STAGES.length) return STAGES[S.built];
  if (S.extra < EXTRAS.length) return EXTRAS[S.extra];
  return S.gate ? RAINBOW[S.rb] || null : null;
}

function genWorld() {
  tiles = []; solid = []; trees = []; logs = []; zombies = []; fx = []; drops = []; pets = []; coins = []; customers = [];
  for (let y = 0; y < MH; y++) { tiles.push([]); solid.push([]); for (let x = 0; x < MW; x++) { tiles[y].push(T.GRASS); solid[y].push(false); } }
  // a little pond
  const px = ri(4, 8), py = ri(20, 26);
  for (let y = py; y < py + 3; y++) for (let x = px; x < px + 4; x++) { tiles[y][x] = T.WATER; solid[y][x] = true; }
  // a dirt path from the house door out to the south-west edge
  for (let y = DOOR.y + 1; y < MH; y++) { const x = DOOR.x + ((y - DOOR.y) % 5 === 3 ? 1 : 0); if (tiles[y][x] === T.GRASS) tiles[y][x] = T.PATH; }
  layGatePath(tiles);
  plantTrees(tiles, solid, trees, "home");
  plantTrees(tiles, solid, trees, "rainbow");
  rebuildHouseSolids();
}
function layGatePath(tl) {   // a path from the wood square, through the fence gate, to the restaurant door
  for (let x = SQUARE.x + SQUARE.w; x <= RDOOR.x; x++) if (tl[GATE.y][x] === T.GRASS) tl[GATE.y][x] = T.PATH;
}
function plantTrees(tl, sd, arr, area) {   // home side: a forest of 62; rainbow side: 44 candy-coloured trees
  const rb = area === "rainbow", want = arr.length + (rb ? 44 : 62);
  let tries = 0;
  while (arr.length < want && tries++ < 4000) {
    const x = rb ? ri(FENCE_X + 2, MW - 2) : ri(1, FENCE_X - 1), y = ri(1, MH - 2);
    if (tl[y][x] !== T.GRASS || sd[y][x]) continue;
    if (!rb && x >= BARN.x - 2 && x < SQUARE.x + SQUARE.w + 2 && y >= HOUSE.y - 2 && y < HOUSE.y + HOUSE.h + 4) continue;   // the yard
    if (rb && x >= RESTO.x - 2 && x < SQUARE2.x + SQUARE2.w + 2 && y >= RESTO.y - 2 && y < RESTO.y + RESTO.h + 3) continue;   // the restaurant lot
    if (Math.abs(y - GATE.y) <= 1 && x >= SQUARE.x && x <= FENCE_X + 3) continue;   // keep the lane to the gate clear
    if (arr.some(t => Math.abs(t.x - x) + Math.abs(t.y - y) < 2)) continue;
    arr.push({ x, y, hp: 3, shake: 0, stump: 0, big: Math.random() < .3, tone: rnd(.85, 1.15), col: rb ? pick(RB) : undefined });
    sd[y][x] = true;
  }
}
function rebuildHouseSolids() {
  for (let y = HOUSE.y; y < HOUSE.y + HOUSE.h; y++) for (let x = HOUSE.x; x < HOUSE.x + HOUSE.w; x++) {
    let s = false;
    if (onRing(x, y)) {
      if (isBack(x, y) && has("back")) s = true;
      if (!isBack(x, y) && has("front") && !(x === DOOR.x && y === DOOR.y)) s = true;
    }
    solid[y][x] = s;
  }
  if (has("bed")) solid[BED.y][BED.x] = false;   // bed is touchable, you walk onto it
  for (let y = BARN.y; y < BARN.y + BARN.h; y++) for (let x = BARN.x; x < BARN.x + BARN.w; x++)
    solid[y][x] = onBarnRing(x, y) && hasX("barnwalls") && !(x === BARNDOOR.x && y === BARNDOOR.y);
  for (let y = 0; y < MH; y++) solid[y][FENCE_X] = !(S.gate && y === GATE.y);   // the fence, with its gate
  for (let y = RESTO.y; y < RESTO.y + RESTO.h; y++) for (let x = RESTO.x; x < RESTO.x + RESTO.w; x++)
    solid[y][x] = onRestoRing(x, y) && hasR("rwalls") && !(x === RDOOR.x && y === RDOOR.y);
}
function blocked(x, y, zombie) {
  const tx = Math.floor(x), ty = Math.floor(y);
  if (tx < 1 || ty < 1 || tx >= MW - 1 || ty >= MH - 1) return true;
  if (zombie && tx === DOOR.x && ty === DOOR.y && has("door")) return true;   // the door keeps zombies out
  if (zombie && tx === BARNDOOR.x && ty === BARNDOOR.y && hasX("barnwalls")) return true;
  if (zombie && tx === RDOOR.x && ty === RDOOR.y && hasR("rdoor")) return true;
  return solid[ty][tx];
}
function fits(e, x, y) {   // does the entity's little footprint sit on free tiles?
  const r = e.r || .28, z = e.zombie;
  return !blocked(x - r, y - r, z) && !blocked(x + r, y - r, z) && !blocked(x - r, y + r, z) && !blocked(x + r, y + r, z);
}
function moveEnt(e, dx, dy) {   // axis-separated slide against solid tiles
  // already overlapping a block (a wall went up under our feet)? then any move
  // is allowed so we can walk back out instead of being sealed in forever
  const free = !fits(e, e.x, e.y);
  const nx = e.x + dx;
  if (free || fits(e, nx, e.y)) e.x = nx;
  const ny = e.y + dy;
  if (free || fits(e, e.x, ny)) e.y = ny;
}
function freeSpot(x, y, zombie) {   // nearest open tile centre, searching outward in rings
  const tx = Math.floor(x), ty = Math.floor(y);
  for (let r = 0; r < 8; r++) for (let dy = -r; dy <= r; dy++) for (let dx = -r; dx <= r; dx++) {
    if (Math.max(Math.abs(dx), Math.abs(dy)) !== r) continue;
    const cx = tx + dx + .5, cy = ty + dy + .5;
    if (!blocked(cx, cy, zombie)) return { x: cx, y: cy };
  }
  return { x, y };
}
function unstick(e) {   // sealed inside a block: pop out to the nearest open tile
  if (!blocked(e.x, e.y, e.zombie)) return;
  const s = freeSpot(e.x, e.y, e.zombie); e.x = s.x; e.y = s.y; e.path = null;
}
// breadth-first path over free tiles (4 neighbours, so nobody clips a corner).
// Returns tile-centre waypoints from the tile after the start to the target
// tile, or null when the target can't be reached.
function findPath(sx, sy, tx, ty, zombie) {
  const s = Math.floor(sy) * MW + Math.floor(sx), goal = Math.floor(ty) * MW + Math.floor(tx);
  if (s === goal) return [];
  const prev = new Int16Array(MW * MH).fill(-1); prev[s] = s;
  const queue = [s]; let qi = 0;
  while (qi < queue.length) {
    const c = queue[qi++]; if (c === goal) break;
    const cx = c % MW, cy = (c - cx) / MW;
    for (const [nx, ny] of [[cx + 1, cy], [cx - 1, cy], [cx, cy + 1], [cx, cy - 1]]) {
      if (nx < 1 || ny < 1 || nx >= MW - 1 || ny >= MH - 1) continue;
      const n = ny * MW + nx;
      if (prev[n] !== -1 || blocked(nx + .5, ny + .5, zombie)) continue;
      prev[n] = c; queue.push(n);
    }
  }
  if (prev[goal] === -1) return null;
  const path = [];
  for (let c = goal; c !== s; c = prev[c]) path.push({ x: (c % MW) + .5, y: Math.floor(c / MW) + .5 });
  return path.reverse();
}
// walk toward (tx,ty) along a path, re-planning every so often; falls back to
// a straight walk when there's no route (e.g. a zombie outside a closed house)
function goTo(e, tx, ty, sp, dt) {
  e.pathT = (e.pathT || 0) - dt;
  if (!e.path || e.pathT <= 0 || Math.abs(tx - e.ptx) > .9 || Math.abs(ty - e.pty) > .9) {
    e.path = findPath(e.x, e.y, tx, ty, e.zombie); e.pathT = .7; e.ptx = tx; e.pty = ty;
  }
  if (e.path === null) return walkTo(e, tx, ty, sp, dt);
  while (e.path.length && Math.hypot(e.path[0].x - e.x, e.path[0].y - e.y) < .25) e.path.shift();
  if (!e.path.length) return walkTo(e, tx, ty, sp, dt);
  walkTo(e, e.path[0].x, e.path[0].y, sp, dt); return false;
}

const HAIRS = ["#2b1b12", "#5a3a1e", "#c48a3c", "#f1d36a", "#d9482b", "#1c1c1c", "#8a5a9e"];

const ANIMALS = [

function makeChar(usedNames) {
  const c = { x: 0, y: 0, r: .28, dir: 1, walk: 0, bob: 0, hp: 5, maxHp: 5, wood: 0, swing: 0, hurtT: 0 };
  if (Math.random() < .5) {
    c.type = "kid"; c.skin = pick(SKINS); c.hair = pick(HAIRS); c.shirt = pick(SHIRTS); c.pants = pick(PANTS);
    c.hairStyle = pick(["short", "long", "bun", "spiky"]); c.hat = Math.random() < .4 ? pick(["cap", "beanie", "crown", "none"]) : "none";
    let n; do { n = pick(KID_NAMES); } while (usedNames.includes(n)); c.name = n;
    c.label = n + " the blocky kid";
  } else {
    const a = pick(ANIMALS); Object.assign(c, a); c.type = "animal";
    let n; do { n = pick(KID_NAMES); } while (usedNames.includes(n)); c.name = n;
    c.label = n + " the blocky " + a.name.toLowerCase();
  }
  usedNames.push(c.name);
  return c;
}
let P = null, helpers = [];
function newCharacters() {
  const used = [];
  P = makeChar(used);
  helpers = [makeChar(used), makeChar(used)];
  helpers.forEach((h, i) => { h.helper = true; h.state = "follow"; h.target = null; h.cool = 0; h.hp = 99; h.idx = i; });
}
newCharacters();
function newHelper() {   // a new blocky friend walks in from the edge of the forest
  const used = [P.name, ...helpers.map(h => h.name)];
  const h = makeChar(used);
  h.helper = true; h.state = "follow"; h.target = null; h.cool = 0; h.hp = 99; h.idx = helpers.length; h.carry = 0;
  for (let i = 0; i < 40; i++) { const e = edgeSpot(); h.x = e.x; h.y = e.y; if (!blocked(h.x, h.y)) break; }
  helpers.push(h); boom(h.x, h.y, "#ffd166", 10, 4);
  return h;
}

function edgeSpot() {   // a random spot on the edge of the land you can reach (the rainbow side only once the gate is open)
  const x2 = S.gate ? MW - 1.5 : FENCE_X - 1.5, side = ri(0, 3);
  if (side === 0) return { x: 1.5, y: rnd(2, MH - 2) };
  if (side === 1) return { x: x2, y: rnd(2, MH - 2) };
  return { x: rnd(2, x2 - .5), y: side === 2 ? 1.5 : MH - 1.5 };
}
function spawnLostPet() {   // a lost pet appears deep in the forest, somewhere you can walk to
  const k = PET_KINDS[pets.length % PET_KINDS.length];
  const p = Object.assign({ x: 0, y: 0, r: .2, dir: 1, walk: 0, bob: 0, swing: 0, type: "animal", pet: true, state: "lost", cry: 1, wanderT: 0, idx: pets.length }, k);
  for (let i = 0; i < 300; i++) {
    const x = ri(2, MW - 3) + .5, y = ri(2, MH - 3) + .5;
    if (blocked(x, y) || Math.hypot(x - HOUSE.x - 2.5, y - HOUSE.y - 2.5) < 10) continue;
    if (!findPath(DOOR.x + .5, DOOR.y + 1.5, x, y)) continue;
    p.x = x; p.y = y; pets.push(p); return p;
  }
  return null;
}
function updatePets(dt) {
  for (const p of pets) {
    if (p.state === "lost") {
      p.cry -= dt;
      if (p.cry <= 0) { p.cry = rnd(2.5, 4); if (Math.hypot(p.x - P.x, p.y - P.y) < 14) SFX.whimper(); }
      p.bob = 0; p.walk = 0;
      if (Math.hypot(p.x - P.x, p.y - P.y) < 1.4) {
        p.state = "follow"; SFX.found(); boom(p.x, p.y, "#ff6b9d", 12, 4);
        say("You found " + p.label + "! 💕 Bring them home to the barn 🏠", 4);
      }
      continue;
    }
    if (p.state === "follow") {
      const fo = FOLLOW[(p.idx + 9) % FOLLOW.length], tx = P.x + fo[0] * .8, ty = P.y + fo[1] * .8;
      if (Math.hypot(tx - p.x, ty - p.y) > .9) goTo(p, tx, ty, 3.6, dt); else { p.walk = 0; p.bob = 0; }
      // home when YOU reach the barn door (the pet trails behind you), or either of you is inside
      if (inBarn(Math.floor(p.x), Math.floor(p.y)) || inBarn(Math.floor(P.x), Math.floor(P.y)) || Math.hypot(P.x - BARNDOOR.x - .5, P.y - BARNDOOR.y - 1.5) < 2.2) {
        p.state = "home"; p.wanderT = 0; SFX.built(); boom(BARN.x + 2, BARN.y + 2, "#ff6b9d", 16, 5);
        say(p.label + " moved into the barn! 🏠💕", 4); saveGame(true);
      }
      continue;
    }
    // home: potter around inside the barn; at night curl up on their own bed
    p.wanderT -= dt;
    const bed = PET_BEDS[p.idx % PET_BEDS.length];
    if (timeOfDay() > .5) { p.tx = bed.x + .5; p.ty = bed.y + .5; }
    else if (p.wanderT <= 0 || p.tx === undefined) { p.wanderT = rnd(2, 5); p.tx = BARN.x + 1 + ri(0, 1) + .5; p.ty = BARN.y + 1 + ri(0, 1) + .5; }
    if (Math.hypot(p.tx - p.x, p.ty - p.y) > .2) goTo(p, p.tx, p.ty, 1.4, dt); else { p.walk = 0; p.bob = 0; }
  }
}

/* ------------------------------ messages ------------------------------ */
function say(m, t) { S.msg = m; S.msgT = t || 3; }
function boom(x, y, col, n, up) {
  for (let i = 0; i < (n || 10); i++) fx.push({ x: x + rnd(-.3, .3), y: y + rnd(-.3, .3), z: rnd(.2, 1.2),
    vx: rnd(-1.5, 1.5), vy: rnd(-1.5, 1.5), vz: rnd(1, up || 4), col, t: rnd(.5, 1) });
}

/* ------------------------------ game flow ------------------------------ */
function startGame() {
  genWorld();
  S.state = "play"; S.built = 0; S.pile = 0; S.day = 1; S.clock = 0; S.phase = "day"; S.rain = 0; S.rainT = rnd(25, 60);
  S.flash = 0; S.msgT = 0; S.prompt = null; S.fade = 0; S.won = false; S.builder = null; S.buildProg = 0; S.nightsSurvived = 0; S.bunks = 0; S.extra = 0; S.petBeds = 0; S.buildSpot = null;
  S.gate = 0; S.gateT = 0; S.rb = 0; S.winKind = "house"; S.coins = 0; S.custT = 6;
  helpers.length = 2;   // a fresh game starts with the two original helpers
  P.x = HOUSE.x + 2.5; P.y = HOUSE.y + HOUSE.h + 2.5; P.hp = P.maxHp; P.wood = 0; P.dir = 1;
  cam.x = P.x; cam.y = P.y;
  helpers.forEach((h, i) => { h.x = P.x + FOLLOW[i][0]; h.y = P.y + FOLLOW[i][1]; h.state = "follow"; h.carry = 0; h.target = null; });
  say("Chop trees with your axe 🪓 and bring wood to the yellow square!", 5);
}
function timeOfDay() {   // 0 = full day .. 1 = full night
  if (S.phase === "day") return 0;
  if (S.phase === "dusk") return S.clock / DUSK_LEN;
  if (S.phase === "night") return 1;
  return 1 - S.clock / DAWN_LEN;
}
function advanceClock(dt) {
  S.clock += dt;
  const len = { day: DAY_LEN, dusk: DUSK_LEN, night: NIGHT_LEN, dawn: DAWN_LEN }[S.phase];
  if (S.clock < len) return;
  S.clock = 0;
  if (S.phase === "day") { S.phase = "dusk"; say("The sun is going down... zombies are coming! 🧟", 4); }
  else if (S.phase === "dusk") { S.phase = "night"; }
  else if (S.phase === "night") { S.phase = "dawn"; S.nightsSurvived++; zombies.forEach(z => boom(z.x, z.y, "#8ab", 8)); zombies = []; SFX.wake(); say("Morning! The zombies are gone. ☀️", 4); }
  else { S.phase = "day"; S.day++; }
}
function openGate() {   // the whole village is done: the fence gate swings open onto rainbow land
  S.gate = 1; S.gateT = 0; rebuildHouseSolids(); SFX.win();
  boom(GATE.x + .5, GATE.y + .5, "#ffd166", 24, 6);
  say("The whole village is finished! 🎉 ...and look — the fence gate is opening! 🌈", 6);
}
function morning() {   // after sleeping or fainting
  S.phase = "day"; S.clock = 0; S.day++; S.nightsSurvived++; zombies = []; S.rain = 0;
  P.hp = P.maxHp;
}

/* ------------------------------ save & load ------------------------------ */
// The world autosaves into this browser's localStorage: quietly every few
// seconds while you play, right after every big moment (something got built,
// a new morning, a pet came home — those flash "💾 saved"), and when the tab
// is hidden or closed. Zombies, sparks and the half-built progress bar aren't
// saved; everything else (the map, chopped trees, your crew, the pile, the
// house, the barn, the pets, the day and the weather) comes right back.
const SAVE_KEY = "zombieSave", SAVE_VER = 2;   // v1 saves (home side only) are migrated on load
const CHAR_KEYS = ["type", "name", "label", "skin", "hair", "shirt", "pants", "hairStyle", "hat", "kind", "body", "belly", "ears", "tail", "patch", "stripes", "x", "y", "dir", "hp", "wood", "carry"];
let SAVED = null;   // the save that was waiting when the page opened (drives the CONTINUE button)
function charData(c) { const o = {}; for (const k of CHAR_KEYS) if (c[k] !== undefined) o[k] = c[k]; return o; }
function snapshot() {
  return {
    v: SAVE_VER, at: Date.now(),
    s: { built: S.built, pile: S.pile, day: S.day, clock: S.clock, phase: S.phase, rain: S.rain, rainT: S.rainT, thunderT: S.thunderT,
         nightsSurvived: S.nightsSurvived, bunks: S.bunks, extra: S.extra, petBeds: S.petBeds, won: S.won,
         gate: S.gate, gateT: S.gateT, rb: S.rb, winKind: S.winKind, coins: S.coins },
    tiles: tiles.map(r => r.join("")).join(""),
    trees: trees.map(t => ({ x: t.x, y: t.y, hp: t.hp, big: t.big, tone: t.tone, stump: Math.max(0, t.stump), col: t.col })),
    logs: logs.map(l => ({ x: l.x, y: l.y })),
    p: charData(P), helpers: helpers.map(charData),
    pets: pets.map(p => ({ kind: p.kind, state: p.state, x: p.x, y: p.y })),
    coins: coins.map(c => ({ x: c.x, y: c.y })),
  };
}
function saveGame(show) {
  if (S.state === "title" || !tiles.length) return;   // nothing to save until a world exists
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(snapshot())); if (show) S.savedT = 2; } catch (e) {}
}
function clearSave() { try { localStorage.removeItem(SAVE_KEY); } catch (e) {} }
function loadSave() {
  try {
    const d = JSON.parse(localStorage.getItem(SAVE_KEY));
    const w = d && (d.v === 1 ? 34 : d.v === SAVE_VER ? MW : 0);   // a v1 save only knew the 34-wide home side
    if (d && w && typeof d.tiles === "string" && d.tiles.length === w * MH && d.p && d.p.name &&
        Array.isArray(d.helpers) && d.helpers.length >= 2 && Array.isArray(d.trees)) return d;
  } catch (e) {}
  return null;
}
function restoreGame(d) {   // rebuild the whole world from a save; nothing changes unless all of it checks out

    const groups = g.measureText(joined).width + 20 <= maxW ? [joined] : segs;
    for (const s of groups) {
      const w = Math.min(maxW, g.measureText(s).width + 20);
      g.fillStyle = "rgba(0,0,0,.4)"; roundRect(10, y, w, 26, 9); g.fill();
      g.fillStyle = "#fff"; g.fillText(s, 20, y + 13, w - 20);
      y += 32;
    }
  }
  const st = nextStage();
  row(["🪵 " + P.wood + "/2 carrying", "pile: " + S.pile, st ? "next: " + (st.short || st.name) + " (" + st.cost + ")" : S.gate ? "🏆 everything is built — keep everyone safe!" : "🏆 the whole village is finished!"]);
  const ph = S.phase === "day" ? "☀️ Day " + S.day : S.phase === "dusk" ? "🌇 Evening" : S.phase === "night" ? "🌙 Night " + S.day : "🌅 Dawn";
  row([ph + (S.rain ? "  ⛈" : ""), "you are " + P.label].concat(restoOpen() ? ["🪙 " + S.coins] : []));
  // house progress bar
  const pw = Math.min(240, W - 40), px = 10, py = y + 4;
  g.fillStyle = "rgba(0,0,0,.4)"; roundRect(px, py, pw, 16, 8); g.fill();
  g.fillStyle = "#ffd166"; roundRect(px + 2, py + 2, (pw - 4) * (S.built / STAGES.length), 12, 6); g.fill();
  y = py + 22;
  g.font = "bold 12px 'Avenir Next','Trebuchet MS',Arial";
  if (S.built >= STAGES.length) { g.fillStyle = "#fff"; g.fillText("🛏 bunks " + S.bunks + "/" + MAX_BUNKS + "   👫 helpers " + helpers.length + "   🐾 pets home " + pets.filter(p => p.state === "home").length + "/" + PET_KINDS.length, px, y + 6, maxW); y += 18; }
  if (S.gate) { const eating = customers.filter(c => c.state === "sit").length; g.fillStyle = "#fff"; g.fillText("🌈 restaurant " + S.rb + "/" + RAINBOW.length + (restoOpen() ? " — OPEN! 🍰" + (eating ? "  " + eating + " eating" : S.phase === "day" ? "  waiting for customers…" : "  closed for the night") : ""), px, y + 6, maxW); y += 18; }
  const lost = pets.find(p => p.state !== "home");
  if (lost) { g.fillStyle = "#ffd166"; g.fillText(lost.state === "lost" ? "🐾 " + lost.label + " is lost in the forest! Follow the paw prints" : "🐾 bring " + lost.name + " to the barn!", px, y + 6, maxW); y += 18; }
  if (S.builder) { g.fillStyle = "#fff"; g.fillText("🔨 " + S.builder.name + " is building… stand close + 🪓 to help", px, y + 6, maxW); }
  // message
  if (S.msgT > 0 && S.msg) {
    g.font = "bold 16px 'Avenir Next','Trebuchet MS',Arial"; g.textAlign = "center";
    const mw = Math.min(W - 30, g.measureText(S.msg).width + 30);
    g.fillStyle = "rgba(0,0,0,.55)"; roundRect(W / 2 - mw / 2, H - 150, mw, 34, 12); g.fill(); g.fillStyle = "#ffe";
    g.fillText(S.msg, W / 2, H - 133, W - 40);
  }
  // edge pointers: paw prints toward a lost pet, a rainbow toward the open gate until the restaurant is started
  if (lost && lost.state === "lost") edgePointer(lost.x, lost.y, "🐾");
  if (S.gate && S.rb === 0 && P.x < FENCE_X) edgePointer(GATE.x + .5, GATE.y + .5, "🌈");
  // "💾 saved" flash after a big-moment autosave
  if (S.savedT > 0) {
    g.globalAlpha = Math.min(1, S.savedT); g.font = "bold 13px 'Avenir Next','Trebuchet MS',Arial"; g.textAlign = "left";
    g.fillStyle = "rgba(0,0,0,.45)"; roundRect(10, H - 74, 96, 26, 9); g.fill();
    g.fillStyle = "#c8f7c5"; g.fillText("💾 saved", 20, H - 61); g.globalAlpha = 1;
  }
  // touch controls
  const b = actBtn();
  g.fillStyle = actHeld ? "rgba(255,209,102,.9)" : "rgba(255,255,255,.35)"; g.beginPath(); g.arc(b.x, b.y, b.r, 0, Math.PI * 2); g.fill();
  g.strokeStyle = "rgba(255,255,255,.7)"; g.lineWidth = 3; g.stroke();
  g.font = "40px sans-serif"; g.textAlign = "center"; g.fillStyle = "#fff"; g.fillText("🪓", b.x, b.y + 3);
  if (joy.id !== null) {
    g.fillStyle = "rgba(255,255,255,.25)"; g.beginPath(); g.arc(joy.ox, joy.oy, 52, 0, Math.PI * 2); g.fill();
    g.fillStyle = "rgba(255,255,255,.7)"; g.beginPath(); g.arc(joy.ox + joy.dx * 46, joy.oy + joy.dy * 46, 24, 0, Math.PI * 2); g.fill();
  } else if (S.t < 20) { g.font = "bold 14px 'Avenir Next','Trebuchet MS',Arial"; g.fillStyle = "rgba(255,255,255,.8)"; g.textAlign = "left"; g.fillText("👆 drag anywhere to walk · arrows/WASD + space on a keyboard", 14, H - 24); }
  g.textBaseline = "alphabetic";
}
function edgePointer(wx, wy, emoji) {   // a round badge on the screen edge pointing at something off screen
  const sp = screenOf(wx, wy, .5), cx = W / 2, cy = H / 2, dx = sp.x - cx, dy = sp.y - cy;
  if (!(sp.x < 30 || sp.x > W - 30 || sp.y < 120 || sp.y > H - 120)) return;
  const m = Math.max(Math.abs(dx) / (W / 2 - 40), Math.abs(dy) / (H / 2 - 130)), ex = cx + dx / m, ey = cy + dy / m;
  g.font = "bold 30px sans-serif"; g.textAlign = "center"; g.textBaseline = "middle";
  g.fillStyle = "rgba(0,0,0,.45)"; g.beginPath(); g.arc(ex, ey, 24, 0, Math.PI * 2); g.fill();
  g.fillStyle = "#fff"; g.fillText(emoji, ex, ey + 2);
}
function drawPrompt() {
  if (!S.prompt) return;
  g.fillStyle = "rgba(0,0,0,.45)"; g.fillRect(0, 0, W, H);
  g.fillStyle = "#fff"; roundRect(W / 2 - 170, H / 2 - 70, 340, 160, 18); g.fill();
  g.fillStyle = "#2a3a55"; g.font = "bold 24px 'Avenir Next','Trebuchet MS',Arial"; g.textAlign = "center"; g.fillText(S.prompt.text, W / 2, H / 2 - 20);
  for (const b of promptBtns()) { g.fillStyle = b.yes ? "#06d6a0" : "#e9ecef"; roundRect(b.x, b.y, b.w, b.h, 14); g.fill(); g.fillStyle = b.yes ? "#fff" : "#2a3a55"; g.font = "bold 20px 'Avenir Next','Trebuchet MS',Arial"; g.fillText(b.t, b.x + b.w / 2, b.y + 33); }
}
function drawFade() {
  if (S.state !== "sleep" && S.state !== "faint") return;
  const a = S.fade < 1.2 ? Math.min(1, S.fade / .8) : Math.max(0, 1 - (S.fade - 1.6) / .8);
  g.fillStyle = `rgba(0,0,10,${a})`; g.fillRect(0, 0, W, H);
  if (a > .9) { g.fillStyle = "#fff"; g.font = "bold 34px 'Avenir Next','Trebuchet MS',Arial"; g.textAlign = "center"; g.fillText(S.fadeMode === "sleep" ? "😴 zzz…" : "😵 You fainted!", W / 2, H / 2); }
}
function drawWin() {
  const t = S.wonT;
  g.fillStyle = `rgba(0,0,0,${Math.min(.5, t)})`; g.fillRect(0, 0, W, H);
  for (let i = 0; i < 80; i++) { const hx = hash(i, 1), hs = hash(i, 2); const y = ((t * (60 + hs * 120) + hx * H) % (H + 40)) - 20; g.fillStyle = ["#ffbe0b", "#fb5607", "#ff006e", "#8338ec", "#3a86ff", "#06d6a0"][i % 6]; g.fillRect(hx * W, y, 8, 12); }
  const resto = S.winKind === "resto";
  g.fillStyle = "#fff"; g.textAlign = "center"; g.font = "bold 44px 'Avenir Next','Trebuchet MS',Arial"; g.fillText(resto ? "🌈 THE RAINBOW RESTAURANT IS OPEN! 🍰" : "🏠 YOU BUILT THE HOUSE! 🎉", W / 2, H / 2 - 30, W - 30);
  g.font = "bold 22px 'Avenir Next','Trebuchet MS',Arial"; g.fillText(resto ? P.name + " and the crew built a whole rainbow land!" : P.name + " and the helpers did it!", W / 2, H / 2 + 14, W - 30);
  if (t > 1.2) { g.fillStyle = "#ffd166"; g.font = "bold 20px 'Avenir Next','Trebuchet MS',Arial"; g.fillText("Tap to keep playing!", W / 2, H / 2 + 60, W - 30);
    g.fillStyle = "#fff"; g.font = "bold 16px 'Avenir Next','Trebuchet MS',Arial"; g.fillText(resto ? "Customers are coming for cake — collect their coins! 🪙 (and more zombies at night 🧟)" : "Next: bunk beds, a barn for lost pets, and an upstairs! 🛏🐾🏠", W / 2, H / 2 + 90, W - 30); }
}

/* ------------------------------ title ------------------------------ */
function drawTitle() {
  const sky = g.createLinearGradient(0, 0, 0, H); sky.addColorStop(0, "#1a2340"); sky.addColorStop(1, "#4a3a6a"); g.fillStyle = sky; g.fillRect(0, 0, W, H);
  g.fillStyle = "#fff"; for (let i = 0; i < 60; i++) g.fillRect(hash(i, 5) * W, hash(i, 9) * H * .6, 2, 2);
  g.fillStyle = "#f4f1de"; g.beginPath(); g.arc(W * .86, H * .08, 26, 0, Math.PI * 2); g.fill();
  // ground + character preview
  g.save(); g.translate(W / 2, H * .58); g.scale(ZOOM * 1.5, ZOOM * 1.5);
  diamond(-1, -1, "#5fae3e", 2); diamond(-.5, -.5, "#6cbf47", 1);
  // the preview draws at map (0,0); a restored character stands wherever they were saved, so park them there for a moment
  const ox = P.x, oy = P.y, od = P.dir;
  P.x = 0; P.y = 0; P.dir = 1; P.hurtT = 0; P.bob = Math.abs(Math.sin(P.walk)) * .06; drawChar(P);
  P.x = ox; P.y = oy; P.dir = od;
  g.restore();
  g.textAlign = "center"; g.fillStyle = "#6ee27a"; g.font = "900 " + Math.min(64, W / 8) + "px 'Avenir Next','Trebuchet MS',Arial";
  g.fillText("ZOMBIE NIGHT", W / 2, H * .2);
  g.fillStyle = "#fff"; g.font = "bold 16px 'Avenir Next','Trebuchet MS',Arial"; g.fillText("a Nora game · chop, build, survive", W / 2, H * .2 + 30);
  g.font = "bold 22px 'Avenir Next','Trebuchet MS',Arial"; g.fillStyle = S.confirm ? "#ff8fa3" : "#ffd166";
  g.fillText(S.confirm ? "Start a brand-new world?" : SAVED ? "Welcome back, " + P.name + "!" : "You are " + P.label + "!", W / 2, H * .72, W - 30);
  g.fillStyle = "#fff"; g.font = "bold 15px 'Avenir Next','Trebuchet MS',Arial";
  const home = pets.filter(p => p.state === "home").length;
  g.fillText(S.confirm ? "Day " + S.day + " with " + P.name + " and the whole house will be gone!"
    : SAVED ? "Day " + S.day + " · " + P.label + " · " + helpers.length + " helpers" + (home ? " · " + home + " pets home" : "") + (S.coins ? " · 🪙 " + S.coins : "")
    : "helpers: " + helpers[0].name + " & " + helpers[1].name, W / 2, H * .72 + 26, W - 30);
  for (const b of titleBtns()) { g.fillStyle = b.act === "wipe" ? "#e63946" : b.main ? "#06d6a0" : "rgba(255,255,255,.18)"; roundRect(b.x, b.y, b.w, b.h, 16); g.fill(); g.fillStyle = "#fff"; g.font = "bold 20px 'Avenir Next','Trebuchet MS',Arial"; g.fillText(b.t, b.x + b.w / 2, b.y + b.h / 2 + 7); }
  if (!S.confirm) { g.fillStyle = "rgba(255,255,255,.6)"; g.font = "bold 12px 'Avenir Next','Trebuchet MS',Arial"; g.fillText("💾 your world saves itself while you play", W / 2, Math.min(H - 12, H * .8 + 134), W - 30); }
}
function dismissWin() {
  if (S.wonT < 1.2) return;
  S.state = "play"; say(S.winKind === "resto" ? "Everything is built! 🌈 Keep chopping and keep fighting — the zombies keep coming! 🧟" : "Keep bringing wood — bunk beds, a barn, lost pets and an upstairs are next! 🛏🐾", 5);
}
function titleBtns() {
  const x = W / 2 - 110, y = H * .8;
  if (S.confirm) return [{ x, y, w: 220, h: 54, act: "keep", main: true, t: "↩ Keep my world" }, { x, y: y + 66, w: 220, h: 44, act: "wipe", t: "🗑 Yes, start over" }];
  if (SAVED) return [{ x, y, w: 220, h: 54, act: "continue", main: true, t: "▶ CONTINUE · Day " + S.day }, { x, y: y + 66, w: 220, h: 44, act: "new", t: "🌱 start a new world" }];
  return [{ x, y, w: 220, h: 54, act: "play", main: true, t: "▶ PLAY" }, { x, y: y + 66, w: 220, h: 44, act: "random", t: "🎲 new random character" }];
}
function titleAct(act) {
  SFX.click();
  if (act === "play") startGame();
  else if (act === "random") newCharacters();
  else if (act === "continue") continueGame();
  else if (act === "new") S.confirm = true;            // ask first — a saved world is precious
  else if (act === "keep") S.confirm = false;
  else if (act === "wipe") { S.confirm = false; clearSave(); SAVED = null; newCharacters(); }
}
function handleTaps() {
  while (taps.length) {
    const t = taps.shift();
    if (S.state === "title") { for (const b of titleBtns()) if (t.x > b.x && t.x < b.x + b.w && t.y > b.y && t.y < b.y + b.h) { titleAct(b.act); break; } }
    else if (S.state === "win") dismissWin();
  }
}

/* ------------------------------ games menu ------------------------------ */
const gBtn = document.getElementById("gamesBtn"), gMenu = document.getElementById("gamesMenu");
gBtn.addEventListener("click", e => { e.stopPropagation(); gMenu.hidden = !gMenu.hidden; });
document.addEventListener("pointerdown", e => { if (!gMenu.hidden && !gMenu.contains(e.target) && e.target !== gBtn) gMenu.hidden = true; });

/* ------------------------------ boot ------------------------------ */
// a saved world comes back before the first frame, so the title shows the
// real crew and a CONTINUE button; a broken save is thrown away instead
SAVED = loadSave();
if (!SAVED || !restoreGame(SAVED)) { SAVED = null; clearSave(); }
S.state = "title";

/* ------------------------------ main loop ------------------------------ */
function frameLoop() {
  handleTaps();
  update();
  g.setTransform(DPR, 0, 0, DPR, 0, 0);
  g.clearRect(0, 0, W, H);
  if (S.state === "title") drawTitle();
  else {
    // sky behind the map
    const n = timeOfDay(); g.fillStyle = n > .5 ? "#141a33" : `rgb(${Math.round(120 - 80 * n)},${Math.round(180 - 120 * n)},${Math.round(230 - 150 * n)})`; g.fillRect(0, 0, W, H);
    drawScene(); drawWeather(); drawHUD(); drawPrompt(); drawFade();
    if (S.state === "win") drawWin();
  }
  requestAnimationFrame(frameLoop);
}
frameLoop();
</script>
</body>
