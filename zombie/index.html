<script>
"use strict";
/* ZOMBIE NIGHT — Nora's game. A blocky Minecraft/Roblox-style world seen from
   above at a corner. You get a RANDOM character (a blocky kid or a blocky
   animal), chop trees for wood (carry only 2 logs at a time), drop the logs in
   the yellow square and they stack up. Your two helpers build the house from
   the pile and fight the zombies (and wolf zombies!) that come at night.
   It can rain, lightning can strike, and when you touch the bed you can sleep
   until morning. Finish the whole house to win — then keep playing. */

const cv = document.getElementById("game");
const g  = cv.getContext("2d");
let W = 0, H = 0, DPR = 1, ZOOM = 1;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 3);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  // match the real visible viewport — iPhone Safari's 100vh is taller than the
  // window while the toolbar shows, which stretched taps one row low in Tennis
  cv.style.width = W + "px"; cv.style.height = H + "px";
  ZOOM = Math.max(.6, Math.min(1.1, Math.min(W, H * 1.4) / 900));
  dark.width = cv.width; dark.height = cv.height;
}
const dark = document.createElement("canvas"), dg = dark.getContext("2d");
window.addEventListener("resize", resize);
window.addEventListener("orientationchange", () => setTimeout(resize, 200));
if (window.visualViewport) window.visualViewport.addEventListener("resize", () => setTimeout(resize, 50));
resize();

/* ------------------------------ audio ------------------------------ */
let AC = null;
function audio() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (AC && AC.state === "suspended") AC.resume();
}
function tone(freq, dur, type, vol, slide, delay) {
  if (!AC) return;
  const o = AC.createOscillator(), gn = AC.createGain(), t = AC.currentTime + (delay || 0);
  o.type = type || "square"; o.frequency.setValueAtTime(freq, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), t + dur);
  gn.gain.setValueAtTime(vol || .12, t);
  gn.gain.exponentialRampToValueAtTime(.001, t + dur);
  o.connect(gn).connect(AC.destination); o.start(t); o.stop(t + dur + .02);
}
function noise(dur, vol, delay) {
  if (!AC) return;
  const n = Math.floor(AC.sampleRate * dur), buf = AC.createBuffer(1, n, AC.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n) * (1 - i / n);
  const s = AC.createBufferSource(), gn = AC.createGain(), t = AC.currentTime + (delay || 0);
  s.buffer = buf; gn.gain.setValueAtTime(vol || .3, t);
  gn.gain.exponentialRampToValueAtTime(.001, t + dur);
  s.connect(gn).connect(AC.destination); s.start(t);
}
const SFX = {
  chop:    () => { tone(180, .08, "square", .12, -60); noise(.06, .12); },
  fall:    () => { tone(90, .35, "sawtooth", .16, -50); noise(.25, .18, .05); },
  pick:    () => tone(700, .09, "square", .08, 300),
  drop:    () => { tone(420, .07, "square", .09, -120); tone(320, .1, "square", .08, -100, .07); },
  hammer:  () => { tone(520, .05, "square", .1, -200); noise(.04, .1); },
  built:   () => { [523, 659, 784, 1046].forEach((f, i) => tone(f, .18, "square", .1, 0, i * .09)); },
  groan:   () => tone(110 + Math.random() * 40, .5, "sawtooth", .07, -40),
  howl:    () => tone(300, .8, "sine", .09, 260),
  hurt:    () => { tone(200, .18, "square", .14, -120); noise(.1, .12); },
  whack:   () => { tone(260, .07, "square", .1, -150); noise(.05, .1); },
  poof:    () => { tone(600, .25, "triangle", .1, 500); noise(.15, .08); },
  thunder: () => { noise(1.2, .35); tone(45, 1.1, "sawtooth", .12, -20); },
  sleep:   () => { [392, 349, 330, 262].forEach((f, i) => tone(f, .4, "sine", .1, 0, i * .35)); },
  wake:    () => { [262, 330, 392, 523].forEach((f, i) => tone(f, .2, "triangle", .1, 0, i * .12)); },
  win:     () => { [523, 659, 784, 1046, 784, 1046, 1318].forEach((f, i) => tone(f, .22, "square", .11, 0, i * .13)); },
  faint:   () => { [330, 294, 262, 196].forEach((f, i) => tone(f, .3, "square", .1, 0, i * .22)); },
  click:   () => tone(880, .05, "square", .07),
};

/* ------------------------------ input ------------------------------ */
const keys = {};
window.addEventListener("keydown", e => {
  keys[e.key.toLowerCase()] = true;
  if ([" ", "arrowup", "arrowdown", "arrowleft", "arrowright"].includes(e.key.toLowerCase())) e.preventDefault();
  audio();
  if (S.state === "title" && (e.key === " " || e.key === "Enter")) startGame();
  else if (S.state === "win") dismissWin();
  else if (e.key === " " || e.key.toLowerCase() === "e") pressAction();
});
window.addEventListener("keyup", e => { keys[e.key.toLowerCase()] = false; });
document.addEventListener("touchmove", e => { if (e.touches.length < 2) e.preventDefault(); }, { passive: false });

// touch: a joystick appears wherever you first touch on the left 60% of the
// screen; the big 🪓 button lives bottom-right. Any other tap is a screen tap.
const joy = { id: null, ox: 0, oy: 0, x: 0, y: 0, dx: 0, dy: 0 };
let actId = null, actHeld = false;
const taps = [];   // screen taps for title / prompts
function actBtn() { return { x: W - 64 - 10, y: H - 64 - 14, r: 46 }; }
cv.addEventListener("pointerdown", e => {
  e.preventDefault(); audio();
  const x = e.clientX, y = e.clientY, b = actBtn();
  if (S.state !== "play") { taps.push({ x, y }); return; }
  if (Math.hypot(x - b.x, y - b.y) < b.r + 12) { actId = e.pointerId; actHeld = true; pressAction(); return; }
  if (menuTap(x, y)) return;
  if (joy.id === null) { joy.id = e.pointerId; joy.ox = joy.x = x; joy.oy = joy.y = y; joy.dx = joy.dy = 0; }
});
cv.addEventListener("pointermove", e => {
  if (e.pointerId === joy.id) {
    joy.x = e.clientX; joy.y = e.clientY;
    let dx = joy.x - joy.ox, dy = joy.y - joy.oy, m = Math.hypot(dx, dy), R = 46;
    if (m > R) { dx *= R / m; dy *= R / m; m = R; }
    joy.dx = dx / R; joy.dy = dy / R;
  }
});
function endPtr(e) {
  if (e.pointerId === joy.id) { joy.id = null; joy.dx = joy.dy = 0; }
  if (e.pointerId === actId) { actId = null; actHeld = false; }
}
cv.addEventListener("pointerup", endPtr); cv.addEventListener("pointercancel", endPtr);
cv.addEventListener("contextmenu", e => e.preventDefault());

/* ------------------------------ helpers ------------------------------ */
const rnd = (a, b) => a + Math.random() * (b - a);
const ri = (a, b) => Math.floor(rnd(a, b + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function shade(col, k) {   // k>1 lighter, k<1 darker; accepts #hex or rgb(...)
  let r, gg, b;
  if (col[0] === "#") { const n = parseInt(col.slice(1), 16); r = (n >> 16) & 255; gg = (n >> 8) & 255; b = n & 255; }
  else { const m = col.match(/\d+/g); r = +m[0]; gg = +m[1]; b = +m[2]; }
  r = clamp(Math.round(r * k), 0, 255); gg = clamp(Math.round(gg * k), 0, 255); b = clamp(Math.round(b * k), 0, 255);
  return `rgb(${r},${gg},${b})`;
}

/* ------------------------------ world ------------------------------ */
const MAP = 34;                 // tiles per side
const T = { GRASS: 0, WATER: 1, PATH: 2, PLANK: 3 };
let tiles = [], solid = [], trees = [], logs = [], zombies = [], parts = [], fx = [], drops = [];
const HOUSE = { x: 14, y: 13, w: 5, h: 5 };                    // house footprint
const SQUARE = { x: HOUSE.x + 6, y: HOUSE.y + 1, w: 2, h: 2 };  // the wood square
const STAGES = [
  { key: "floor",  name: "the floor",       cost: 4 },
  { key: "back",   name: "the back walls",  cost: 6 },
  { key: "front",  name: "the front walls", cost: 6 },
  { key: "door",   name: "the door",        cost: 2 },
  { key: "roof",   name: "the roof",        cost: 8 },
  { key: "bed",    name: "the bed",         cost: 3 },
  { key: "lantern",name: "the lantern",     cost: 2 },
];
const DOOR = { x: HOUSE.x + 2, y: HOUSE.y + HOUSE.h - 1 };
// bunk beds go in the other corners of the room; the second row stacks on top
const BUNK_POS = [{ x: HOUSE.x + 3, y: HOUSE.y + 1 }, { x: HOUSE.x + 1, y: HOUSE.y + 3 }, { x: HOUSE.x + 3, y: HOUSE.y + 3 }];
const MAX_BUNKS = BUNK_POS.length * 2;
const FOLLOW = [[-1.1, .9], [1.1, .9], [-1.7, -.1], [1.7, -.1], [-.6, 1.7], [.6, 1.7], [0, -1.5], [-2, 1.4]];
const BED  = { x: HOUSE.x + 1, y: HOUSE.y + 1 };
const S = { state: "title", built: 0, pile: 0, day: 1, clock: 0, phase: "day", t: 0, rain: 0, rainT: 0,
  flash: 0, thunderT: 0, msg: "", msgT: 0, prompt: null, fade: 0, fadeMode: "", won: false, wonT: 0,
  spawnT: 0, builder: null, buildProg: 0, nightsSurvived: 0, bunks: 0 };
const DAY_LEN = 75, DUSK_LEN = 8, NIGHT_LEN = 55, DAWN_LEN = 7;

function inHouse(x, y) { return x >= HOUSE.x && x < HOUSE.x + HOUSE.w && y >= HOUSE.y && y < HOUSE.y + HOUSE.h; }
function onRing(x, y) { return inHouse(x, y) && (x === HOUSE.x || y === HOUSE.y || x === HOUSE.x + HOUSE.w - 1 || y === HOUSE.y + HOUSE.h - 1); }
function isBack(x, y) { return onRing(x, y) && (x === HOUSE.x || y === HOUSE.y); }
function inSquare(x, y) { return x >= SQUARE.x && x < SQUARE.x + SQUARE.w && y >= SQUARE.y && y < SQUARE.y + SQUARE.h; }
function has(key) { return S.built > STAGES.findIndex(s => s.key === key); }
function nextStage() {
  if (S.built < STAGES.length) return STAGES[S.built];
  if (S.bunks < MAX_BUNKS) return { key: "bunk", name: "a bunk bed for a new helper", cost: 5 + S.bunks };
  return null;
}

function genWorld() {
  tiles = []; solid = []; trees = []; logs = []; zombies = []; fx = []; drops = [];
  for (let y = 0; y < MAP; y++) { tiles.push([]); solid.push([]); for (let x = 0; x < MAP; x++) { tiles[y].push(T.GRASS); solid[y].push(false); } }
  // a little pond
  const px = ri(4, 8), py = ri(20, 26);
  for (let y = py; y < py + 3; y++) for (let x = px; x < px + 4; x++) { tiles[y][x] = T.WATER; solid[y][x] = true; }
  // a dirt path from the house door out to the south-west edge
  for (let y = DOOR.y + 1; y < MAP; y++) { const x = DOOR.x + ((y - DOOR.y) % 5 === 3 ? 1 : 0); if (tiles[y][x] === T.GRASS) tiles[y][x] = T.PATH; }
  // trees everywhere except near the house, square and path
  let tries = 0;
  while (trees.length < 62 && tries++ < 4000) {
    const x = ri(1, MAP - 2), y = ri(1, MAP - 2);
    if (tiles[y][x] !== T.GRASS || solid[y][x]) continue;
    if (x >= HOUSE.x - 2 && x < SQUARE.x + SQUARE.w + 2 && y >= HOUSE.y - 2 && y < HOUSE.y + HOUSE.h + 4) continue;
    if (trees.some(t => Math.abs(t.x - x) + Math.abs(t.y - y) < 2)) continue;
    trees.push({ x, y, hp: 3, shake: 0, stump: 0, big: Math.random() < .3, tone: rnd(.85, 1.15) });
    solid[y][x] = true;
  }
  rebuildHouseSolids();
}
function rebuildHouseSolids() {
  for (let y = HOUSE.y; y < HOUSE.y + HOUSE.h; y++) for (let x = HOUSE.x; x < HOUSE.x + HOUSE.w; x++) {
    let s = false;
    if (onRing(x, y)) {
      if (isBack(x, y) && has("back")) s = true;
      if (!isBack(x, y) && has("front") && !(x === DOOR.x && y === DOOR.y)) s = true;
    }
    solid[y][x] = s;
  }
  if (has("bed")) solid[BED.y][BED.x] = false;   // bed is touchable, you walk onto it
}
function blocked(x, y, zombie) {
  const tx = Math.floor(x), ty = Math.floor(y);
  if (tx < 1 || ty < 1 || tx >= MAP - 1 || ty >= MAP - 1) return true;
  if (zombie && tx === DOOR.x && ty === DOOR.y && has("door")) return true;   // the door keeps zombies out
  return solid[ty][tx];
}
function moveEnt(e, dx, dy) {   // axis-separated slide against solid tiles
  const r = e.r || .28, z = e.zombie;
  let nx = e.x + dx;
  if (!blocked(nx - r, e.y - r, z) && !blocked(nx + r, e.y - r, z) && !blocked(nx - r, e.y + r, z) && !blocked(nx + r, e.y + r, z)) e.x = nx;
  let ny = e.y + dy;
  if (!blocked(e.x - r, ny - r, z) && !blocked(e.x + r, ny - r, z) && !blocked(e.x - r, ny + r, z) && !blocked(e.x + r, ny + r, z)) e.y = ny;
}
// breadth-first path over free tiles (4 neighbours, so nobody clips a corner).
// Returns tile-centre waypoints from the tile after the start to the target
// tile, or null when the target can't be reached.
function findPath(sx, sy, tx, ty, zombie) {
  const s = Math.floor(sy) * MAP + Math.floor(sx), goal = Math.floor(ty) * MAP + Math.floor(tx);
  if (s === goal) return [];
  const prev = new Int16Array(MAP * MAP).fill(-1); prev[s] = s;
  const queue = [s]; let qi = 0;
  while (qi < queue.length) {
    const c = queue[qi++]; if (c === goal) break;
    const cx = c % MAP, cy = (c - cx) / MAP;
    for (const [nx, ny] of [[cx + 1, cy], [cx - 1, cy], [cx, cy + 1], [cx, cy - 1]]) {
      if (nx < 1 || ny < 1 || nx >= MAP - 1 || ny >= MAP - 1) continue;
      const n = ny * MAP + nx;
      if (prev[n] !== -1 || blocked(nx + .5, ny + .5, zombie)) continue;
      prev[n] = c; queue.push(n);
    }
  }
  if (prev[goal] === -1) return null;
  const path = [];
  for (let c = goal; c !== s; c = prev[c]) path.push({ x: (c % MAP) + .5, y: Math.floor(c / MAP) + .5 });
  return path.reverse();
}
// walk toward (tx,ty) along a path, re-planning every so often; falls back to
// a straight walk when there's no route (e.g. a zombie outside a closed house)
function goTo(e, tx, ty, sp, dt) {
  e.pathT = (e.pathT || 0) - dt;
  if (!e.path || e.pathT <= 0 || Math.abs(tx - e.ptx) > .9 || Math.abs(ty - e.pty) > .9) {
    e.path = findPath(e.x, e.y, tx, ty, e.zombie); e.pathT = .7; e.ptx = tx; e.pty = ty;
  }
  if (e.path === null) return walkTo(e, tx, ty, sp, dt);
  while (e.path.length && Math.hypot(e.path[0].x - e.x, e.path[0].y - e.y) < .25) e.path.shift();
  if (!e.path.length) return walkTo(e, tx, ty, sp, dt);
  walkTo(e, e.path[0].x, e.path[0].y, sp, dt); return false;
}

/* ------------------------------ characters ------------------------------ */
const SKINS = ["#f7d1b0", "#e8b894", "#c98e63", "#a86b45", "#7a4a2b", "#5a3520"];
const HAIRS = ["#2b1b12", "#5a3a1e", "#c48a3c", "#f1d36a", "#d9482b", "#1c1c1c", "#8a5a9e"];
const SHIRTS = ["#e63946", "#2a9d8f", "#f4a261", "#8338ec", "#3a86ff", "#ff006e", "#06d6a0", "#ffbe0b"];
const PANTS = ["#264653", "#1d3557", "#6c757d", "#5a189a", "#8d5524", "#0a9396"];
const KID_NAMES = ["Ziggy", "Pip", "Milo", "Luna", "Ruby", "Max", "Ivy", "Otto", "Bea", "Finn", "Coco", "Remy", "Wren", "Zara", "Theo", "Suki"];
const ANIMALS = [
  { kind: "cat",   name: "Cat",   body: "#f2a541", belly: "#fff3d6", ears: "tri", tail: true },
  { kind: "dog",   name: "Dog",   body: "#b5804f", belly: "#f4e2c8", ears: "flop", tail: true },
  { kind: "fox",   name: "Fox",   body: "#e8622c", belly: "#fff1e3", ears: "tri", tail: true },
  { kind: "bunny", name: "Bunny", body: "#f6f0ea", belly: "#ffd6e0", ears: "tall", tail: false },
  { kind: "panda", name: "Panda", body: "#f5f5f5", belly: "#f5f5f5", ears: "round", tail: false, patch: "#222" },
  { kind: "pig",   name: "Pig",   body: "#f7a8c4", belly: "#ffd3e1", ears: "tri", tail: true },
  { kind: "frog",  name: "Frog",  body: "#5cc46a", belly: "#d9f7c5", ears: "none", tail: false },
  { kind: "cow",   name: "Cow",   body: "#f8f8f8", belly: "#f8f8f8", ears: "flop", tail: true, patch: "#333" },
  { kind: "tiger", name: "Tiger", body: "#f39a2b", belly: "#fff2d8", ears: "round", tail: true, stripes: "#222" },
];
function makeChar(usedNames) {
  const c = { x: 0, y: 0, r: .28, dir: 1, walk: 0, bob: 0, hp: 5, maxHp: 5, wood: 0, swing: 0, hurtT: 0 };
  if (Math.random() < .5) {
    c.type = "kid"; c.skin = pick(SKINS); c.hair = pick(HAIRS); c.shirt = pick(SHIRTS); c.pants = pick(PANTS);
    c.hairStyle = pick(["short", "long", "bun", "spiky"]); c.hat = Math.random() < .4 ? pick(["cap", "beanie", "crown", "none"]) : "none";
    let n; do { n = pick(KID_NAMES); } while (usedNames.includes(n)); c.name = n;
    c.label = n + " the blocky kid";
  } else {
    const a = pick(ANIMALS); Object.assign(c, a); c.type = "animal";
    let n; do { n = pick(KID_NAMES); } while (usedNames.includes(n)); c.name = n;
    c.label = n + " the blocky " + a.name.toLowerCase();
  }
  usedNames.push(c.name);
  return c;
}
let P = null, helpers = [];
function newCharacters() {
  const used = [];
  P = makeChar(used);
  helpers = [makeChar(used), makeChar(used)];
  helpers.forEach((h, i) => { h.helper = true; h.state = "follow"; h.target = null; h.cool = 0; h.hp = 99; h.idx = i; });
}
newCharacters();
function newHelper() {   // a new blocky friend walks in from the edge of the forest
  const used = [P.name, ...helpers.map(h => h.name)];
  const h = makeChar(used);
  h.helper = true; h.state = "follow"; h.target = null; h.cool = 0; h.hp = 99; h.idx = helpers.length; h.carry = 0;
  const side = ri(0, 3);
  for (let i = 0; i < 40; i++) {
    h.x = side === 0 ? 1.5 : side === 1 ? MAP - 1.5 : rnd(2, MAP - 2);
    h.y = side === 2 ? 1.5 : side === 3 ? MAP - 1.5 : rnd(2, MAP - 2);
    if (!blocked(h.x, h.y)) break;
  }
  helpers.push(h); boom(h.x, h.y, "#ffd166", 10, 4);
  return h;
}

/* ------------------------------ messages ------------------------------ */
function say(m, t) { S.msg = m; S.msgT = t || 3; }
function boom(x, y, col, n, up) {
  for (let i = 0; i < (n || 10); i++) fx.push({ x: x + rnd(-.3, .3), y: y + rnd(-.3, .3), z: rnd(.2, 1.2),
    vx: rnd(-1.5, 1.5), vy: rnd(-1.5, 1.5), vz: rnd(1, up || 4), col, t: rnd(.5, 1) });
}

/* ------------------------------ game flow ------------------------------ */
function startGame() {

function roundRect(x, y, w, h, r) { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }
function drawHUD() {
  const top = Math.max(10, parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--sat")) || 10);
  g.font = "bold 18px 'Avenir Next','Trebuchet MS',Arial"; g.textAlign = "left"; g.textBaseline = "middle";
  // hearts
  let hearts = ""; for (let i = 0; i < P.maxHp; i++) hearts += i < P.hp ? "❤️" : "🖤";
  g.fillStyle = "rgba(0,0,0,.4)"; roundRect(10, top, 150, 30, 10); g.fill(); g.fillText(hearts, 18, top + 16);
  // wood + pile
  const st = nextStage();
  const line2 = "🪵 " + P.wood + "/2 carrying   pile: " + S.pile + (st ? "   next: " + st.name + " (" + st.cost + ")" : "   🏠 house full — everyone has a bed!");
  g.font = "bold 14px 'Avenir Next','Trebuchet MS',Arial";
  const w2 = g.measureText(line2).width + 20;
  g.fillStyle = "rgba(0,0,0,.4)"; roundRect(10, top + 36, w2, 26, 9); g.fill(); g.fillStyle = "#fff"; g.fillText(line2, 20, top + 49);
  // time + character
  const ph = S.phase === "day" ? "☀️ Day " + S.day : S.phase === "dusk" ? "🌇 Evening" : S.phase === "night" ? "🌙 Night " + S.day : "🌅 Dawn";
  const line3 = ph + (S.rain ? "  ⛈" : "") + "   you are " + P.label;
  const w3 = g.measureText(line3).width + 20;
  g.fillStyle = "rgba(0,0,0,.4)"; roundRect(10, top + 68, w3, 26, 9); g.fill(); g.fillStyle = "#fff"; g.fillText(line3, 20, top + 81);
  // house progress bar
  const pw = Math.min(240, W - 40), px = 10, py = top + 100;
  g.fillStyle = "rgba(0,0,0,.4)"; roundRect(px, py, pw, 16, 8); g.fill();
  g.fillStyle = "#ffd166"; roundRect(px + 2, py + 2, (pw - 4) * (S.built / STAGES.length), 12, 6); g.fill();
  if (S.built >= STAGES.length) { g.fillStyle = "#fff"; g.font = "bold 12px 'Avenir Next','Trebuchet MS',Arial"; g.fillText("🛏 bunk beds " + S.bunks + "/" + MAX_BUNKS + "   👫 helpers " + helpers.length, px + pw + 10, py + 9); }
  if (S.builder) { g.fillStyle = "#fff"; g.font = "bold 12px 'Avenir Next','Trebuchet MS',Arial"; g.fillText("🔨 " + S.builder.name + " is building… (stand close + 🪓 to help)", px, py + 28); }
  // message
  if (S.msgT > 0 && S.msg) {
    g.font = "bold 16px 'Avenir Next','Trebuchet MS',Arial"; g.textAlign = "center";
    const mw = Math.min(W - 30, g.measureText(S.msg).width + 30);
    g.fillStyle = "rgba(0,0,0,.55)"; roundRect(W / 2 - mw / 2, H - 150, mw, 34, 12); g.fill(); g.fillStyle = "#ffe";
    g.fillText(S.msg, W / 2, H - 133, W - 40);
  }
  // touch controls
  const b = actBtn();
  g.fillStyle = actHeld ? "rgba(255,209,102,.9)" : "rgba(255,255,255,.35)"; g.beginPath(); g.arc(b.x, b.y, b.r, 0, Math.PI * 2); g.fill();
  g.strokeStyle = "rgba(255,255,255,.7)"; g.lineWidth = 3; g.stroke();
  g.font = "40px sans-serif"; g.textAlign = "center"; g.fillStyle = "#fff"; g.fillText("🪓", b.x, b.y + 3);
  if (joy.id !== null) {
    g.fillStyle = "rgba(255,255,255,.25)"; g.beginPath(); g.arc(joy.ox, joy.oy, 52, 0, Math.PI * 2); g.fill();
    g.fillStyle = "rgba(255,255,255,.7)"; g.beginPath(); g.arc(joy.ox + joy.dx * 46, joy.oy + joy.dy * 46, 24, 0, Math.PI * 2); g.fill();
  } else if (S.t < 20) { g.font = "bold 14px 'Avenir Next','Trebuchet MS',Arial"; g.fillStyle = "rgba(255,255,255,.8)"; g.textAlign = "left"; g.fillText("👆 drag anywhere to walk · arrows/WASD + space on a keyboard", 14, H - 24); }
  g.textBaseline = "alphabetic";
}
function drawPrompt() {
  if (!S.prompt) return;
  g.fillStyle = "rgba(0,0,0,.45)"; g.fillRect(0, 0, W, H);
  g.fillStyle = "#fff"; roundRect(W / 2 - 170, H / 2 - 70, 340, 160, 18); g.fill();
  g.fillStyle = "#2a3a55"; g.font = "bold 24px 'Avenir Next','Trebuchet MS',Arial"; g.textAlign = "center"; g.fillText(S.prompt.text, W / 2, H / 2 - 20);
  for (const b of promptBtns()) { g.fillStyle = b.yes ? "#06d6a0" : "#e9ecef"; roundRect(b.x, b.y, b.w, b.h, 14); g.fill(); g.fillStyle = b.yes ? "#fff" : "#2a3a55"; g.font = "bold 20px 'Avenir Next','Trebuchet MS',Arial"; g.fillText(b.t, b.x + b.w / 2, b.y + 33); }
}
function drawFade() {
  if (S.state !== "sleep" && S.state !== "faint") return;
  const a = S.fade < 1.2 ? Math.min(1, S.fade / .8) : Math.max(0, 1 - (S.fade - 1.6) / .8);
  g.fillStyle = `rgba(0,0,10,${a})`; g.fillRect(0, 0, W, H);
  if (a > .9) { g.fillStyle = "#fff"; g.font = "bold 34px 'Avenir Next','Trebuchet MS',Arial"; g.textAlign = "center"; g.fillText(S.fadeMode === "sleep" ? "😴 zzz…" : "😵 You fainted!", W / 2, H / 2); }
}
function drawWin() {
  const t = S.wonT;
  g.fillStyle = `rgba(0,0,0,${Math.min(.5, t)})`; g.fillRect(0, 0, W, H);
  for (let i = 0; i < 80; i++) { const hx = hash(i, 1), hs = hash(i, 2); const y = ((t * (60 + hs * 120) + hx * H) % (H + 40)) - 20; g.fillStyle = ["#ffbe0b", "#fb5607", "#ff006e", "#8338ec", "#3a86ff", "#06d6a0"][i % 6]; g.fillRect(hx * W, y, 8, 12); }
  g.fillStyle = "#fff"; g.textAlign = "center"; g.font = "bold 44px 'Avenir Next','Trebuchet MS',Arial"; g.fillText("🏠 YOU BUILT THE HOUSE! 🎉", W / 2, H / 2 - 30, W - 30);
  g.font = "bold 22px 'Avenir Next','Trebuchet MS',Arial"; g.fillText(P.name + " and the helpers did it!", W / 2, H / 2 + 14);
  if (t > 1.2) { g.fillStyle = "#ffd166"; g.font = "bold 20px 'Avenir Next','Trebuchet MS',Arial"; g.fillText("Tap to keep playing!", W / 2, H / 2 + 60, W - 30);
    g.fillStyle = "#fff"; g.font = "bold 16px 'Avenir Next','Trebuchet MS',Arial"; g.fillText("Next: build bunk beds and new helpers will move in 🛏", W / 2, H / 2 + 90, W - 30); }
}

/* ------------------------------ title ------------------------------ */
function drawTitle() {
  const sky = g.createLinearGradient(0, 0, 0, H); sky.addColorStop(0, "#1a2340"); sky.addColorStop(1, "#4a3a6a"); g.fillStyle = sky; g.fillRect(0, 0, W, H);
  g.fillStyle = "#fff"; for (let i = 0; i < 60; i++) g.fillRect(hash(i, 5) * W, hash(i, 9) * H * .6, 2, 2);
  g.fillStyle = "#f4f1de"; g.beginPath(); g.arc(W * .86, H * .08, 26, 0, Math.PI * 2); g.fill();
  // ground + character preview
  g.save(); g.translate(W / 2, H * .58); g.scale(ZOOM * 1.5, ZOOM * 1.5);
  diamond(-1, -1, "#5fae3e", 2); diamond(-.5, -.5, "#6cbf47", 1);
  P.dir = 1; P.hurtT = 0; P.bob = Math.abs(Math.sin(P.walk)) * .06; drawChar(P);
  g.restore();
  g.textAlign = "center"; g.fillStyle = "#6ee27a"; g.font = "900 " + Math.min(64, W / 8) + "px 'Avenir Next','Trebuchet MS',Arial";
  g.fillText("ZOMBIE NIGHT", W / 2, H * .2);
  g.fillStyle = "#fff"; g.font = "bold 16px 'Avenir Next','Trebuchet MS',Arial"; g.fillText("a Nora game · chop, build, survive", W / 2, H * .2 + 30);
  g.font = "bold 22px 'Avenir Next','Trebuchet MS',Arial"; g.fillStyle = "#ffd166"; g.fillText("You are " + P.label + "!", W / 2, H * .72);
  g.fillStyle = "#fff"; g.font = "bold 15px 'Avenir Next','Trebuchet MS',Arial";
  g.fillText("helpers: " + helpers[0].name + " & " + helpers[1].name, W / 2, H * .72 + 26);
  for (const b of titleBtns()) { g.fillStyle = b.main ? "#06d6a0" : "rgba(255,255,255,.18)"; roundRect(b.x, b.y, b.w, b.h, 16); g.fill(); g.fillStyle = "#fff"; g.font = "bold 20px 'Avenir Next','Trebuchet MS',Arial"; g.fillText(b.t, b.x + b.w / 2, b.y + b.h / 2 + 7); }
}
function dismissWin() {
  if (S.wonT < 1.2) return;
  S.state = "play"; say("Build bunk beds and new helpers will move in! 🛏", 5);
}
function titleBtns() { return [{ x: W / 2 - 110, y: H * .8, w: 220, h: 54, main: true, t: "▶ PLAY" }, { x: W / 2 - 110, y: H * .8 + 66, w: 220, h: 44, t: "🎲 new random character" }]; }
function handleTaps() {
  while (taps.length) {
    const t = taps.shift();
    if (S.state === "title") { for (const b of titleBtns()) if (t.x > b.x && t.x < b.x + b.w && t.y > b.y && t.y < b.y + b.h) { SFX.click(); if (b.main) startGame(); else newCharacters(); } }
    else if (S.state === "win") dismissWin();
  }
}

/* ------------------------------ games menu ------------------------------ */
const gBtn = document.getElementById("gamesBtn"), gMenu = document.getElementById("gamesMenu");
gBtn.addEventListener("click", e => { e.stopPropagation(); gMenu.hidden = !gMenu.hidden; });
document.addEventListener("pointerdown", e => { if (!gMenu.hidden && !gMenu.contains(e.target) && e.target !== gBtn) gMenu.hidden = true; });

/* ------------------------------ main loop ------------------------------ */
function frameLoop() {
  handleTaps();
  update();
  g.setTransform(DPR, 0, 0, DPR, 0, 0);
  g.clearRect(0, 0, W, H);
  if (S.state === "title") drawTitle();
  else {
    // sky behind the map
    const n = timeOfDay(); g.fillStyle = n > .5 ? "#141a33" : `rgb(${Math.round(120 - 80 * n)},${Math.round(180 - 120 * n)},${Math.round(230 - 150 * n)})`; g.fillRect(0, 0, W, H);
    drawScene(); drawWeather(); drawHUD(); drawPrompt(); drawFade();
    if (S.state === "win") drawWin();
  }
  requestAnimationFrame(frameLoop);
}
frameLoop();
</script>
</body>
