<script>
"use strict";
/* Real game state lives here; the art stub `game` only needs .timer, which we
   drive from our own clock each frame. */
const S = {
  state: "title", timer: 0, stage: 0, solo: false, single: false,
  players: [ { key: null, racket: 0 }, { key: null, racket: 0 } ],
  round: 0, rivals: [], usedRivals: [],
  scoreUs: 0, scoreThem: 0, servingUs: true,
  cards: [], speedChips: [], pointBanner: "", bannerT: 0, champT: 0,
  ballSpd: 1, runSpd: 1,        // 🐢 0.7 / 🙂 1 / ⚡ 1.3 — set on the mode screen
};
const SPEED_OPTS = [ { label: "🐢", mul: 0.7 }, { label: "🙂", mul: 1 }, { label: "⚡", mul: 1.3 } ];
try {
  S.ballSpd = parseFloat(localStorage.getItem("tennisBallSpd")) || 1;
  S.runSpd  = parseFloat(localStorage.getItem("tennisRunSpd"))  || 1;
} catch (e) {}
let ents = [];        // the four athletes [p1, p2, r1, r2]
let ball = null, fx = [], rallyN = 0;

function heroesLeft() { return KEYS.filter(k => k !== S.players[0].key && k !== S.players[1].key && !S.usedRivals.includes(k)); }

function startTournament() {
  S.round = 0; S.usedRivals = [];
  nextRound();
}
function nextRound() {
  const pool = heroesLeft();
  const a = pool[(Math.random() * pool.length) | 0];
  const pool2 = pool.filter(k => k !== a);
  const b = pool2[(Math.random() * pool2.length) | 0];
  S.rivals = S.single ? [a] : [a, b];
  S.usedRivals.push(...S.rivals);
  S.scoreUs = 0; S.scoreThem = 0; S.servingUs = true;
  buildMatch();
  S.state = "bracket"; S.timer = 0;
}
function buildMatch() {
  const [p1, p2] = S.players;
  if (S.single) {
    ents = [
      { key: p1.key, racket: p1.racket, x: 0, y: 230, tx: 0, ty: 230, us: true,  who: 0, swingT: 0, face: 1 },
      { key: S.rivals[0], racket: 3, x: 0, y: -230, tx: 0, ty: -230, us: false, who: 2, swingT: 0, face: 1 },
    ];
  } else {
    ents = [
      { key: p1.key, racket: p1.racket, x: -120, y: 230, tx: -120, ty: 230, us: true,  who: 0, swingT: 0, face: 1 },
      { key: p2.key, racket: p2.racket, x: 120,  y: 230, tx: 120,  ty: 230, us: true,  who: 1, swingT: 0, face: 1 },
      { key: S.rivals[0], racket: 0, x: -120, y: -230, tx: -120, ty: -230, us: false, who: 2, swingT: 0, face: 1 },
      { key: S.rivals[1], racket: 3, x: 120,  y: -230, tx: 120,  ty: -230, us: false, who: 3, swingT: 0, face: 1 },
    ];
  }
  fx = [];
  serve();
}
function rivalEnts() { return ents.filter(e => !e.us); }
function serve() {
  rallyN = 0;
  const server = S.servingUs ? ents[0] : rivalEnts()[0];
  ball = { x: server.x, y: server.y * 0.92, z: 26, vx: 0, vy: 0, vz: 0,
           live: false, waitT: 50, lastSide: S.servingUs ? 1 : -1, bounces: 0, bounceSide: 0 };
}
function hitBall(e, powMul) {
  const r = RACKETS[e.racket];
  const towardUs = !e.us;                     // ball goes to the other side
  const ty = (towardUs ? 1 : -1) * (120 + Math.random() * 170);
  let tx;
  if (e.us) {                                  // sisters aim away from the nearest rival
    const rx = rivalEnts().sort((a, b) => Math.abs(a.x - (-e.x)) - Math.abs(b.x - (-e.x)));
    tx = -Math.sign(rx[0].x || 1) * (60 + Math.random() * 150);
  } else {
    // rivals aim at open space — but the further behind they are, the more they miss
    const wide = Math.max(0, S.scoreThem - S.scoreUs) * 6 + aiErr();
    tx = (Math.random() < 0.5 ? -1 : 1) * (40 + Math.random() * 160) + (Math.random() - 0.5) * wide;
    if (Math.random() < aiOutChance()) tx = Math.sign(tx) * (CX + 20 + Math.random() * 40);   // whoops, wide!
  }
  const T = (52 - S.round * 3 + Math.random() * 10) / S.ballSpd;   // 🐢/⚡ ball toggle stretches or shrinks flight time
  ball.vx = (tx - ball.x) / T;
  ball.vy = (ty - ball.y) / T * (r.pow * (powMul || 1));
  ball.vz = (0.20 * T) / 2 - ball.z / T;      // arc that lands right about at T
  ball.live = true; ball.lastSide = e.us ? 1 : -1;
  ball.bounces = 0;
  e.swingT = 14;
  rallyN++;
  SFX.pock();
  fx.push({ type: "pow", x: ball.x, y: ball.y, z: ball.z, t: 0 });
  if (RACKETS[e.racket].sparkle) for (let i = 0; i < 5; i++)
    fx.push({ type: "spark", x: ball.x + (Math.random() - 0.5) * 30, y: ball.y, z: ball.z + Math.random() * 20, t: 0 });
}
function aiErr() { return [10, 6, 2][S.round] || 2; }
function aiOutChance() {
  const base = [0.16, 0.11, 0.07][S.round] || 0.07;
  const mercy = S.scoreThem > S.scoreUs + 2 ? 0.1 : 0;   // rubber band, kid-side
  return base + mercy;
}
function aiSpeed() { return [2.8, 3.3, 3.8][S.round] || 3.8; }

function scorePoint(usScored, why) {
  if (usScored) { S.scoreUs++; SFX.point(); } else { S.scoreThem++; SFX.lose(); }
  S.servingUs = usScored;
  S.pointBanner = why; S.bannerT = 80;
  if (S.scoreUs >= WIN_PTS || S.scoreThem >= WIN_PTS) {
    S.state = "matchend"; S.timer = 0;
    if (S.scoreUs >= WIN_PTS) SFX.cheer(); else SFX.lose();
  } else serve();
}

/* ------------------------------ input ------------------------------ */
const pointers = {};   // pointerId → {who}
cv.addEventListener("pointerdown", e => {
  e.preventDefault(); audio();
  if (S.state === "title") { S.state = "mode"; S.timer = 0; SFX.select(); return; }
  if (S.state === "mode") {
    for (const ch of S.speedChips)
      if (e.clientX >= ch.x - 8 && e.clientX <= ch.x + ch.w + 8 && e.clientY >= ch.y - 10 && e.clientY <= ch.y + ch.h + 10) {
        S[ch.which] = ch.mul; SFX.select();
        try { localStorage.setItem(ch.which === "ballSpd" ? "tennisBallSpd" : "tennisRunSpd", ch.mul); } catch (err) {}
        return;
      }
    for (const c of S.cards)
      if (e.clientX >= c.sx && e.clientX <= c.sx + c.sw && e.clientY >= c.sy && e.clientY <= c.sy + c.sh) {
        S.solo = c.solo; S.single = !!c.single;
        S.state = "pick"; S.stage = 0; S.timer = 0; SFX.select(); return;
      }
    return;
  }
  if (S.state === "pick") {
    for (const c of S.cards)
      if (e.clientX >= c.sx && e.clientX <= c.sx + c.sw && e.clientY >= c.sy && e.clientY <= c.sy + c.sh)
        return pickCard(c);
    return;
  }
  if (S.state === "bracket" && S.timer > 30) { S.state = "play"; S.timer = 0; return; }
  if (S.state === "matchend" && S.timer > 60) {
    if (S.scoreUs >= WIN_PTS) {
      if (S.round + 1 >= ROUNDS) { S.state = "champion"; S.timer = 0; SFX.fanfare(); }
      else { S.round++; nextRound(); }
    } else { S.scoreUs = 0; S.scoreThem = 0; buildMatch(); S.state = "bracket"; S.timer = 0; }  // try again!
    return;
  }
  if (S.state === "champion" && S.timer > 90) { S.state = "title"; S.timer = 0; return; }
  if (S.state === "play") {
    const who = (S.solo || S.single) ? 0 : (e.clientX < W / 2 ? 0 : 1);   // solo/1-on-1: the whole screen is yours
    pointers[e.pointerId] = { who };
    steerTo(who, e.clientX, e.clientY);
  }
}, { passive: false });
cv.addEventListener("pointermove", e => {
  const p = pointers[e.pointerId];
  if (p && S.state === "play") steerTo(p.who, e.clientX, e.clientY);
});
const clearPtr = e => { delete pointers[e.pointerId]; };
cv.addEventListener("pointerup", clearPtr);
cv.addEventListener("pointercancel", clearPtr);

function steerTo(who, sx, sy) {
  const c = unproject(sx, sy);
  const e2 = ents[who];
  if (!e2) return;
  e2.tx = Math.max(-CX, Math.min(CX, c.x));
  e2.ty = Math.max(30, Math.min(CY - 6, c.y));
  e2.touchT = 90;
}
const keys = {};
addEventListener("keydown", e => { keys[e.code] = true; audio();
  if ((S.state === "title" || S.state === "bracket" || S.state === "matchend" || S.state === "champion") &&
      (e.code === "Space" || e.code === "Enter"))
    cv.dispatchEvent(new PointerEvent("pointerdown", { clientX: W / 2, clientY: H / 2, bubbles: true }));
});
addEventListener("keyup", e => { keys[e.code] = false; });

function pickCard(c) {
  SFX.select();
  if (S.stage === 0) { S.players[0].key = c.key; S.stage = 1; }
  else if (S.stage === 1) {
    S.players[0].racket = c.idx;
    if (S.single) { S.players[1].key = null; startTournament(); } else S.stage = 2;
  }
  else if (S.stage === 2) { S.players[1].key = c.key; S.stage = 3; }
  else { S.players[1].racket = c.idx; startTournament(); }
  S.timer = 0;
}

/* ------------------------------ update ------------------------------ */
function updatePlay() {
  // sisters: follow finger (or keys), otherwise drift helpfully toward the ball
  for (const e of ents) {
    let speed = e.us ? (S.single ? 4.8 : 4.3) : aiSpeed();
    if (e.us && S.solo && e.who === 1) {
      // 🤖 the magic buddy: a proper bot teammate covering her half
      speed = 3.9;
      if (ball && ball.live && ball.lastSide === -1 && ball.x >= -10) {
        e.tx = ball.x; e.ty = Math.max(60, Math.min(CY - 20, ball.y));
      } else { e.tx = 130; e.ty = 215; }
    } else if (e.us) {
      if (e.touchT > 0) e.touchT--;
      const useKeys1 = e.who === 0, useBoth = (S.solo || S.single) && e.who === 0;
      const kx = (useKeys1 ? ((keys["KeyD"] ? 1 : 0) - (keys["KeyA"] ? 1 : 0)) : 0) +
                 ((!useKeys1 || useBoth) ? ((keys["ArrowRight"] ? 1 : 0) - (keys["ArrowLeft"] ? 1 : 0)) : 0);
      const ky = (useKeys1 ? ((keys["KeyS"] ? 1 : 0) - (keys["KeyW"] ? 1 : 0)) : 0) +
                 ((!useKeys1 || useBoth) ? ((keys["ArrowDown"] ? 1 : 0) - (keys["ArrowUp"] ? 1 : 0)) : 0);
      if (kx || ky) { e.tx = e.x + Math.sign(kx) * 60; e.ty = e.y + Math.sign(ky) * 60; e.touchT = 90; }
      if (e.touchT <= 0 && ball && ball.live && ball.lastSide === -1) {
        // helpful auto-run when nobody is steering (1-on-1: it's all your court)
        const myHalf = S.single ? true : (e.who === 0 ? ball.x <= 10 : ball.x >= -10);
        if (myHalf) { e.tx = ball.x; e.ty = Math.max(60, Math.min(CY - 20, ball.y)); }
      }
    } else if (ball) {
      // rivals chase the ball on their side (a lone 1-on-1 rival covers it all)
      if (S.single) speed = aiSpeed() + 0.2;
      const myHalf = S.single ? true : (e.who === 2 ? ball.x <= 30 : ball.x >= -30);
      if (ball.live && ball.lastSide === 1 && myHalf) { e.tx = ball.x; e.ty = Math.min(-40, Math.max(-CY + 10, ball.y)); }
      else { e.tx = S.single ? 0 : (e.who === 2 ? -120 : 120); e.ty = -220; }
    }
    const dx = e.tx - e.x, dy = e.ty - e.y, d = Math.hypot(dx, dy);
    const sp = speed * S.runSpd;                                    // 🐢/⚡ running toggle
    if (d > 2) { e.x += dx / d * Math.min(sp, d); e.y += dy / d * Math.min(sp, d); }
    if (Math.abs(dx) > 2) e.face = Math.sign(dx);
    if (e.us) { e.y = Math.max(26, Math.min(CY - 4, e.y)); } else { e.y = Math.min(-26, Math.max(-CY + 4, e.y)); }
    e.x = Math.max(-CX, Math.min(CX, e.x));
    if (e.swingT > 0) e.swingT--;
  }

  if (!ball) return;
  if (!ball.live) {
    ball.waitT--;
    const server = S.servingUs ? ents[0] : rivalEnts()[0];
    ball.x = server.x + 14 * server.face; ball.y = server.y * 0.94;
    if (ball.waitT <= 0) hitBall(server, 0.9);
    return;
  }
  // flight
  ball.trail = ball.trail || [];
  ball.trail.push({ x: ball.x, y: ball.y, z: ball.z });
  if (ball.trail.length > 6) ball.trail.shift();
  ball.x += ball.vx; ball.y += ball.vy;
  ball.z += ball.vz; ball.vz -= 0.20;
  if (ball.z <= 0) {
    ball.z = 0; ball.vz = Math.abs(ball.vz) * 0.62;
    const inX = Math.abs(ball.x) <= CX + 6, inY = Math.abs(ball.y) <= CY + 6;
    const side = ball.y > 0 ? 1 : -1;
    SFX.bounce();
    fx.push({ type: "dust", x: ball.x, y: ball.y, z: 0, t: 0 });
    if (!(inX && inY)) {
      // landed out: the team that hit it loses the point
      scorePoint(ball.lastSide === -1, ball.lastSide === -1 ? "OUT! ✨ point for the sisters!" : "Out… their point");
      return;
    }
    if (ball.bounceSide === side) ball.bounces++;
    else { ball.bounceSide = side; ball.bounces = 1; }
    if (ball.bounces >= 2) {
      // double bounce: whoever let it drop loses
      scorePoint(side === -1, side === -1 ? "Double bounce! Sisters score!" : "Oh no, it bounced twice…");
      return;
    }
  }
  // sailed past a baseline without landing? point for the other team
  if (ball.y > CY + 90) { scorePoint(false, "It got past…"); return; }
  if (ball.y < -CY - 90) { scorePoint(true, "ACE! It flew right past them!"); return; }

  // swings: anyone close enough (and the ball heading their way) returns it
  for (const e of ents) {
    if (e.swingT > 0) continue;
    const sameSide = e.us ? ball.y > 0 : ball.y < 0;
    const heading = e.us ? ball.vy > 0 : ball.vy < 0;
    const reach = 42 * RACKETS[e.racket].reach;
    if (sameSide && heading && ball.z < 70 &&
        Math.abs(ball.x - e.x) < reach && Math.abs(ball.y - e.y) < reach * 0.9) {
      hitBall(e, 1);
      break;
    }
  }
  for (const p of fx) p.t++;
  fx = fx.filter(p => p.t < 30);
}

function update() {
  S.timer++;
  game.timer = S.timer;               // drive the shared art's clock
  if (S.bannerT > 0) S.bannerT--;
  if (S.state === "play") updatePlay();
}

/* ------------------------------ drawing ------------------------------ */
function rr(x, y, w, h, r) { rrPath(g, x, y, w, h, r); }
function outlineText(txt, x, y, fill, size) {
  g.lineWidth = Math.max(3, (size || 20) / 7); g.lineJoin = "round";
  g.strokeStyle = "rgba(0,0,0,.35)";
  g.strokeText(txt, x, y); g.fillStyle = fill; g.fillText(txt, x, y);
}

function drawRacket(e, scale) {
  const r = RACKETS[e.racket];
  const swing = e.swingT > 0 ? (e.swingT / 14) : 0;
  g.save();
  g.translate(12 * e.face * scale, -26 * scale);
  g.rotate(e.face * (-0.5 + swing * -1.6));
  g.scale(scale, scale);
  g.strokeStyle = r.grip; g.lineWidth = 3.6; g.lineCap = "round";
  g.beginPath(); g.moveTo(0, 10); g.lineTo(0, -2); g.stroke();
  if (r.head === "rainbow") {
    const cols = ["#ff5e6c","#ff9f43","#ffd23e","#5ecb6a","#4aa6f0","#9b6cff"];
    for (let i = 0; i < 6; i++) {
      g.strokeStyle = cols[i]; g.lineWidth = 3;
      g.beginPath(); g.ellipse(0, -12, 9 - i * 0.7, 12 - i * 0.7, 0, 0, Math.PI * 2); g.stroke();
    }
  } else {
    g.strokeStyle = r.head; g.lineWidth = 3.4;
    g.beginPath(); g.ellipse(0, -12, 9, 12, 0, 0, Math.PI * 2); g.stroke();
  }
  g.strokeStyle = r.strings; g.lineWidth = 0.7;
  for (let i = -2; i <= 2; i++) {
    g.beginPath(); g.moveTo(i * 3, -22); g.lineTo(i * 3, -2); g.stroke();
    g.beginPath(); g.moveTo(-8, -12 + i * 3.4); g.lineTo(8, -12 + i * 3.4); g.stroke();
  }
  g.restore();
}

function drawAthlete(e) {
  const p = persp(e.y), sx = px(e.x, e.y), sy = py(e.y);
  const sc = KID_SCALE(e.key) * p * 1.35;
  g.save();
  g.translate(sx, sy);
  g.fillStyle = "rgba(0,0,0,.25)";
  g.beginPath(); g.ellipse(0, 2, 20 * p, 6 * p, 0, 0, Math.PI * 2); g.fill();
  g.save(); g.scale(sc, sc);
  drawKid(g, 0, 0, CHARS[e.key], Math.floor((S.timer + e.who * 7) / 14) % 2, e.face, false,
    Math.hypot(e.tx - e.x, e.ty - e.y) > 4);
  g.restore();
  drawRacket(e, p * 0.85);
  g.restore();
}

function drawCourt() {
  // REALLY realistic: an evening stadium under floodlights
  const sky = g.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, "#101c36"); sky.addColorStop(0.3, "#23406a"); sky.addColorStop(0.42, "#1e5c38"); sky.addColorStop(1, "#2e7d46");
  g.fillStyle = sky; g.fillRect(0, 0, W, H);
  // stars
  for (let i = 0; i < 20; i++) {
    const tw = (Math.sin(S.timer * 0.05 + i * 1.7) + 1) / 2;
    g.fillStyle = "rgba(255,255,240," + (0.2 + tw * 0.5).toFixed(2) + ")";
    g.fillRect((i * 173) % W, (i * 67) % (courtTop() * 0.5), 2, 2);
  }
  // floodlight towers with glowing lamp banks
  for (const fx2 of [W * 0.12, W * 0.88]) {
    g.strokeStyle = "#2a3346"; g.lineWidth = 5;
    g.beginPath(); g.moveTo(fx2, courtTop() - 8); g.lineTo(fx2, courtTop() - 70); g.stroke();
    const glow = g.createRadialGradient(fx2, courtTop() - 76, 4, fx2, courtTop() - 76, 60);
    glow.addColorStop(0, "rgba(255,250,220,.75)"); glow.addColorStop(1, "rgba(255,250,220,0)");
    g.fillStyle = glow; g.beginPath(); g.arc(fx2, courtTop() - 76, 60, 0, Math.PI * 2); g.fill();
    g.fillStyle = "#e8eef6";
    for (let i = 0; i < 6; i++) g.fillRect(fx2 - 17 + (i % 3) * 12, courtTop() - 84 + Math.floor(i / 3) * 9, 9, 7);
  }
  // tiered stands packed with a dot crowd that does the wave
  const standT = courtTop() * 0.42, standB = courtTop() - 6;
  const rows = 3;
  for (let r2 = 0; r2 < rows; r2++) {
    const ry = standT + (standB - standT) * r2 / rows;
    g.fillStyle = r2 % 2 ? "#26374f" : "#2d4159";
    g.fillRect(0, ry, W, (standB - standT) / rows + 1);
    for (let i = 0; i < W / 14; i++) {
      const wave = Math.sin(S.timer * 0.09 - i * 0.4 + r2) > 0.85 ? -3 : 0;
      g.fillStyle = ["#e8b87a", "#c98f8f", "#8fa8c9", "#c9b98f", "#a88fc9"][(i + r2 * 3) % 5];
      g.beginPath(); g.arc(7 + i * 14, ry + 7 + wave, 3.4, 0, Math.PI * 2); g.fill();
    }
  }
  // the heroes who aren't playing get front-row seats
  const bench = KEYS.filter(k => !ents.some(e2 => e2.key === k));
  bench.forEach((k, i) => {
    const bx = W * (0.12 + 0.76 * i / Math.max(1, bench.length - 1));
    const hop = Math.abs(Math.sin(S.timer * 0.08 + i * 1.7)) * 4;
    g.save(); g.translate(bx, courtTop() - 8 - hop);
    g.scale(0.30, 0.30);
    drawKid(g, 0, 0, CHARS[k], Math.floor(S.timer / 18) % 2, i % 2 ? -1 : 1, false, false);
    g.restore();
  });
  // Peach the pug — the very best ball dog — by the umpire chair
  g.save(); g.translate(W * 0.05, courtTop() + 10); g.scale(0.5, 0.5);
  drawPug(g, 0, 0); g.restore();

  const yTop = -CY, yBot = CY;
  const quad = (x0, x1, y0, y1, col) => {
    g.fillStyle = col;
    g.beginPath();
    g.moveTo(px(x0, y0), py(y0)); g.lineTo(px(x1, y0), py(y0));
    g.lineTo(px(x1, y1), py(y1)); g.lineTo(px(x0, y1), py(y1));
    g.closePath(); g.fill();
  };
  quad(-CX - 70, CX + 70, yTop - 44, yBot + 44, "#2f6e9e");        // hard-court apron
  quad(-CX - 70, CX + 70, yTop - 44, yTop - 36, "rgba(255,255,255,.12)");
  quad(-CX, CX, yTop, yBot, "#3f8f5c");                            // grass
  // mow stripes + worn patches where everyone runs
  for (let i = 0; i < 6; i++)
    quad(-CX, CX, yTop + i * (CY * 2 / 6), yTop + (i + 0.5) * (CY * 2 / 6), "rgba(255,255,255,.05)");
  for (const wy of [yTop + 60, yBot - 60]) {
    const wear = g.createRadialGradient(px(0, wy), py(wy), 6, px(0, wy), py(wy), 120 * persp(wy));
    wear.addColorStop(0, "rgba(190,170,120,.20)"); wear.addColorStop(1, "rgba(190,170,120,0)");
    g.fillStyle = wear;
    g.beginPath(); g.ellipse(px(0, wy), py(wy), 150 * persp(wy), 34 * persp(wy), 0, 0, Math.PI * 2); g.fill();
  }
  // floodlight sheen across the court
  const sheen = g.createLinearGradient(0, courtTop(), 0, courtTop() + courtH());
  sheen.addColorStop(0, "rgba(255,250,220,.10)"); sheen.addColorStop(0.5, "rgba(255,250,220,0)");
  quad(-CX - 70, CX + 70, yTop - 44, yBot + 44, sheen);
  // lines
  const line = (x0, x1, y0, y1) => {
    g.strokeStyle = "rgba(255,255,255,.92)"; g.lineWidth = Math.max(2, 3 * persp((y0 + y1) / 2));
    g.beginPath(); g.moveTo(px(x0, y0), py(y0)); g.lineTo(px(x1, y1), py(y1)); g.stroke();
  };
  line(-CX, CX, yTop, yTop); line(-CX, CX, yBot, yBot);
  line(-CX, -CX, yTop, yBot); line(CX, CX, yTop, yBot);
  line(-CX, CX, yTop / 2, yTop / 2); line(-CX, CX, yBot / 2, yBot / 2);
  line(0, 0, yTop / 2, yBot / 2);
  // net with its evening shadow falling toward the near court
  const nl = px(-CX - 14, 0), nr = px(CX + 14, 0), ny = py(0);
  g.fillStyle = "rgba(10,16,24,.18)";
  g.beginPath(); g.moveTo(nl, ny); g.lineTo(nr, ny);
  g.lineTo(nr - 14, ny + 16); g.lineTo(nl + 14, ny + 16); g.closePath(); g.fill();
  g.fillStyle = "rgba(20,26,34,.35)";
  g.fillRect(nl, ny - 26, nr - nl, 26);
  g.strokeStyle = "rgba(255,255,255,.55)"; g.lineWidth = 1;
  for (let i = 0; i < 9; i++) { g.beginPath(); g.moveTo(nl, ny - 26 + i * 3.2); g.lineTo(nr, ny - 26 + i * 3.2); g.stroke(); }
  for (let x = nl; x < nr; x += 9) { g.beginPath(); g.moveTo(x, ny - 26); g.lineTo(x, ny); g.stroke(); }
  g.fillStyle = "#f2ede2"; g.fillRect(nl, ny - 29, nr - nl, 4);
  g.fillStyle = "#3a3f4a"; g.fillRect(nl - 3, ny - 29, 4, 31); g.fillRect(nr - 1, ny - 29, 4, 31);
}

function drawBall() {
  if (!ball) return;
  // motion trail while the ball is flying fast
  if (ball.live && ball.trail) {
    ball.trail.forEach((tp, i) => {
      const a = (i + 1) / ball.trail.length * 0.35;
      const tpp = persp(tp.y);
      g.fillStyle = "rgba(232,255,112," + a.toFixed(2) + ")";
      g.beginPath(); g.arc(px(tp.x, tp.y), py(tp.y) - tp.z * tpp * 1.15, 5 * tpp * (i + 1) / ball.trail.length, 0, Math.PI * 2); g.fill();
    });
  }
  const p = persp(ball.y), bx = px(ball.x, ball.y), by = py(ball.y);
  g.fillStyle = "rgba(0,0,0,.3)";
  g.beginPath(); g.ellipse(bx, by, 6 * p, 2.6 * p, 0, 0, Math.PI * 2); g.fill();
  const r = 6.4 * p, byz = by - ball.z * p * 1.15;
  const grad = g.createRadialGradient(bx - r * 0.4, byz - r * 0.4, r * 0.2, bx, byz, r);
  grad.addColorStop(0, "#f8ff9e"); grad.addColorStop(1, "#c8d834");
  g.fillStyle = grad;
  g.beginPath(); g.arc(bx, byz, r, 0, Math.PI * 2); g.fill();
  g.strokeStyle = "rgba(255,255,255,.85)"; g.lineWidth = 1;
  g.beginPath(); g.arc(bx, byz, r * 0.82, 0.6, 2.2); g.stroke();
  g.beginPath(); g.arc(bx, byz, r * 0.82, Math.PI + 0.6, Math.PI + 2.2); g.stroke();
}

function drawFx() {
  for (const p of fx) {
    const a = 1 - p.t / 30, sx = px(p.x, p.y), sy = py(p.y) - (p.z || 0) * persp(p.y);
    g.globalAlpha = Math.max(0, a);
    if (p.type === "pow") drawStarShape(g, sx, sy, 10 * a + 3, 4, p.t * 0.2, "#fff3a0");
    else if (p.type === "spark") drawStarShape(g, sx, sy - p.t, 4, 1.8, p.t * 0.3, "#ffd1ec");
    else if (p.type === "dust") {
      g.fillStyle = "rgba(255,255,255,.5)";
      g.beginPath(); g.ellipse(sx, sy, 4 + p.t * 0.8, 2 + p.t * 0.3, 0, 0, Math.PI * 2); g.fill();
    }
    g.globalAlpha = 1;
  }
}

function drawScore() {
  g.textAlign = "center"; g.textBaseline = "middle";
  const s = Math.min(W / 10, 40);
  g.font = "900 " + s + "px 'Avenir Next',Arial";
  outlineText(S.scoreUs + " – " + S.scoreThem, W / 2, Math.max(30, H * 0.045), "#fff", s);
  g.font = "700 " + Math.min(W / 34, 13) + "px 'Avenir Next',Arial";
  outlineText("first to " + WIN_PTS + "  •  round " + (S.round + 1) + "/" + ROUNDS, W / 2, Math.max(30, H * 0.045) + s * 0.72, "#cfe8ff");
  if (S.bannerT > 0) {
    g.font = "800 " + Math.min(W / 16, 24) + "px 'Avenir Next',Arial";
    g.globalAlpha = Math.min(1, S.bannerT / 20);
    outlineText(S.pointBanner, W / 2, H * 0.32, "#ffd166");
    g.globalAlpha = 1;
  }
}

/* ---------- selection screens ---------- */
function drawCardGrid(list, drawOne, label) {
  S.cards = [];
  g.textAlign = "center"; g.textBaseline = "middle";
  g.font = "900 " + Math.min(W / 12, 34) + "px 'Avenir Next',Arial";
  outlineText(label, W / 2, H * 0.14, "#ffd166");
  const n = list.length, perRow = n <= 4 ? n : Math.ceil(n / 2), rows = Math.ceil(n / perRow);
  const gap = Math.min(10, W * 0.016);
  const cw = Math.min((W * 0.94 - (perRow - 1) * gap) / perRow, 120, H * 0.26);
  const ch = Math.min(cw * 1.22, H * 0.26);
  const cy0 = H * 0.5 - (rows * ch + (rows - 1) * 10) / 2 + 20;
  list.forEach((item, i) => {
    const row = Math.floor(i / perRow), idx = i - row * perRow;
    const inRow = row === rows - 1 ? n - perRow * (rows - 1) : perRow;
    const rowW = inRow * cw + (inRow - 1) * gap, startX = W / 2 - rowW / 2;
    const sx = startX + idx * (cw + gap), sy = cy0 + row * (ch + 10);
    const bounce = Math.sin(S.timer * 0.08 + i * 2) * 3;
    g.fillStyle = "rgba(255,255,255,.93)";
    rr(sx, sy, cw, ch, 12); g.fill();
    drawOne(item, sx, sy, cw, ch, bounce, i);
  });
}
function drawMode() {
  const sky = g.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, "#1c3a5e"); sky.addColorStop(1, "#2e7d46");
  g.fillStyle = sky; g.fillRect(0, 0, W, H);
  g.textAlign = "center"; g.textBaseline = "middle";
  g.font = "900 " + Math.min(W / 16, 30) + "px 'Avenir Next',Arial";
  outlineText("How do you want to play?", W / 2, H * 0.16, "#ffd166");
  S.cards = [];
  const gap = Math.min(14, W * 0.02);
  const cw = Math.min((W * 0.94 - gap * 2) / 3, 210), ch = Math.min(H * 0.28, 220);
  const modes = [
    { solo: false, single: false, emoji: "👭", title: "Two Players", sub: "sisters together!", col: "#ff8ec4" },
    { solo: true,  single: false, emoji: "🤖", title: "One Player",  sub: "+ a magic buddy",   col: "#7fb6ff" },
    { solo: false, single: true,  emoji: "🎾", title: "One on One",  sub: "just you vs a rival", col: "#7ec850" },
  ];
  const startX = W / 2 - (cw * 3 + gap * 2) / 2;
  modes.forEach((m2, i) => {
    const sx = startX + i * (cw + gap), sy = H * 0.22;
    const bounce = Math.sin(S.timer * 0.08 + i * 2) * 3;
    g.fillStyle = "rgba(255,255,255,.93)";
    rr(sx, sy + bounce, cw, ch, 16); g.fill();
    g.lineWidth = 4; g.strokeStyle = m2.col;
    rr(sx, sy + bounce, cw, ch, 16); g.stroke();
    g.font = (ch * 0.26) + "px 'Avenir Next',Arial";
    g.fillText(m2.emoji, sx + cw / 2, sy + bounce + ch * 0.3);
    let fs = Math.min(cw / 7, 22);
    g.font = "900 " + fs + "px 'Avenir Next',Arial";
    while (g.measureText(m2.title).width > cw - 10 && fs > 8) { fs -= 0.5; g.font = "900 " + fs + "px 'Avenir Next',Arial"; }
    g.fillStyle = "#2a3a55";
    g.fillText(m2.title, sx + cw / 2, sy + bounce + ch * 0.6);
    let fs2 = Math.min(cw / 10, 14);
    g.font = "700 " + fs2 + "px 'Avenir Next',Arial";
    while (g.measureText(m2.sub).width > cw - 8 && fs2 > 7) { fs2 -= 0.5; g.font = "700 " + fs2 + "px 'Avenir Next',Arial"; }
    g.fillStyle = "#6a7a96";
    g.fillText(m2.sub, sx + cw / 2, sy + bounce + ch * 0.78);
    S.cards.push({ solo: m2.solo, single: m2.single, sx, sy, sw: cw, sh: ch });
  });
  g.font = "700 " + Math.min(W / 30, 14) + "px 'Avenir Next',Arial";
  outlineText("buddies play by themselves • one on one is all you!", W / 2, H * 0.22 + ch + 26, "#cfe8ff");
  // speed toggles — how fast the ball flies and everyone runs (kept high
  // on the screen so phone toolbars never cover them)
  S.speedChips = [];
  const rows2 = [ { which: "ballSpd", label: "🎾 ball" }, { which: "runSpd", label: "🏃 running" } ];
  const chipW = Math.min(W * 0.15, 62), chipH = Math.min(H * 0.055, 44), chipGap = 8;
  const rowsTop = H * 0.22 + ch + 48;
  rows2.forEach((row, ri) => {
    const ry = rowsTop + ri * (chipH + 22);
    g.font = "800 " + Math.min(W / 26, 15) + "px 'Avenir Next',Arial";
    g.textAlign = "right"; g.textBaseline = "middle";
    outlineText(row.label, W / 2 - chipW * 1.5 - chipGap - 12, ry + chipH / 2, "#fff");
    g.textAlign = "center";
    SPEED_OPTS.forEach((opt, oi) => {
      const x = W / 2 - (chipW * 1.5 + chipGap) + oi * (chipW + chipGap);
      const sel = Math.abs(S[row.which] - opt.mul) < 0.01;
      g.fillStyle = sel ? "#ffd166" : "rgba(255,255,255,.25)";
      rr(x, ry, chipW, chipH, chipH / 2); g.fill();
      if (sel) { g.lineWidth = 2.5; g.strokeStyle = "#fff"; rr(x, ry, chipW, chipH, chipH / 2); g.stroke(); }
      g.font = (chipH * 0.55) + "px 'Avenir Next',Arial";
      g.fillText(opt.label, x + chipW / 2, ry + chipH / 2 + 1);
      S.speedChips.push({ which: row.which, mul: opt.mul, x, y: ry, w: chipW, h: chipH });
    });
  });
  g.textAlign = "center";
}

function drawPick() {
  const sky = g.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, "#1c3a5e"); sky.addColorStop(1, "#2e7d46");
  g.fillStyle = sky; g.fillRect(0, 0, W, H);
  const who = S.stage < 2 ? ((S.solo || S.single) ? "You" : "Player 1") : (S.solo ? "Your buddy 🤖" : "Player 2");
  if (S.stage === 0 || S.stage === 2) {
    const taken = S.stage === 2 ? [S.players[0].key] : [];
    const list = KEYS.filter(k => !taken.includes(k));
    drawCardGrid(list, (k, sx, sy, cw, ch, bounce) => {
      g.lineWidth = 3.5; g.strokeStyle = NAME_COL[k]; rr(sx, sy, cw, ch, 12); g.stroke();
      g.save(); g.translate(sx + cw / 2, sy + ch * 0.62 + bounce);
      const ks = (cw / 48) * (k === "nora" ? 1.5 : 1);
      g.scale(ks, ks);
      drawKid(g, 0, 0, CHARS[k], Math.floor(S.timer / 20) % 2, 1, false, true);
      g.restore();
      let nm = CHARS[k].name, fs = cw / 7;
      g.font = "900 " + fs + "px 'Avenir Next',Arial";
      while (g.measureText(nm).width > cw - 12 && fs > 6) { fs -= 0.5; g.font = "900 " + fs + "px 'Avenir Next',Arial"; }
      const tw2 = g.measureText(nm).width, pillH = fs + 6, pillW = Math.min(cw - 4, tw2 + 12);
      g.fillStyle = NAME_COL[k];
      rr(sx + cw / 2 - pillW / 2, sy + ch - cw / 9 - pillH / 2, pillW, pillH, pillH / 2); g.fill();
      g.fillStyle = "#fff"; g.textAlign = "center"; g.textBaseline = "middle";
      g.fillText(nm, sx + cw / 2, sy + ch - cw / 9 + 0.5);
      S.cards.push({ key: k, sx, sy, sw: cw, sh: ch });
    }, who + " — pick your hero!");
  } else {
    drawCardGrid(RACKETS, (r, sx, sy, cw, ch, bounce, i) => {
      g.lineWidth = 3.5; g.strokeStyle = r.head === "rainbow" ? "#9b6cff" : r.head; rr(sx, sy, cw, ch, 12); g.stroke();
      g.save(); g.translate(sx + cw / 2, sy + ch * 0.52 + bounce); g.scale(cw / 44, cw / 44);
      drawRacket({ racket: i, face: 1, swingT: 0 }, 1.5);
      g.restore();
      g.font = "900 " + cw / 7.2 + "px 'Avenir Next',Arial";
      g.fillStyle = "#2a3a55"; g.textAlign = "center"; g.textBaseline = "middle";
      g.fillText(r.name, sx + cw / 2, sy + ch - cw / 8);
      S.cards.push({ idx: i, sx, sy, sw: cw, sh: ch });
    }, who + " — pick your stick!");
  }
  g.font = "700 " + Math.min(W / 26, 15) + "px 'Avenir Next',Arial";
  outlineText(S.stage < 2 ? (S.single ? "one on one — all yours!" : S.solo ? "then pick your teammate!" : "then it's your sister's turn!")
                          : "almost ready to play!", W / 2, H * 0.9, "#cfe8ff");
}

function drawBracket() {
  const sky = g.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, "#1c3a5e"); sky.addColorStop(1, "#2e7d46");
  g.fillStyle = sky; g.fillRect(0, 0, W, H);
  g.textAlign = "center"; g.textBaseline = "middle";
  g.font = "900 " + Math.min(W / 10, 40) + "px 'Avenir Next',Arial";
  outlineText(S.round + 1 >= ROUNDS ? "🏆 THE FINAL!" : "Round " + (S.round + 1), W / 2, H * 0.16, "#ffd166");
  const duo = (keysArr, y, label) => {
    keysArr.forEach((k, i) => {
      g.save(); g.translate(W / 2 + (keysArr.length === 1 ? 0 : (i ? 60 : -60)), y);
      const ks = (Math.min(W, H) / 130) * (k === "nora" ? 1.5 : 1) * 0.8;
      g.scale(ks, ks);
      drawKid(g, 0, 0, CHARS[k], Math.floor(S.timer / 18) % 2, i ? -1 : 1, false, false);
      g.restore();
    });
    g.font = "800 " + Math.min(W / 18, 20) + "px 'Avenir Next',Arial";
    outlineText(label, W / 2, y + 26, "#fff");
  };
  const usKeys = S.single ? [S.players[0].key] : [S.players[0].key, S.players[1].key];
  duo(usKeys, H * 0.38, S.single ? CHARS[S.players[0].key].name : "Jules & Nora's team");
  g.font = "900 " + Math.min(W / 12, 30) + "px 'Avenir Next',Arial";
  outlineText("VS", W / 2, H * 0.52, "#ff8ab0");
  duo(S.rivals, H * 0.68, S.rivals.map(k => CHARS[k].name).join(" & "));
  if (Math.floor(S.timer / 30) % 2 === 0) {
    g.font = "700 " + Math.min(W / 22, 17) + "px 'Avenir Next',Arial";
    outlineText("tap to play!", W / 2, H * 0.88, "#aee0ff");
  }
}

function drawMatchEnd() {
  g.fillStyle = "rgba(20,30,55,.7)"; g.fillRect(0, 0, W, H);
  g.textAlign = "center"; g.textBaseline = "middle";
  const won = S.scoreUs >= WIN_PTS;
  g.font = "900 " + Math.min(W / 9, 46) + "px 'Avenir Next',Arial";
  outlineText(won ? "YOU WIN! " + S.scoreUs + "–" + S.scoreThem : "So close! " + S.scoreUs + "–" + S.scoreThem,
    W / 2, H * 0.3, won ? "#ffd166" : "#fff");
  g.font = "700 " + Math.min(W / 20, 20) + "px 'Avenir Next',Arial";
  outlineText(won ? (S.round + 1 >= ROUNDS ? "tap for the trophy!" : "tap for the next round!") : "tap to try again!",
    W / 2, H * 0.45, "#aee0ff");
  if (won) {
    (S.single ? [S.players[0].key] : [S.players[0].key, S.players[1].key]).forEach((k, i) => {
      const hop = Math.abs(Math.sin(S.timer * 0.12 + i)) * 16;
      g.save(); g.translate(W / 2 + (S.single ? 0 : i ? 70 : -70), H * 0.68 - hop);
      const ks = (Math.min(W, H) / 120) * (k === "nora" ? 1.5 : 1);
      g.scale(ks, ks);
      drawKid(g, 0, 0, CHARS[k], Math.floor(S.timer / 14) % 2, i ? -1 : 1, true, false);
      g.restore();
    });
  }
}

function drawChampion() {
  const sky = g.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, "#2a1c5e"); sky.addColorStop(1, "#1c3a5e");
  g.fillStyle = sky; g.fillRect(0, 0, W, H);
  for (let i = 0; i < 30; i++) {
    const cy2 = ((S.timer * (1.5 + (i % 5) * 0.5) + i * 97) % (H + 40)) - 20;
    g.fillStyle = ["#ff6b9d", "#4dabf7", "#ffd43b", "#69db7c", "#b197fc"][i % 5];
    g.save(); g.translate((i * 137) % W, cy2); g.rotate(S.timer * 0.05 + i);
    g.fillRect(-4, -2, 8, 4); g.restore();
  }
  g.textAlign = "center"; g.textBaseline = "middle";
  g.font = "900 " + Math.min(W / 9, 56) + "px 'Avenir Next',Arial";
  outlineText(S.single ? "🏆 CHAMPION!" : "🏆 CHAMPIONS!", W / 2, H * 0.13, "#ffd166");
  g.font = "700 " + Math.min(W / 18, 22) + "px 'Avenir Next',Arial";
  outlineText(S.single ? CHARS[S.players[0].key].name + " wins the whole tournament!" : "Jules & Nora win the whole tournament!", W / 2, H * 0.24, "#fff");
  g.font = "900 " + Math.min(W / 8, 52) + "px 'Avenir Next',Arial";
  outlineText("🏆", W / 2, H * 0.38, "#ffd166");
  (S.single ? [S.players[0].key] : [S.players[0].key, S.players[1].key]).forEach((k, i) => {
    const hop = Math.abs(Math.sin(S.timer * 0.11 + i)) * 14;
    g.save(); g.translate(W / 2 + (S.single ? 0 : (i ? 1 : -1) * Math.min(W * 0.18, 110)), H * 0.74 - hop);
    const ks = (Math.min(W, H) / 150) * (k === "nora" ? 1.5 : 1);
    g.scale(ks, ks);
    drawKid(g, 0, 0, CHARS[k], Math.floor(S.timer / 14) % 2, i ? -1 : 1, true, false);
    g.restore();
  });
  g.save(); g.translate(W / 2, H * 0.75); g.scale(1.1, 1.1); drawPug(g, 0, 0); g.restore();
  if (S.timer > 90 && Math.floor(S.timer / 30) % 2 === 0) {
    g.font = "700 " + Math.min(W / 22, 17) + "px 'Avenir Next',Arial";
    outlineText("tap to play again", W / 2, H * 0.88, "#aee0ff");
  }
}

function drawTitle() {
  const sky = g.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, "#1c3a5e"); sky.addColorStop(0.5, "#2e567e"); sky.addColorStop(1, "#2e7d46");
  g.fillStyle = sky; g.fillRect(0, 0, W, H);
  g.textAlign = "center"; g.textBaseline = "middle";
  const big = Math.min(W / 7, 58);
  g.font = "900 " + big + "px 'Avenir Next',Arial";
  outlineText("MAGIC TENNIS", W / 2, H * 0.18, "#c8ff6a", big);
  g.font = "700 " + Math.min(W / 24, 17) + "px 'Avenir Next',Arial";
  outlineText("✨ doubles, together — by Jules & Nora ✨", W / 2, H * 0.18 + big * 0.8, "#fff");
  // two heroes rallying on the title
  const t = S.timer, bx2 = W / 2 + Math.sin(t * 0.04) * W * 0.22;
  const bz = Math.abs(Math.sin(t * 0.08)) * 60;
  g.save(); g.translate(W * 0.24, H * 0.62); g.scale(1.6, 1.6);
  drawKid(g, 0, 0, CHARS.nora, Math.floor(t / 16) % 2, 1, false, true); g.restore();
  g.save(); g.translate(W * 0.76, H * 0.62); g.scale(0.95, 0.95);
  drawKid(g, 0, 0, CHARS.chunmi, Math.floor(t / 16) % 2, -1, false, true); g.restore();
  g.fillStyle = "#e8ff70";
  g.beginPath(); g.arc(bx2, H * 0.52 - bz, 7, 0, Math.PI * 2); g.fill();
  g.font = "800 " + Math.min(W / 15, 26) + "px 'Avenir Next',Arial";
  outlineText("two players, one team 🎾", W / 2, H * 0.78, "#ffd166");
  if (Math.floor(t / 30) % 2 === 0) {
    g.font = "700 " + Math.min(W / 20, 18) + "px 'Avenir Next',Arial";
    outlineText("tap to start", W / 2, H * 0.86, "#aee0ff");
  }
}

function drawPlay() {
  drawCourt();
  // far team first, then ball & near team (painter's order)
  const sorted = [...ents].sort((a, b) => a.y - b.y);
  for (const e of sorted) { if (e.y < 0) drawAthlete(e); }
  drawBall();
  drawFx();
  for (const e of sorted) { if (e.y >= 0) drawAthlete(e); }
  drawScore();
  // touch guide, fading after the start
  if (S.timer < 240) {
    g.globalAlpha = Math.max(0, Math.min(1, (240 - S.timer) / 60));
    if (!S.solo && !S.single) {
      g.strokeStyle = "rgba(255,255,255,.5)"; g.lineWidth = 2; g.setLineDash([8, 8]);
      g.beginPath(); g.moveTo(W / 2, py(10)); g.lineTo(W / 2, H); g.stroke(); g.setLineDash([]);
    }
    g.font = "700 " + Math.min(W / 24, 15) + "px 'Avenir Next',Arial";
    g.textAlign = "center";
    if (S.single) {
      outlineText("👆 drag anywhere — the whole court is yours!", W / 2, H * 0.88, "#fff");
    } else if (S.solo) {
      outlineText("👆 drag anywhere — " + CHARS[S.players[0].key].name, W / 2, H * 0.88, "#fff");
      outlineText("🤖 " + CHARS[S.players[1].key].name + " plays by herself!", W / 2, H * 0.93, "#aee0ff");
    } else {
      outlineText("👆 " + CHARS[S.players[0].key].name, W * 0.25, H * 0.9, "#fff");
      outlineText(CHARS[S.players[1].key].name + " 👆", W * 0.75, H * 0.9, "#fff");
    }
    g.globalAlpha = 1;
  }
}

/* ------------------------------ games menu ------------------------------ */
const gBtn = document.getElementById("gamesBtn"), gMenu = document.getElementById("gamesMenu");
gBtn.addEventListener("click", e => { e.stopPropagation(); gMenu.hidden = !gMenu.hidden; });
document.addEventListener("pointerdown", e => {
  if (!gMenu.hidden && !gMenu.contains(e.target) && e.target !== gBtn) gMenu.hidden = true;
});

/* ------------------------------ main loop ------------------------------ */
function frameLoop() {
  update();
  g.setTransform(DPR, 0, 0, DPR, 0, 0);
  g.clearRect(0, 0, W, H);
  if (S.state === "title") drawTitle();
  else if (S.state === "mode") drawMode();
  else if (S.state === "pick") drawPick();
  else if (S.state === "bracket") drawBracket();
  else if (S.state === "champion") drawChampion();
  else { drawPlay(); if (S.state === "matchend") drawMatchEnd(); }
  requestAnimationFrame(frameLoop);
}
frameLoop();
</script>
</body>
</html>
