try { S.best = parseFloat(localStorage.getItem("fpBestDay")) || 0; } catch (e) {}
const hero = { x: 480, tx: 480, facing: 1, walkT: 0 };
let queue = [];    // [{ id, tx }] — stations we'll walk to, in tap order

/* ------------------------------ tickets ------------------------------ */
function dayItems(d) { return d === 1 ? ["ry"] : d === 2 ? ["ry","fancy"] : ["ry","fancy","dfancy"]; }
function dayOrders(d) { return Math.min(12, [0,5,7,9,10,11][d] || 12); }
function patienceF(d) { return Math.max(32, 50 - d * 2) * 60; }

function genTicket() {
  const pool = dayItems(S.day);
  const itemKey = pool[Math.floor(Math.random() * pool.length)];
  const item = ITEMS[itemKey];
  const need = Object.assign({}, item.recipe);
  const mods = [];
  const maxMods = S.day === 1 ? 0 : S.day === 2 ? 1 : 2;
  let nMods = 0;
  for (let m = 0; m < maxMods; m++) if (Math.random() < (S.day >= 4 ? 0.6 : 0.45)) nMods++;
  const used = new Set();
  for (let m = 0; m < nMods; m++) {
    const kind = ["no","extra","add"][Math.floor(Math.random() * 3)];
    if (kind === "no") {
      const opts = Object.keys(need).filter(k => need[k] >= 1 && k !== "patty" && !used.has(k));
      if (!opts.length) continue;
      const ing = opts[Math.floor(Math.random() * opts.length)];
      used.add(ing); need[ing] = 0; mods.push({ t:"no", ing });
    } else if (kind === "extra") {
      const opts = Object.keys(need).filter(k => need[k] >= 1 && !used.has(k));
      if (!opts.length) continue;
      const ing = opts[Math.floor(Math.random() * opts.length)];
      used.add(ing); need[ing]++; mods.push({ t:"extra", ing });
    } else {
      const opts = BIN_ORDER.filter(k => !(need[k] >= 1) && !used.has(k));
      if (!opts.length) continue;
      const ing = opts[Math.floor(Math.random() * opts.length)];
      used.add(ing); need[ing] = 1; mods.push({ t:"add", ing });
    }
  }
  for (const k of Object.keys(need)) if (!need[k]) delete need[k];
  S.orderSeq++;
  return { id: S.orderSeq, itemKey, need, mods, age: 0, patience: patienceF(S.day), ax: 1 };
}
function modLabel(m) {
  const n = INGS[m.ing].name;
  return m.t === "no" ? "NO " + n : m.t === "extra" ? "EXTRA " + n : "ADD " + n;
}

/* ------------------------------ day flow ------------------------------ */
function startDay(d) {
  S.day = d;
  S.ordersLeft = dayOrders(d);
  S.tickets = []; S.spawnT = 0; S.endT = 0;
  S.toast = { active:false, t:0 }; S.buns = 0;
  S.grills = [ { state:"empty", t:0, lid:0 }, { state:"empty", t:0, lid:0 } ];
  S.warm = 0; S.stack = null;
  S.served = 0; S.perfect = 0; S.dayCoins = 0;
  S.banner = null; S.hint = null; S.fx = []; S.serveFx = 0; S.recipeTip = null;
  hero.x = hero.tx = 480; queue = [];
  S.state = "dayIntro";
}
function beginShift() {
  S.state = "play";
  spawnTicket();
  SFX.select();
}
function spawnTicket() {
  if (!S.ordersLeft || S.tickets.length >= 3) return;
  S.ordersLeft--;
  S.tickets.push(genTicket());
  S.spawnT = Math.max(150, 300 + Math.random() * 240 - S.day * 25);
  SFX.chime();
}
function endDay() {
  S.stars = S.perfect >= S.served ? 3 : S.perfect >= Math.ceil(S.served * 0.6) ? 2 : 1;
  if (S.dayCoins > S.best) {
    S.best = S.dayCoins;
    try { localStorage.setItem("fpBestDay", String(S.best)); } catch (e) {}
  }
  S.state = "dayEnd";
  if (S.stars === 3) SFX.fanfare(); else SFX.star();
}

/* ------------------------------ actions ------------------------------ */
function hint(text) { S.hint = { text, t: 120 }; }

function capped() { return !!S.stack && S.stack[S.stack.length - 1] === "crown"; }

function doAction(id) {
  if (id === "toaster") {
    if (S.toast.active) hint("Toasting…");
    else if (S.buns >= BUN_MAX) { hint("Bun slot is full!"); SFX.buzz(); }
    else { S.toast = { active:true, t:0 }; SFX.pop(); }
  } else if (id === "bunslot") {
    if (S.stack) { hint("Burger already started — build it!"); SFX.buzz(); }
    else if (S.buns > 0) { S.buns--; S.stack = ["heel"]; S.stackPop = 12; SFX.add(0); }
    else { hint("Toast a bun first!"); SFX.buzz(); }
  } else if (id === "grill0" || id === "grill1") {
    const gr = S.grills[id === "grill0" ? 0 : 1];
    if (gr.state === "empty") { gr.state = "cook"; gr.t = 0; SFX.sizzle(); }
    else if (gr.state === "cook") hint("Patties are still cooking…");
    else {
      if (S.warm >= WARM_MAX) { hint("Warmer is full!"); SFX.buzz(); }
      else { S.warm = Math.min(WARM_MAX, S.warm + 2); gr.state = "empty"; gr.t = 0; SFX.add(3); }
    }
  } else if (id === "warmer") {
    if (!S.stack) { hint("Start with a toasted bun!"); SFX.buzz(); }
    else if (capped()) { hint("Top bun is on — serve it!"); SFX.buzz(); }
    else if (S.warm > 0) { S.warm--; S.stack.push("patty"); S.stackPop = 12; SFX.add(5); }
    else { hint("Grill some patties!"); SFX.buzz(); }
  } else if (id.startsWith("bin:")) {
    const ing = id.slice(4);
    if (!S.stack) { hint("Start with a toasted bun!"); SFX.buzz(); }
    else if (capped()) { hint("Top bun is on — serve it!"); SFX.buzz(); }
    else { S.stack.push(ing); S.stackPop = 12; SFX.add(BIN_ORDER.indexOf(ing)); }
  } else if (id === "topbun") {
    if (!S.stack) { hint("Start a burger first!"); SFX.buzz(); }
    else if (capped()) { hint("Top bun is already on!"); SFX.buzz(); }
    else { S.stack.push("crown"); S.stackPop = 14; SFX.pop(); }
  } else if (id === "tray") {
    if (!S.stack) hint("Tap the toaster's bun slot to start a burger!");
    else if (S.stack.length > 1) { const top = S.stack.pop(); if (top === "patty") S.warm = Math.min(WARM_MAX, S.warm + 1); S.stackPop = 8; SFX.undo(); }
    else { S.stack = null; SFX.undo(); hint("Burger cancelled"); }
  } else if (id === "pass") {
    serveBurger();
  }
}

function stackCounts() {
  const c = {};
  for (const l of S.stack) if (INGS[l]) c[l] = (c[l] || 0) + 1;
  return c;
}
function serveBurger() {
  if (!S.stack) { hint("Nothing to serve — build a burger!"); SFX.buzz(); return; }
  if (!capped()) { hint("Put the TOP BUN on first!"); SFX.buzz(); return; }
  if (!S.tickets.length) { hint("No orders on the screen yet!"); SFX.buzz(); return; }
  const have = stackCounts();
  let best = null, bestErr = 1e9;
  for (const t of S.tickets) {
    let err = 0;
    const ks = new Set([...Object.keys(have), ...Object.keys(t.need)]);
    for (const k of ks) err += Math.abs((have[k] || 0) - (t.need[k] || 0));
    if (err < bestErr) { bestErr = err; best = t; }
  }
  const item = ITEMS[best.itemKey];
  const fast = best.age < best.patience * 0.5, late = best.age > best.patience;
  let pay, emoji, text;
  if (bestErr === 0) {
    pay = item.price + (fast ? 1.0 : 0);
    emoji = "😍"; text = "PERFECT " + item.name + "!";
    S.perfect++; SFX.fanfare();
    for (let i = 0; i < 24; i++)
      S.fx.push({ x: 826, y: 200, vx: (Math.random() - .5) * 7, vy: -2 - Math.random() * 5,
                  c: ["#ffd166","#ff8ec4","#7ec850","#7fb6ff","#e8262c"][i % 5], t: 0 });
  } else if (bestErr <= 2) {
    pay = Math.max(1, item.price - 1.5 * bestErr);
    emoji = "🙂"; text = "Close! " + bestErr + " thing" + (bestErr > 1 ? "s" : "") + " off";
    SFX.coin();
  } else {
    pay = 1;
    emoji = "😖"; text = "Oops — check the ticket!";
    SFX.oops();
  }
  if (late) { pay = Math.max(0.5, pay / 2); text += " (so slow!)"; }
  else if (fast && bestErr === 0) text += " +$1 tip!";
  S.coins += pay; S.dayCoins += pay; S.served++;
  S.tickets = S.tickets.filter(t => t !== best);
  if (S.recipeTip === best) S.recipeTip = null;
  S.banner = { emoji, text, pay, t: 130 };
  S.stack = null; S.serveFx = 50;
  SFX.bell();
}

/* ------------------------------ update ------------------------------ */
function update() {
  S.timer++; game.timer = S.timer;
  layout();
  if (S.state !== "play") return;

  // walk the hero through the tapped stations, in order
  if (queue.length) hero.tx = queue[0].tx;
  const d = hero.tx - hero.x;
  if (Math.abs(d) > 5) {
    hero.x += Math.sign(d) * Math.min(Math.abs(d), 8);
    hero.facing = Math.sign(d) || hero.facing;
    hero.walkT++;
  } else if (queue.length) doAction(queue.shift().id);

  // toaster
  if (S.toast.active && ++S.toast.t >= TOAST_T) {
    S.toast.active = false;
    S.buns = Math.min(BUN_MAX, S.buns + 1);
    SFX.pop();
  }
  // grills
  for (const gr of S.grills) {
    gr.lid += ((gr.state === "cook" ? 1 : 0) - gr.lid) * 0.15;
    if (gr.state === "cook" && ++gr.t >= GRILL_T) { gr.state = "done"; SFX.ding(); }
  }
  // tickets
  for (const t of S.tickets) { t.age++; t.ax *= 0.88; }
  if (S.spawnT > 0) S.spawnT--;
  if (S.spawnT <= 0 && S.tickets.length < 3 && S.ordersLeft > 0) spawnTicket();

  if (S.banner && --S.banner.t <= 0) S.banner = null;
  if (S.hint && --S.hint.t <= 0) S.hint = null;
  if (S.stackPop > 0) S.stackPop--;
  if (S.serveFx > 0) S.serveFx--;
  S.fx = S.fx.filter(p => (p.t += 1, p.x += p.vx, p.y += p.vy, p.vy += 0.25, p.t < 60));

  // day over?
  if (!S.ordersLeft && !S.tickets.length) {
    if (++S.endT > 70) endDay();
  } else S.endT = 0;
}

/* ------------------------------ burger drawing ------------------------------ */
function drawLayerAt(cx, yb, w, ing) {
  const c = INGS[ing] ? INGS[ing].col : "#f2b25c";
  if (ing === "heel") {
    const gr = g.createLinearGradient(0, yb - 16, 0, yb);
    gr.addColorStop(0, "#f2b25c"); gr.addColorStop(1, "#d08a3a");
    g.fillStyle = gr; rr(cx - w/2, yb - 16, w, 16, 7); g.fill();
    return 16;
  }
  if (ing === "crown") {
    const gr = g.createLinearGradient(0, yb - 30, 0, yb);
    gr.addColorStop(0, "#f6c273"); gr.addColorStop(1, "#d08a3a");
    g.fillStyle = gr;
    g.beginPath();
    g.moveTo(cx - w/2, yb);
    g.quadraticCurveTo(cx - w/2, yb - 26, cx, yb - 27);
    g.quadraticCurveTo(cx + w/2, yb - 26, cx + w/2, yb);
    g.closePath(); g.fill();
    g.strokeStyle = "rgba(255,255,255,.45)"; g.lineWidth = 3; g.lineCap = "round";
    g.beginPath(); g.arc(cx - w * 0.12, yb - 14, w * 0.26, Math.PI * 1.15, Math.PI * 1.6); g.stroke();
    return 27;
  }

    g.fillStyle = c; rr(cx - w/2 - 3, yb - 15, w + 6, 15, 7); g.fill();
    g.fillStyle = "#59331f";
    for (let i = -2; i <= 2; i++) g.fillRect(cx + i * w * 0.16 - 2, yb - 11, 4, 7);
    return 15;
  }
  if (ing === "cheese") {
    g.fillStyle = c;
    rr(cx - w/2 - 6, yb - 8, w + 12, 6, 3); g.fill();
    rr(cx - w/2 - 6, yb - 5, 9, 5, 2); g.fill();      // droopy corners
    rr(cx + w/2 - 3, yb - 5, 9, 5, 2); g.fill();
    return 8;
  }
  if (ing === "lettuce") {
    // ruffled edge — tucked in tight so it never hides the layer below
    g.fillStyle = c;
    const n = 6, rw = (w + 8) / n;
    for (let i = 0; i < n; i++) {
      g.beginPath();
      g.arc(cx - (w + 8)/2 + rw * (i + 0.5), yb - 5.5, rw * 0.46, 0, Math.PI * 2);
      g.fill();
    }
    g.fillStyle = "#95d96a"; rr(cx - w/2, yb - 10, w, 5, 2); g.fill();
    return 10;
  }
  if (ing === "tomato") {
    // a thick juicy slice that sticks out past the bun, like the cheese does
    g.fillStyle = "#e0271c"; rr(cx - w/2 - 9, yb - 12, w + 18, 12, 6); g.fill();
    g.fillStyle = "#ff6a55"; rr(cx - w/2 - 2, yb - 9, w + 4, 4.5, 2.25); g.fill();
    g.fillStyle = "#ffb3a5";                                 // seedy middle
    for (let i = -1; i <= 1; i++) { g.beginPath(); g.ellipse(cx + i * w * 0.3, yb - 6.5, 3.5, 1.6, 0, 0, Math.PI * 2); g.fill(); }
    return 12;
  }
  if (ing === "onion") {
    g.strokeStyle = "#f4ecf8"; g.lineWidth = 3;
    for (let i = -1; i <= 1; i++) {
      g.beginPath(); g.ellipse(cx + i * w * 0.28, yb - 3, w * 0.14, 4.5, 0, 0, Math.PI * 2); g.stroke();
    }
    return 6;
  }
  if (ing === "pickles") {
    g.fillStyle = c;
    for (let i = -1; i <= 1; i++) {
      g.beginPath(); g.ellipse(cx + i * w * 0.27, yb - 4, w * 0.13, 5.5, 0, 0, Math.PI * 2); g.fill();
    }
    g.fillStyle = "#3a7a2c";
    for (let i = -1; i <= 1; i++) {
      g.beginPath(); g.arc(cx + i * w * 0.27 - 3, yb - 5, 1.4, 0, Math.PI * 2); g.fill();
      g.beginPath(); g.arc(cx + i * w * 0.27 + 4, yb - 3, 1.4, 0, Math.PI * 2); g.fill();
    }
    return 8;
  }
  // sauce / ketchup drizzle with drips
  g.fillStyle = c; rr(cx - w/2 + 2, yb - 6, w - 4, 5, 2.5); g.fill();
  for (let i = -1; i <= 1; i++) { rr(cx + i * w * 0.26 - 2.5, yb - 3, 5, 6, 2.5); g.fill(); }
  return 6;
}
function drawStack(list, cx, baseY, w) {
  let y = baseY;
  for (let i = 0; i < list.length; i++) {
    const pop = i === list.length - 1 && S.stackPop > 0 ? 1 + S.stackPop * 0.008 : 1;
    g.save();
    if (pop !== 1) { g.translate(cx, y); g.scale(pop, pop); g.translate(-cx, -y); }
    y -= drawLayerAt(cx, y, w, list[i]);
    g.restore();
    if (pop !== 1) y -= 0;
  }
  return baseY - y;
}
function buildList(need) {
  // the house build: sauce on the heel, patty & cheese, produce on top
  const list = ["heel"];
  for (const k of ["sauce","ketchup","mustard"])
    for (let i = 0; i < (need[k] || 0); i++) list.push(k);
  const p = need.patty || 0, ch = need.cheese || 0, n = Math.max(p, ch);
  for (let i = 0; i < n; i++) { if (i < p) list.push("patty"); if (i < ch) list.push("cheese"); }
  for (const k of ["pickles","onion","tomato","lettuce"])
    for (let i = 0; i < (need[k] || 0); i++) list.push(k);
  list.push("crown");
  return list;
}
function stackH(list) { let h = 0; for (const l of list) h += l === "heel" ? 16 : l === "crown" ? 27 : INGS[l].h; return h; }

function drawKitchen() {

  for (let x = 160; x < SW; x += 160) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x, 280); g.stroke(); }
  // vent hood over the grills
  const hg = g.createLinearGradient(0, 0, 0, 78);
  hg.addColorStop(0, "#6b7480"); hg.addColorStop(1, "#4a525c");
  g.fillStyle = hg; g.beginPath();
  g.moveTo(246, 0); g.lineTo(714, 0); g.lineTo(694, 78); g.lineTo(266, 78);
  g.closePath(); g.fill();

  for (let x = 290; x < 670; x += 48) rr(x, 30, 34, 34, 4), g.fill();

  g.fillStyle = cg; g.fillRect(40, 272, SW - 80, 50);
  g.fillStyle = "#e8ecef"; g.fillRect(40, 272, SW - 80, 6);

  for (let y = 322; y <= SH; y += 44) { g.beginPath(); g.moveTo(0, y); g.lineTo(SW, y); g.stroke(); }

    const ty = 322 + ro * 44;

  queue.forEach((q, qi) => {

    g.fillText("to start a burger", 812, 488);

function ticketW() { return Math.min(Math.max(120, (W - 120) / 3), 262); }
function drawKDS() {
  g.fillStyle = "#171c23"; g.fillRect(0, 0, W, KDS_H);
  g.fillStyle = "#0d1117"; g.fillRect(0, KDS_H - 4, W, 4);
  const tw = ticketW(), th = KDS_H - 14;
  S.tickets.forEach((t, i) => {
    const x = 8 + i * (tw + 8) + t.ax * W * 0.4, y = 7;
    const item = ITEMS[t.itemKey];
    const late = t.age > t.patience;
    g.save(); rr(x, y, tw, th, 8); g.clip();
    g.fillStyle = late && (S.timer >> 4) % 2 ? "#3a1518" : "#242c36";
    rr(x, y, tw, th, 8); g.fill();
    g.fillStyle = item.col; rr(x, y, tw, 20, 8); g.fill();
    g.fillStyle = "#242c36"; g.fillRect(x, y + 14, tw, 6);
    g.font = "900 " + Math.min(13, tw / 11) + "px 'Avenir Next',Arial";
    g.textAlign = "left"; g.textBaseline = "middle";
    g.fillStyle = "#fff";
    g.fillText("#" + t.id + "  " + item.name, x + 8, y + 10);
    // burger picture of exactly what they want — big enough to read at a glance
    const list = buildList(t.need);
    const sh2 = stackH(list);
    const sc2 = Math.min(0.68, (th - 28) / sh2, (tw * 0.42) / 146);
    g.save(); g.translate(x + tw * 0.21, y + th - 14); g.scale(sc2, sc2);
    const sp = S.stackPop; S.stackPop = 0;
    drawStack(list, 0, 0, 130);
    S.stackPop = sp;
    g.restore();
    // modifier callouts
    g.font = "800 " + Math.min(11, tw / 13) + "px 'Avenir Next',Arial";
    t.mods.forEach((m, mi) => {
      g.fillStyle = m.t === "no" ? "#ff7a7a" : m.t === "extra" ? "#7ec850" : "#7fb6ff";
      g.fillText((m.t === "no" ? "✖ " : "＋ ") + modLabel(m), x + tw * 0.44, y + 30 + mi * 14);
    });
    if (!t.mods.length) { g.fillStyle = "#8a94a6"; g.fillText("tap me for the build!", x + tw * 0.44, y + 30); }
    // patience bar
    const pr = Math.max(0, 1 - t.age / t.patience);
    g.fillStyle = "#10151b"; rr(x + 6, y + th - 10, tw - 12, 6, 3); g.fill();
    g.fillStyle = pr > 0.5 ? "#4ade80" : pr > 0.2 ? "#ffb02a" : "#ff5e5e";
    if (pr > 0) { rr(x + 6, y + th - 10, (tw - 12) * pr, 6, 3); g.fill(); }
    if (late) { g.font = "14px Arial"; g.fillText("😠", x + tw - 22, y + th - 14); }
    g.restore();
  });
  if (!S.tickets.length && S.state === "play") {
    g.fillStyle = "#5b6470"; g.font = "800 14px 'Avenir Next',Arial";
    g.textAlign = "left"; g.textBaseline = "middle";
    g.fillText(S.ordersLeft ? "waiting for orders…" : "last orders served!", 14, KDS_H / 2);

function drawRecipeTip() {
  const t = S.recipeTip;

  const item = ITEMS[t.itemKey];
  g.fillStyle = "rgba(10,14,18,.55)"; g.fillRect(0, 0, W, H);
  // the steps, bottom bun first, sized before the card so the card fits them
  const list = buildList(t.need);
  const steps = [["TOASTED BUN", 1]];
  for (let i = 1; i < list.length - 1; i++) {
    const nm = INGS[list[i]].name, last = steps[steps.length - 1];

  }
  steps.push(["TOP BUN", 1]);
  const w = Math.min(W * 0.88, 500);
  const h = Math.min(H * 0.8, Math.max(240, 96 + steps.length * 26));

  const sp = S.stackPop; S.stackPop = 0; drawStack(list, 0, 0, 130); S.stackPop = sp;
  g.restore();
  const lx = x + w * 0.47, lstep = Math.min(26, (h - 96) / steps.length);

function drawPick() {

    g.font = "900 " + fs + "px 'Avenir Next',Arial";
    while (g.measureText(nm).width > cw - 12 && fs > 6) { fs -= 0.5; g.font = "900 " + fs + "px 'Avenir Next',Arial"; }
    const tw2 = g.measureText(nm).width, pillH = fs + 6, pillW = Math.min(cw - 4, tw2 + 12);
    g.fillStyle = NAME_COL[k];
    rr(sx + cw / 2 - pillW / 2, sy + chh - cw / 9 - pillH / 2, pillW, pillH, pillH / 2); g.fill();
    g.fillStyle = "#fff";
    g.fillText(nm, sx + cw / 2, sy + chh - cw / 9 + 0.5);
    S.cards.push({ key: k, sx, sy, sw: cw, sh: chh });
  });
  g.font = "800 " + Math.min(W / 28, 15) + "px 'Avenir Next',Arial";
  g.fillStyle = "#8a4b2f"; g.fillText("everyone can work the make line!", W / 2, H * 0.93);
}

function drawDayIntro() {
  creamBG();
  g.textAlign = "center"; g.textBaseline = "middle";
  g.font = "900 " + Math.min(W / 9, 58) + "px 'Avenir Next',Arial";
  g.fillStyle = "#e8262c"; g.fillText("DAY " + S.day, W / 2, H * 0.16);
  g.font = "800 " + Math.min(W / 24, 19) + "px 'Avenir Next',Arial";
  g.fillStyle = "#2a3a55";
  g.fillText(dayOrders(S.day) + " orders today", W / 2, H * 0.25);
  const items = dayItems(S.day);
  const newKey = S.day === 2 ? "fancy" : S.day === 3 ? "dfancy" : null;
  const cw = Math.min(W * 0.24, 150), chh = Math.min(H * 0.3, 190), gap = 14;
  const x0 = W / 2 - (items.length * cw + (items.length - 1) * gap) / 2, y0 = H * 0.31;
  items.forEach((key, i) => {
    const item = ITEMS[key], x = x0 + i * (cw + gap);
    g.fillStyle = "#fff"; rr(x, y0, cw, chh, 12); g.fill();
    g.strokeStyle = key === newKey ? "#2fae5e" : "#e8262c"; g.lineWidth = 4; rr(x, y0, cw, chh, 12); g.stroke();
    const list = buildList(item.recipe);
    const sc2 = Math.min((cw - 34) / 150, (chh - 70) / stackH(list));
    g.save(); g.translate(x + cw / 2, y0 + chh - 44); g.scale(sc2, sc2);
    drawStack(list, 0, 0, 130); g.restore();
    let fs = Math.min(cw / 8.5, 15);
    g.font = "900 " + fs + "px 'Avenir Next',Arial";
    while (g.measureText(item.name).width > cw - 12 && fs > 7) { fs -= 0.5; g.font = "900 " + fs + "px 'Avenir Next',Arial"; }
    g.fillStyle = "#e8262c"; g.fillText(item.name, x + cw / 2, y0 + chh - 22);
    if (key === newKey) {
      g.fillStyle = "#2fae5e"; rr(x + cw / 2 - 26, y0 - 10, 52, 20, 10); g.fill();
      g.fillStyle = "#fff"; g.font = "900 12px 'Avenir Next',Arial"; g.fillText("NEW!", x + cw / 2, y0);
    }
  });
  g.font = "800 " + Math.min(W / 30, 15) + "px 'Avenir Next',Arial";
  g.fillStyle = "#8a4b2f";
  if (S.day === 1) {
    const steps = ["1. Tap a GRILL to cook patties — they go to the WARMER", "2. Tap the TOASTER — buns drop into its BUN SLOT",
                   "3. Tap the BUN SLOT to start a burger at the BUILD STATION", "4. Add toppings, tap the TOP BUN to cap it, then SERVE!",
                   "TIP: tap any ticket on the screen to see how to build it"];
    steps.forEach((s2, i) => g.fillText(s2, W / 2, H * 0.31 + Math.min(H * 0.3, 190) + 30 + i * 22));
  } else {
    g.fillText(S.day === 2 ? "watch the tickets — modifiers start today!" : "up to TWO modifiers per ticket — read carefully!", W / 2, H * 0.31 + Math.min(H * 0.3, 190) + 34);
  }
  g.font = "900 " + Math.min(W / 20, 24) + "px 'Avenir Next',Arial";
  if ((S.timer >> 5) % 2) { g.fillStyle = "#e8262c"; g.fillText("TAP TO START YOUR SHIFT", W / 2, H * 0.9); }
}

function drawDayEnd() {
  creamBG();
  S.cards = [];
  g.textAlign = "center"; g.textBaseline = "middle";
  g.font = "900 " + Math.min(W / 11, 46) + "px 'Avenir Next',Arial";
  g.fillStyle = "#e8262c"; g.fillText("DAY " + S.day + " DONE!", W / 2, H * 0.14);
  for (let i = 0; i < 3; i++) {
    const on = i < S.stars, b = on ? Math.sin(S.timer * 0.1 + i) * 3 : 0;
    drawStarShape(g, W / 2 + (i - 1) * Math.min(W * 0.14, 74), H * 0.27 + b,
      Math.min(W * 0.055, 28), Math.min(W * 0.024, 12.5), 0,
      on ? "#ffd166" : "#e2d5c2", on ? "#d99e2b" : "#cbbda6");
  }
  g.font = "900 " + Math.min(W / 16, 30) + "px 'Avenir Next',Arial";
  g.fillStyle = "#2fae5e"; g.fillText("+" + fmt$(S.dayCoins), W / 2, H * 0.4);
  g.font = "800 " + Math.min(W / 26, 17) + "px 'Avenir Next',Arial";
  g.fillStyle = "#2a3a55";
  g.fillText(S.perfect + " of " + S.served + " burgers were PERFECT", W / 2, H * 0.47);
  g.fillStyle = "#8a4b2f";
  g.fillText("register total: " + fmt$(S.coins), W / 2, H * 0.53);
  // the shift-manager pug approves
  g.save(); g.translate(W / 2 - Math.min(W * 0.2, 130), H * 0.66); g.scale(3, 3);
  drawPug(g, 0, 0); g.restore();
  g.font = "800 " + Math.min(W / 30, 14) + "px 'Avenir Next',Arial";
  g.fillStyle = "#8a4b2f";
  g.fillText(S.stars === 3 ? "the manager pug is SO proud!" : S.stars === 2 ? "the manager pug wags happily" : "the manager pug believes in you", W / 2 + 30, H * 0.66 - 10);
  const bw = Math.min(W * 0.5, 260), bh = Math.min(H * 0.1, 54), bx = W / 2 - bw / 2, by = H * 0.78;
  g.fillStyle = "#e8262c"; rr(bx, by, bw, bh, bh / 2); g.fill();
  g.fillStyle = "#fff"; g.font = "900 " + Math.min(bh * 0.44, 22) + "px 'Avenir Next',Arial";
  g.fillText("NEXT DAY ▶", W / 2, by + bh / 2 + 1);
  S.cards.push({ next: true, sx: bx, sy: by, sw: bw, sh: bh });
}

/* ------------------------------ main loop ------------------------------ */
function render() {
  g.setTransform(DPR, 0, 0, DPR, 0, 0);
  g.clearRect(0, 0, W, H);
  if (S.state === "title") drawTitle();
  else if (S.state === "pick") drawPick();
  else if (S.state === "dayIntro") drawDayIntro();
  else if (S.state === "dayEnd") drawDayEnd();
  else {
    g.fillStyle = "#f5ede3"; g.fillRect(0, 0, W, H);
    drawKitchen(); drawKDS(); drawHUD(); drawRecipeTip();
  }
}
function frame() { update(); render(); requestAnimationFrame(frame); }
requestAnimationFrame(frame);

/* ------------------------------ input ------------------------------ */
function playTap(sx, sy) {
  const p = toScene(sx, sy);
  let hit = null;
  for (const b of BINS)
    if (p.x >= b.x - 4 && p.x <= b.x + b.w + 4 && p.y >= b.y - 6 && p.y <= SH) hit = "bin:" + b.ing;
  if (!hit) for (const st of STATIONS)
    if (p.x >= st.x && p.x <= st.x + st.w && p.y >= st.y && p.y <= st.y + st.h) hit = st.id;
  if (!hit) return;
  if (queue.length >= 5 || (queue.length && queue[queue.length - 1].id === hit)) return;
  SFX.tap();
  // building happens at the build station — every build tap walks the hero there
  let tx;
  if (hit.startsWith("bin:") || BUILD_IDS.includes(hit)) tx = BUILD_X;
  else { const rect = STATIONS.find(s2 => s2.id === hit); tx = rect.x + rect.w / 2; }
  queue.push({ id: hit, tx: Math.max(70, Math.min(890, tx)) });
}
cv.addEventListener("pointerdown", e => {
  e.preventDefault(); audio();
  const x = e.clientX, y = e.clientY;
  if (S.state === "title") { S.state = "pick"; SFX.select(); }
  else if (S.state === "pick") {
    for (const c of S.cards)
      if (x >= c.sx && x <= c.sx + c.sw && y >= c.sy && y <= c.sy + c.sh) {
        S.heroKey = c.key; S.coins = 0; SFX.select(); startDay(1); return;
      }
  } else if (S.state === "dayIntro") beginShift();
  else if (S.state === "dayEnd") {
    for (const c of S.cards)
      if (x >= c.sx && x <= c.sx + c.sw && y >= c.sy && y <= c.sy + c.sh) {
        SFX.select(); startDay(S.day + 1); return;
      }
  } else {
    if (S.recipeTip) { S.recipeTip = null; SFX.tap(); return; }
    if (y < KDS_H) {                      // tap a ticket → show its build card
      const tw = ticketW(), i = Math.floor((x - 8) / (tw + 8));
      if (i >= 0 && i < S.tickets.length && x - 8 - i * (tw + 8) <= tw) { S.recipeTip = S.tickets[i]; SFX.chime(); }
      return;
    }
    playTap(x, y);
  }
}, { passive: false });
window.addEventListener("keydown", e => {
  audio();
  if (e.code === "Space" || e.code === "Enter") {
    if (S.state === "title") { S.state = "pick"; SFX.select(); }
    else if (S.state === "dayIntro") beginShift();
    else if (S.state === "dayEnd") { SFX.select(); startDay(S.day + 1); }
  }
});
// block 1-finger scroll; keep 2-finger pinch so the page can be un-zoomed
document.addEventListener("touchmove", e => { if (e.touches.length < 2) e.preventDefault(); }, { passive: false });
let lastTouchEnd = 0;
document.addEventListener("touchend", e => {
  const tnow = Date.now();
  if (tnow - lastTouchEnd < 350) e.preventDefault();
  lastTouchEnd = tnow;
}, { passive: false });
</script>
<script>
(function () {
  var b = document.getElementById("gamesBtn"), m = document.getElementById("gamesMenu");
  b.addEventListener("click", function (e) { e.stopPropagation(); m.hidden = !m.hidden; });
  document.addEventListener("pointerdown", function (e) {
    if (!m.hidden && !m.contains(e.target) && e.target !== b) m.hidden = true;
  });
})();
</script>
