<script>
"use strict";
/* CHRISTMAS CHEER — Jules & Nora's snowy 3D village. Part one: pick your character, a cozy
   cabin, a village dressed for Christmas, the ice rink, and the skating contest with judges
   where winning lets you pick a fabulous house (ice castle, fancy mansion or dream house).
   Part two: pets you can ride and dress up, six stores, a phone (map, call, text, order),
   Nora's magic winter garden, and a ski hill with a slalom contest.
   Part three: friends who walk around and have houses you can visit, swapping presents,
   sledding with races, and five jobs.
   Part four: really getting into bed, day and night, stores you walk into, snow angels,
   snowmen and snowball fights, decorating, baking cookies, Santa's sleigh, caroling, a shy
   reindeer, more characters and a make-your-own character. */
if (!window.THREE) document.body.insertAdjacentHTML("beforeend", '<div class="ov"><div class="card"><h2>Oops!</h2><p>The 3D part could not load. Check the internet and try again.</p></div></div>');

function pop(text) { const p = $("pop"); p.textContent = text; p.classList.remove("show"); void p.offsetWidth; p.classList.add("show"); }

/* ------------------------------ save ------------------------------ */
const SAVE_KEY = Arcade.key("cheerSave");
const S = { hero: null, money: 100, wins: 0, houses: [], best: 0, music: true };
function save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) {} }
(function load() { try { const d = JSON.parse(localStorage.getItem(SAVE_KEY) || "null"); if (d) Object.assign(S, d); } catch (e) {} })();
S.custom = S.custom || {}; S.pets = S.pets || {}; S.garden = S.garden || [null, null, null, null, null, null, null, null, null]; S.treats = S.treats || 0; S.skiWins = S.skiWins || 0; S.sledWins = S.sledWins || 0; S.gifts = S.gifts || []; S.gifts.forEach(g => { if (g.from === "Nay" + "un") g.from = "Naeun"; });

  tap: () => tone(700, .05, "square", .04, 200), coin: () => { tone(1318, .08, "sine", .09); tone(1760, .14, "sine", .09, 0, .08); },

const NOTE = { C: 262, D: 294, E: 330, F: 349, G: 392 };
const SONG = "E1 E1 E2 E1 E1 E2 E1 G1 C1 D1 E4 F1 F1 F1 F1 F1 E1 E1 E1 E1 D1 D1 E1 D2 G2 E1 E1 E2 E1 E1 E2 E1 G1 C1 D1 E4 F1 F1 F1 F1 F1 E1 E1 E1 G1 G1 F1 D1 C4".split(" ");

/* ------------------------------ three.js setup ------------------------------ */
const cv = $("game");

})();

/* ------------------------------ building helpers ------------------------------ */
const mats = {};

const cyl = (rt, rb, h, col, x, y, z, p, seg) => M(new THREE.CylinderGeometry(rt, rb, h, seg || 14), col, x, y, z, p);
const sph = (r, col, x, y, z, p) => M(new THREE.SphereGeometry(r, 16, 12), col, x, y, z, p);
const cone = (r, h, col, x, y, z, p, seg) => M(new THREE.ConeGeometry(r, h, seg || 10), col, x, y, z, p);

/* instancing: thousands of little things (lights, trees, fence posts) drawn in a few calls */
const batches = new Map();
const _m4 = new THREE.Matrix4(), _q = new THREE.Quaternion(), _e = new THREE.Euler(), _s = new THREE.Vector3(), _p = new THREE.Vector3();

window.__step = n => { for (let i = 0; i < n; i++) { tNow += .033; if (pl && mode !== "title" && mode !== "pick") { updatePlayer(.033); if (C && mode === "contest") { if (C.count > 0) C.count -= .033; else { C.t -= .033; if (C.t <= 0 && !T) finishContest(); } } if (C && mode === "judging" && tNow > C.until) showResults(); if (JOB) updateJob(typeof dt === "number" ? dt : .033); } updateWorld(.033); updateCamera(.033); if (pl) updateUI(); } renderer.render(scene, camera); };
buildWorld();
camera.position.set(0, 7, 22);
showTitle();
requestAnimationFrame(frame);
</script>
