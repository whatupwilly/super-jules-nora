const btnL = document.getElementById("btnL"), btnR = document.getElementById("btnR"),
      btnB = document.getElementById("btnB");
function bindBtn(el, name, tap) {
  const set = on => { touch[name] = on; el.classList.toggle("pressed", on); };
  el.addEventListener("pointerdown", e => { e.preventDefault(); audio(); if (tap) tap(); else set(true); }, { passive: false });
  el.addEventListener("pointerup",   e => { e.preventDefault(); set(false); }, { passive: false });
  el.addEventListener("pointercancel", () => set(false));
  el.addEventListener("pointerleave",  () => { if (!tap) set(false); });
}
bindBtn(btnL, "left"); bindBtn(btnR, "right");
bindBtn(btnB, "boost", () => { input.boostPressed = true; });

cv.addEventListener("pointerdown", e => {
  e.preventDefault(); audio();
  if (game.state === "title") {
    for (const c of game.titleCards)
      if (e.clientX >= c.sx && e.clientX <= c.sx + c.sw && e.clientY >= c.sy && e.clientY <= c.sy + c.sh)
        return pickHero(c.key);
  } else if (game.state === "done" && game.timer > 60) {
    game.state = "title"; game.timer = 0;
  }
}, { passive: false });

function pickHero(k) {
  heroKey = k; SFX.select();
  buildRace();
  game.state = "count"; game.timer = 0;
}

/* ------------------------------ update ------------------------------ */
game.state = "title"; game.titleCards = []; game.coins = 0;

function updateRace(frozen) {
  syncKeys();
  const player = karts[karts.length - 1] && karts.find(k => k.isPlayer);

  for (const k of karts) {
    if (k.finished) { k.v *= 0.97; k.x += Math.cos(k.angle) * k.v; k.y += Math.sin(k.angle) * k.v; continue; }
    const info = trackInfo(k.x, k.y);
    const onGrass = info.d > ROAD_W - 10;

    let steer = 0, top = MAXV;
    if (k.isPlayer) {
      steer = (input.right ? 1 : 0) - (input.left ? 1 : 0);
      if (input.boostPressed) {
        input.boostPressed = false;
        if (k.item === "boost" && !frozen) { k.item = null; k.boostT = 75; SFX.boost(); }
      }
    } else {
      // AI: aim at a point a little way down its personal racing line
      const target = trackPoint(k.prog + 2.2, k.aiOff * (0.6 + 0.4 * Math.sin(k.prog * 0.35)));
      let want = Math.atan2(target.y - k.y, target.x - k.x);
      let diff = want - k.angle;
      while (diff > Math.PI) diff -= Math.PI * 2;
      while (diff < -Math.PI) diff += Math.PI * 2;
      steer = Math.max(-1, Math.min(1, diff * 3));
      top = MAXV * k.aiSpd;
      if (player && !player.finished) {                // gentle rubber band keeps races exciting
        const gap = player.total - k.total;
        if (gap > 3) top *= 1.14;
        else if (gap < -5) top *= 0.86;
      }
    }
    if (onGrass) top *= 0.5;
    if (k.boostT > 0) { k.boostT--; top = MAXV * 1.75; }

    if (!frozen) {
      k.v += (top - k.v) * (k.v > top ? 0.06 : ACCEL + (k.boostT > 0 ? 0.06 : 0));
      k.angle += steer * TURN * (0.35 + 0.65 * Math.min(1, k.v / MAXV));
      k.x += Math.cos(k.angle) * k.v;
      k.y += Math.sin(k.angle) * k.v;
      k.frame += k.v;
    }
    if (k.bumpT > 0) k.bumpT--;

    // progress + laps
    const newProg = info.prog;
    let dp = newProg - k.prog;
    if (dp < -N_WP / 2) { k.lap++; dp += N_WP; }       // crossed the finish line
    else if (dp > N_WP / 2) { k.lap--; dp -= N_WP; }   // went backward over it
    k.prog = newProg;
    k.total = k.lap * N_WP + k.prog;

    if (!k.finished && k.lap >= LAPS) {
      k.finished = true; k.place = finishOrder.length + 1;
      finishOrder.push(k);
      if (k.isPlayer) { game.state = "done"; game.timer = 0; if (k.place <= 3) SFX.win(); else SFX.beep(); }
    }

    if (frozen) continue;

    // boost pads
    for (const wpi of PAD_WPS) {
      const p = wp(wpi);
      if (Math.hypot(k.x - p.x, k.y - p.y) < 46 && k.boostT < 30) {
        k.boostT = 45; if (k.isPlayer) SFX.pad();
      }
    }
    // coins (player only counts, but AI can sparkle through)
    if (k.isPlayer) {
      for (const c of coins) {
        if (!c.taken && Math.hypot(k.x - c.x, k.y - c.y) < 30) {
          c.taken = 1; game.coins++; SFX.coin();
          for (let i = 0; i < 5; i++) fx.push({ x: c.x, y: c.y, vx: Math.cos(i * 1.26) * 1.6,
            vy: Math.sin(i * 1.26) * 1.6 - 1, t: 0, c: "#ffd166" });
        }
      }
      for (const b of boxes) {
        if (!b.gone && Math.hypot(k.x - b.x, k.y - b.y) < 34) {
          b.gone = 240; if (!k.item) { k.item = "boost"; SFX.box(); }
          for (let i = 0; i < 6; i++) fx.push({ x: b.x, y: b.y, vx: Math.cos(i) * 2,
            vy: Math.sin(i) * 2 - 1, t: 0, c: ["#ff8ec4", "#7fb6ff", "#ffd166"][i % 3] });
        }
      }
    }
    // boost trail sparkles
    if (k.boostT > 0 && (game.timer & 1) === 0)
      fx.push({ x: k.x - Math.cos(k.angle) * 18, y: k.y - Math.sin(k.angle) * 18,
        vx: -Math.cos(k.angle) * 1.5, vy: -Math.sin(k.angle) * 1.5, t: 0,
        c: ["#ffb347", "#fff3a0", "#ff8c42"][game.timer % 3] });
  }

  // soft kart-vs-kart bumps
  for (let i = 0; i < karts.length; i++) for (let j = i + 1; j < karts.length; j++) {
    const a = karts[i], b = karts[j];
    const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy);
    if (d > 0 && d < 30) {
      const push = (30 - d) / 2, ux = dx / d, uy = dy / d;
      a.x -= ux * push; a.y -= uy * push;
      b.x += ux * push; b.y += uy * push;
      if ((a.isPlayer || b.isPlayer) && a.bumpT === 0 && b.bumpT === 0) { SFX.bump(); a.bumpT = b.bumpT = 20; }
    }
  }

  for (const b of boxes) if (b.gone > 0) b.gone--;
  for (const p of fx) { p.t++; p.x += p.vx; p.y += p.vy; p.vy += 0.05; }
  fx = fx.filter(p => p.t < 40);

  btnB.style.display = (game.state === "race" && karts.find(k => k.isPlayer)?.item) ? "flex" : "none";
}

function update() {
  game.timer++;
  if (game.state === "count") {
    updateRace(true);
    if (game.timer === 1 || game.timer === 60 || game.timer === 120) SFX.beep();
    if (game.timer >= 180) { game.state = "race"; SFX.go(); }
  } else if (game.state === "race" || game.state === "done") {
    updateRace(false);
  }
}

/* ------------------------------ drawing ------------------------------ */
function rr(x, y, w, h, r) { rrPath(g, x, y, w, h, r); }

function ordinal(n) { return n + (n === 1 ? "st" : n === 2 ? "nd" : n === 3 ? "rd" : "th"); }

function rank() {
  const sorted = [...karts].sort((a, b) =>
    (a.finished && b.finished) ? a.place - b.place :
    a.finished ? -1 : b.finished ? 1 : b.total - a.total);
  return sorted;
}

function drawKart(k) {
  const t = game.timer;
  g.save();
  g.translate(k.x, k.y);
  // shadow
  g.fillStyle = "rgba(0,0,0,.22)";
  g.beginPath(); g.ellipse(0, 6, 20, 9, 0, 0, Math.PI * 2); g.fill();
  // kart body, rotated with travel direction
  g.save();
  g.rotate(k.angle);
  g.fillStyle = "#23262e";                                     // wheels
  rr(-14, -14, 9, 6, 2.5); g.fill(); rr(-14, 8, 9, 6, 2.5); g.fill();
  rr(7, -14, 9, 6, 2.5); g.fill(); rr(7, 8, 9, 6, 2.5); g.fill();
  const bg = g.createLinearGradient(0, -10, 0, 10);
  const col = KART_COL[k.key] || "#e074a8";
  bg.addColorStop(0, col); bg.addColorStop(1, "#00000030");
  g.fillStyle = col; rr(-16, -9, 34, 18, 8); g.fill();
  g.fillStyle = "rgba(255,255,255,.35)"; rr(-13, -7, 12, 5, 3); g.fill();  // shine
  g.fillStyle = "#2a2e38"; rr(12, -6, 7, 12, 3); g.fill();     // front bumper
  if (k.boostT > 0) {                                          // flame when boosting
    g.fillStyle = ["#ff8c42", "#ffd166", "#fff3a0"][t % 3];
    g.beginPath(); g.moveTo(-16, -4); g.lineTo(-26 - (t % 3) * 3, 0); g.lineTo(-16, 4); g.closePath(); g.fill();
  }
  g.restore();
  // the hero, sitting proudly upright (billboard style)
  const facing = Math.cos(k.angle) >= 0 ? 1 : -1;
  const ks = KID_SCALE(k.key);
  g.save();
  g.translate(0, -4 + Math.sin(k.frame * 0.06) * 1);
  g.scale(ks, ks);
  drawKid(g, 0, 0, CHARS[k.key], Math.floor(k.frame / 16) % 2, facing, false, false);
  g.restore();
  g.restore();
}

function drawTrack() {
  // grass
  const gg = g.createLinearGradient(0, TCY - 900, 0, TCY + 900);
  gg.addColorStop(0, "#7ec850"); gg.addColorStop(1, "#4d9e3c");
  g.fillStyle = gg; g.fillRect(TCX - 1700, TCY - 1200, 3400, 2400);
  // flowers sprinkled on the grass
  for (let i = 0; i < 40; i++) {
    const fx2 = TCX - 1500 + ((i * 733) % 3000), fy2 = TCY - 1050 + ((i * 517) % 2100);
    const d = trackInfo(fx2, fy2).d;
    if (d < ROAD_W + 30) continue;
    g.fillStyle = ["#ff8ec4", "#ffd166", "#b88cff", "#fff"][i % 4];
    g.beginPath(); g.arc(fx2, fy2, 5, 0, Math.PI * 2); g.fill();
    g.fillStyle = "#fff3a0"; g.beginPath(); g.arc(fx2, fy2, 2, 0, Math.PI * 2); g.fill();
  }
  // the road
  g.lineJoin = "round"; g.lineCap = "round";
  const path = () => { g.beginPath(); g.moveTo(WPS[0].x, WPS[0].y);
    for (let i = 1; i <= N_WP; i++) g.lineTo(wp(i).x, wp(i).y); g.closePath(); };
  path(); g.strokeStyle = "#f2ede2"; g.lineWidth = ROAD_W * 2 + 10; g.stroke();   // white edges
  path(); g.strokeStyle = "#4a4f5c"; g.lineWidth = ROAD_W * 2; g.stroke();        // asphalt
  path(); g.strokeStyle = "rgba(255,209,102,.9)"; g.lineWidth = 4;
  g.setLineDash([22, 20]); g.stroke(); g.setLineDash([]);                          // center dashes
  // boost pads
  for (const wpi of PAD_WPS) {
    const p = trackPoint(wpi, 0);
    g.save(); g.translate(p.x, p.y); g.rotate(Math.atan2(p.dirY, p.dirX));
    g.fillStyle = (game.timer & 15) < 8 ? "#ff9f43" : "#ffb86b";
    for (let c2 = 0; c2 < 2; c2++) {
      g.beginPath(); g.moveTo(-14 + c2 * 18, -16); g.lineTo(4 + c2 * 18, 0); g.lineTo(-14 + c2 * 18, 16);
      g.lineTo(-6 + c2 * 18, 0); g.closePath(); g.fill();
    }
    g.restore();
  }
  // start / finish: checkered strip + Peach the pug waving the flag
  const s = trackPoint(0, 0);
  g.save(); g.translate(s.x, s.y); g.rotate(Math.atan2(s.dirY, s.dirX));
  for (let i = 0; i < 10; i++) for (let j = 0; j < 2; j++) {
    g.fillStyle = (i + j) % 2 ? "#16181d" : "#fff";
    g.fillRect(-10 + j * 10, -ROAD_W + i * (ROAD_W / 5), 10, ROAD_W / 5);
  }
  g.restore();
  const pugSpot = trackPoint(0, -(ROAD_W + 42));
  g.save(); g.translate(pugSpot.x, pugSpot.y); g.scale(1.15, 1.15);
  drawPug(g, 0, 0);
  const wave = Math.sin(game.timer * 0.15) * 0.5;
  g.strokeStyle = "#8a5a32"; g.lineWidth = 2.5;
  g.beginPath(); g.moveTo(14, -8); g.lineTo(20, -34); g.stroke();
  g.save(); g.translate(20, -34); g.rotate(wave * 0.4);
  for (let i = 0; i < 3; i++) for (let j = 0; j < 2; j++) {
    g.fillStyle = (i + j) % 2 ? "#16181d" : "#fff";
    g.fillRect(i * 7, j * 6, 7, 6);
  }
  g.restore(); g.restore();
  // coins + item boxes
  for (const c of coins) {
    if (c.taken) continue;
    const sq = Math.abs(Math.sin(game.timer * 0.06 + c.x));
    g.fillStyle = "#ffd166";
    g.beginPath(); g.ellipse(c.x, c.y, 9 * (0.3 + 0.7 * sq), 9, 0, 0, Math.PI * 2); g.fill();
    g.strokeStyle = "#d8a020"; g.lineWidth = 2;
    g.beginPath(); g.ellipse(c.x, c.y, 9 * (0.3 + 0.7 * sq), 9, 0, 0, Math.PI * 2); g.stroke();
  }
  for (const b of boxes) {
    if (b.gone) continue;
    const bob = Math.sin(game.timer * 0.08 + b.x) * 3;
    g.save(); g.translate(b.x, b.y + bob); g.rotate(Math.sin(game.timer * 0.04) * 0.3);
    const grad = g.createLinearGradient(-13, -13, 13, 13);
    grad.addColorStop(0, "#b88cff"); grad.addColorStop(0.5, "#7fb6ff"); grad.addColorStop(1, "#ff8ec4");
    g.fillStyle = grad; rr(-13, -13, 26, 26, 6); g.fill();
    g.strokeStyle = "rgba(255,255,255,.8)"; g.lineWidth = 2; rr(-13, -13, 26, 26, 6); g.stroke();
    g.fillStyle = "#fff"; g.font = "900 17px 'Avenir Next',Arial";
    g.textAlign = "center"; g.textBaseline = "middle"; g.fillText("?", 0, 1);
    g.restore();
  }
}

function outlineText(txt, x, y, fill, size) {
  g.lineWidth = Math.max(3, (size || 20) / 7); g.lineJoin = "round";
  g.strokeStyle = "rgba(0,0,0,.35)";
  g.strokeText(txt, x, y); g.fillStyle = fill; g.fillText(txt, x, y);
}

function drawHUD(player) {
  g.textAlign = "left"; g.textBaseline = "top";
  g.font = "900 " + Math.min(W / 16, 26) + "px 'Avenir Next',Arial";
  outlineText("LAP " + Math.min(LAPS, player.lap + 1) + "/" + LAPS, 14, 12, "#fff");
  g.font = "800 " + Math.min(W / 22, 18) + "px 'Avenir Next',Arial";
  outlineText("● " + game.coins, 14, 16 + Math.min(W / 16, 26) * 1.15, "#ffd166");
  const pos = rank().indexOf(player) + 1;
  g.textAlign = "center";
  g.font = "900 " + Math.min(W / 9, 44) + "px 'Avenir Next',Arial";
  outlineText(ordinal(player.finished ? player.place : pos), W / 2, 10, pos === 1 ? "#ffd166" : "#fff");
  // minimap
  const mw = Math.min(W * 0.24, 150), mh = mw * 0.62;
  const mx = W - mw - 12, my = 12 + 40;
  g.fillStyle = "rgba(20,30,20,.4)"; rr(mx - 6, my - 6, mw + 12, mh + 12, 10); g.fill();
  const sx = mw / 2400, sy = mh / 1500;
  g.strokeStyle = "rgba(255,255,255,.75)"; g.lineWidth = 3; g.lineJoin = "round";
  g.beginPath();
  for (let i = 0; i <= N_WP; i++) {
    const p = wp(i), px = mx + (p.x - (TCX - 1200)) * sx, py = my + (p.y - (TCY - 750)) * sy;
    i ? g.lineTo(px, py) : g.moveTo(px, py);
  }
  g.closePath(); g.stroke();
  for (const k of karts) {
    const px = mx + (k.x - (TCX - 1200)) * sx, py = my + (k.y - (TCY - 750)) * sy;
    g.fillStyle = k.isPlayer ? "#fff" : KART_COL[k.key];
    g.beginPath(); g.arc(px, py, k.isPlayer ? 4 : 2.6, 0, Math.PI * 2); g.fill();
    if (k.isPlayer) { g.strokeStyle = "#ffd166"; g.lineWidth = 1.5;
      g.beginPath(); g.arc(px, py, 5.5, 0, Math.PI * 2); g.stroke(); }
  }
}

function drawRace() {
  const player = karts.find(k => k.isPlayer);
  g.save();
  g.scale(DPR, DPR);
  g.save();
  g.translate(W / 2 - player.x, H / 2 - player.y);
  drawTrack();
  for (const p of fx) {
    g.globalAlpha = Math.max(0, 1 - p.t / 40);
    g.fillStyle = p.c; g.fillRect(p.x - 2.5, p.y - 2.5, 5, 5);
    g.globalAlpha = 1;
  }
  for (const k of [...karts].sort((a, b) => a.y - b.y)) drawKart(k);
  // name pill above the player
  g.font = "800 11px 'Avenir Next',Arial"; g.textAlign = "center"; g.textBaseline = "middle";
  const nm = CHARS[player.key].name, tw2 = g.measureText(nm).width;
  g.fillStyle = NAME_COL[player.key];
  rr(player.x - tw2 / 2 - 7, player.y - 52, tw2 + 14, 16, 8); g.fill();
  g.fillStyle = "#fff"; g.fillText(nm, player.x, player.y - 44);
  g.restore();

  drawHUD(player);

  if (game.state === "count") {
    const n = 3 - Math.floor(game.timer / 60);
    g.textAlign = "center"; g.textBaseline = "middle";
    g.font = "900 " + Math.min(W / 4, 130) + "px 'Avenir Next',Arial";
    const scale = 1 + (1 - (game.timer % 60) / 60) * 0.25;
    g.save(); g.translate(W / 2, H * 0.4); g.scale(scale, scale);
    outlineText("" + n, 0, 0, ["#ff6b6b", "#ffd166", "#7ec850"][3 - n] || "#fff");
    g.restore();
  } else if (game.state === "race" && game.timer < 240) {
    g.textAlign = "center"; g.textBaseline = "middle";
    g.font = "900 " + Math.min(W / 5, 100) + "px 'Avenir Next',Arial";
    g.globalAlpha = Math.max(0, 1 - (game.timer - 180) / 60);
    outlineText("GO!", W / 2, H * 0.4, "#7ec850");
    g.globalAlpha = 1;
  }

  if (game.state === "done") drawResults(player);
  g.restore();
}

function drawResults(player) {
  const a = Math.min(1, game.timer / 40);
  g.fillStyle = "rgba(30,40,70," + (a * 0.72).toFixed(2) + ")";
  g.fillRect(0, 0, W, H);
  if (game.timer < 20) return;
  g.textAlign = "center"; g.textBaseline = "middle";
  g.font = "900 " + Math.min(W / 9, 52) + "px 'Avenir Next',Arial";
  const med = player.place === 1 ? "🏆" : player.place === 2 ? "🥈" : player.place === 3 ? "🥉" : "🏁";
  outlineText(med + " " + ordinal(player.place) + " place!", W / 2, H * 0.2, player.place === 1 ? "#ffd166" : "#fff");
  // podium for the top three so far
  const top3 = rank().slice(0, 3);
  const pw = Math.min(W * 0.2, 110), baseY = H * 0.62;
  const podX = [W / 2, W / 2 - pw - 10, W / 2 + pw + 10];
  const podH = [86, 60, 42];
  top3.forEach((k, i) => {
    const x = podX[i], ph = podH[i];
    g.fillStyle = ["#ffd166", "#c8ccd8", "#c98f5a"][i];
    rr(x - pw / 2, baseY - ph, pw, ph, 8); g.fill();
    g.fillStyle = "rgba(0,0,0,.35)";
    g.font = "900 " + ph * 0.42 + "px 'Avenir Next',Arial";
    g.fillText(i + 1, x, baseY - ph / 2);
    const hop = Math.abs(Math.sin(game.timer * 0.1 + i)) * 8;
    g.save(); g.translate(x, baseY - ph - 4 - hop);
    const ks = KID_SCALE(k.key) * 1.5;
    g.scale(ks, ks);
    drawKid(g, 0, 0, CHARS[k.key], Math.floor(game.timer / 20) % 2, i === 2 ? -1 : 1, false, false);
    g.restore();
  });
  // confetti
  for (let i = 0; i < 26; i++) {
    const cy2 = ((game.timer * (1.5 + (i % 5) * 0.5) + i * 97) % (H + 40)) - 20;
    g.fillStyle = ["#ff6b9d", "#4dabf7", "#ffd43b", "#69db7c", "#b197fc"][i % 5];
    g.save(); g.translate((i * 137) % W, cy2); g.rotate(game.timer * 0.05 + i);
    g.fillRect(-4, -2, 8, 4); g.restore();
  }
  if (game.timer > 90 && Math.floor(game.timer / 30) % 2 === 0) {
    g.font = "700 " + Math.min(W / 20, 20) + "px 'Avenir Next',Arial";
    outlineText("tap to race again", W / 2, H * 0.82, "#aee0ff");
  }
}

function drawTitle() {
  g.save(); g.scale(DPR, DPR);
  const sky = g.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, "#6fb4ec"); sky.addColorStop(0.7, "#c8ecff"); sky.addColorStop(0.72, "#7ec850"); sky.addColorStop(1, "#4d9e3c");
  g.fillStyle = sky; g.fillRect(0, 0, W, H);
  // a little road across the bottom with karts parading
  g.fillStyle = "#4a4f5c"; g.fillRect(0, H * 0.8, W, H * 0.1);
  g.strokeStyle = "rgba(255,209,102,.9)"; g.lineWidth = 3; g.setLineDash([16, 14]);
  g.beginPath(); g.moveTo(0, H * 0.85); g.lineTo(W, H * 0.85); g.stroke(); g.setLineDash([]);
  KEYS.forEach((k, i) => {
    const x = ((game.timer * 1.3 + i * (W + 240) / KEYS.length) % (W + 240)) - 120;
    g.save(); g.translate(x, H * 0.85);
    g.fillStyle = "rgba(0,0,0,.2)"; g.beginPath(); g.ellipse(0, 6, 18, 8, 0, 0, Math.PI * 2); g.fill();
    g.save(); g.fillStyle = "#23262e"; rr(-13, 0, 8, 6, 2); g.fill(); rr(6, 0, 8, 6, 2); g.fill();
    g.fillStyle = KART_COL[k]; rr(-15, -8, 31, 15, 7); g.fill(); g.restore();
    const ks = KID_SCALE(k) * 0.9;
    g.save(); g.translate(0, -6); g.scale(ks, ks);
    drawKid(g, 0, 0, CHARS[k], Math.floor(game.timer / 14) % 2, 1, false, true);
    g.restore(); g.restore();
  });

  g.textAlign = "center"; g.textBaseline = "middle";
  const big = Math.min(W / 8, 54);
  g.font = "900 " + big + "px 'Avenir Next',Arial";
  outlineText("MAGIC KART", W / 2, Math.max(H * 0.08, 46), "#ffd166", big);
  g.font = "700 " + Math.min(W / 26, 16) + "px 'Avenir Next',Arial";
  outlineText("✨ a racing game by Jules & Nora ✨", W / 2, Math.max(H * 0.08, 46) + big * 0.75, "#fff");
  g.font = "800 " + Math.min(W / 22, 18) + "px 'Avenir Next',Arial";
  outlineText("Pick your racer!", W / 2, Math.max(H * 0.08, 46) + big * 1.45, "#fff");

  // hero cards
  game.titleCards = [];
  const n = KEYS.length, perRow = Math.ceil(n / 2), rows = 2, rowGap = 10;
  const gap = Math.min(10, W * 0.016);
  const cw = Math.min((W * 0.96 - (perRow - 1) * gap) / perRow, 120, H * 0.3);
  const ch = Math.min(cw * 1.2, H * 0.24);
  const cy0 = Math.min(H * 0.34, H * 0.78 - rows * ch - rowGap);
  KEYS.forEach((k, i) => {
    const row = Math.floor(i / perRow);
    const inRow = row === rows - 1 ? n - perRow : perRow;
    const idx = i - row * perRow;
    const rowW = inRow * cw + (inRow - 1) * gap, startX = W / 2 - rowW / 2;
    const sx = startX + idx * (cw + gap), sy = cy0 + row * (ch + rowGap);
    const bounce = Math.sin(game.timer * 0.08 + i * 2) * 3;
    g.fillStyle = "rgba(255,255,255,.92)";
    rr(sx, sy, cw, ch, 12); g.fill();
    g.lineWidth = 3.5; g.strokeStyle = KART_COL[k];
    rr(sx, sy, cw, ch, 12); g.stroke();
    g.save();
    g.translate(sx + cw / 2, sy + ch * 0.62 + bounce);
    const ks = (cw / 48) * (k === "nora" ? 1.5 : 1);
    g.scale(ks, ks);
    drawKid(g, 0, 0, CHARS[k], Math.floor(game.timer / 20) % 2, 1, false, true);
    g.restore();
    let nm = CHARS[k].name, fs = cw / 6.6;
    g.font = "900 " + fs + "px 'Avenir Next',Arial";
    while (g.measureText(nm).width > cw - 14 && fs > 6.5) { fs -= 0.5; g.font = "900 " + fs + "px 'Avenir Next',Arial"; }
    const ntw = g.measureText(nm).width, pillH = fs + 6, pillW = Math.min(cw - 4, ntw + 12), py = sy + ch - cw / 9;
    g.fillStyle = NAME_COL[k];
    rr(sx + cw / 2 - pillW / 2, py - pillH / 2, pillW, pillH, pillH / 2); g.fill();
    g.textAlign = "center"; g.textBaseline = "middle";
    g.fillStyle = "#fff"; g.fillText(nm, sx + cw / 2, py + 0.5);
    game.titleCards.push({ key: k, sx, sy, sw: cw, sh: ch });
  });
  g.font = "600 " + Math.min(W / 26, 15) + "px 'Avenir Next',Arial";
  outlineText("3 laps • grab coins • ? boxes give a 🍄 boost!", W / 2, H * 0.78 + 4, "#fff");
  g.restore();
}

/* ------------------------------ games menu ------------------------------ */
const gBtn = document.getElementById("gamesBtn"), gMenu = document.getElementById("gamesMenu");
gBtn.addEventListener("click", e => { e.stopPropagation(); gMenu.hidden = !gMenu.hidden; });
document.addEventListener("pointerdown", e => {
  if (!gMenu.hidden && !gMenu.contains(e.target) && e.target !== gBtn) gMenu.hidden = true;
});

/* ------------------------------ main loop ------------------------------ */
function frame() {
  update();
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.clearRect(0, 0, cv.width, cv.height);
  if (game.state === "title") drawTitle();
  else drawRace();
  const showSteer = game.state === "race" || game.state === "count";
  btnL.style.display = btnR.style.display = showSteer ? "flex" : "none";
  if (!showSteer) btnB.style.display = "none";
  requestAnimationFrame(frame);
}
frame();
</script>
</body>
